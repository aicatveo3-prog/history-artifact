<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한능검 빈출 선택지 표 · 유물로 배우는 한국사</title>
<style>
  :root{
    --bg:#E9E3D4; --card:#FCFAF5; --ink:#2A2622; --green:#4C7A6B; --green-d:#3a5f53;
    --muted:#8a7f68; --line:#d9cfb8; --zebra:#F6F2E8; --chip:#F3EEE0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, #F1ECDF 0%, #E4DDCC 100%);
    color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  a{color:var(--green);text-decoration:none}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .ttl{font-family:'Noto Serif KR',serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .back{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--card);
    border:1px solid #E0D8C4;border-radius:999px;font-size:13px;font-weight:700;color:#5f5748;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .back:hover{background:var(--chip)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .search{flex:1;min-width:170px;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid #E0D8C4;border-radius:11px;padding:9px 13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .search input{border:none;outline:none;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--ink)}
  .btn{padding:9px 13px;background:var(--card);border:1px solid #E0D8C4;border-radius:11px;font:inherit;
    font-size:13px;font-weight:700;color:#5f5748;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:nowrap}
  .btn:hover{background:var(--chip)}
  .btn.on{background:var(--ink);color:#F4EFE2;border-color:var(--ink)}
  .seg{display:inline-flex;border:1px solid #E0D8C4;border-radius:11px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .seg button{padding:9px 13px;background:var(--card);border:none;font:inherit;font-size:13px;font-weight:700;color:#6f6550;cursor:pointer}
  .seg button.on{background:var(--green);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{padding:7px 13px;border:1px solid #E0D8C4;border-radius:999px;background:var(--card);color:#6f6550;
    font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
  .chip:hover{background:var(--chip)}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .count{font-size:12.5px;color:var(--muted);font-weight:600;margin:2px 2px 10px}
  .count b{color:var(--green)}
  .grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);
    box-shadow:0 4px 16px rgba(74,63,40,.08);-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;table-layout:fixed;font-size:13.5px}
  colgroup col.c-num{width:3.2%} colgroup col.c-unit{width:9%} colgroup col.c-era{width:7.5%}
  colgroup col.c-cnt{width:8.5%} colgroup col.c-kw{width:12%} colgroup col.c-ans{width:8.5%}
  colgroup col.c-c1{width:24.5%} colgroup col.c-desc{width:26.8%}
  thead th{position:sticky;top:0;z-index:3;background:var(--green);color:#fff;font-weight:700;
    padding:11px 10px;text-align:left;cursor:pointer;user-select:none;border-right:1px solid rgba(255,255,255,.14);
    word-break:keep-all}
  thead th:hover{background:var(--green-d)}
  thead th .ar{opacity:.5;font-size:11px;margin-left:2px}
  thead th.act .ar{opacity:1}
  th.rownum,td.rownum{position:sticky;left:0;z-index:2;background:#EFE7D5;color:var(--muted);
    text-align:center;font-weight:700;border-right:1px solid var(--line)}
  thead th.rownum{z-index:4;background:var(--green)}
  tbody td{padding:10px 11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    vertical-align:top;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
  tbody tr:nth-child(even) td{background:var(--zebra)}
  tbody tr:nth-child(even) td.rownum{background:#EAE1CD}
  tbody tr:hover td{background:#EFF3EC}
  tbody tr:hover td.rownum{background:#dfe8dc}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
  td.era{font-weight:700;color:#6f6550;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.kw{font-weight:700;color:var(--ink)}
  td.unit{font-weight:600;color:#6f6550}
  .ans-badge{display:inline-block;padding:2px 9px;border-radius:999px;background:#EAF1EE;border:1px solid #d5e5df;
    color:var(--green);font-weight:700;font-size:12px}
  td.desc{color:#514a3c;font-size:13px}
  .cnt-bar{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,#4C7A6B,#8bb0a2);vertical-align:middle;margin-left:6px}
  body.hideans td.ans .ans-badge{color:transparent;background:#E7DFCC;border-color:#dcd0b6;position:relative;cursor:pointer;min-width:48px}
  body.hideans td.ans .ans-badge::after{content:'?';color:var(--muted);position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:800}
  body.hideans td.ans .ans-badge.reveal{color:var(--green);background:#EAF1EE;border-color:#d5e5df}
  body.hideans td.ans .ans-badge.reveal::after{content:''}
  footer{margin-top:22px;font-size:11.5px;color:#a89a78;line-height:1.7;text-align:center}
  footer a{color:#8a7f68;text-decoration:underline}
  @media (max-width:560px){
    .ttl{font-size:19px}.wrap{padding:16px 10px 50px}
    table{font-size:12.5px}thead th,tbody td{padding:8px 8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="ttl">📊 한능검 빈출 선택지 표</div>
      <div class="sub">한국사능력검정시험 단원별 핵심 키워드 · 총 <span id="tot">0</span>개 · 기본 시간순 정렬</div>
    </div>
    <a class="back" href="index.html">← 유물 학습으로</a>
  </header>

  <div class="chips" id="unitChips"></div>

  <div class="toolbar">
    <label class="search">🔎 <input id="q" type="search" placeholder="키워드·선택지·설명 검색…" autocomplete="off"></label>
    <span class="seg" id="modeSeg">
      <button data-m="chrono" class="on" type="button">🕰 시간순</button>
      <button data-m="freq" type="button">🔥 빈출순</button>
    </span>
    <button class="btn" id="hideBtn" type="button">🙈 정답 가리기</button>
    <button class="btn" id="csvBtn" type="button">📥 CSV</button>
  </div>

  <div class="count" id="count"></div>

  <div class="grid-wrap">
    <table>
      <colgroup>
        <col class="c-num"><col class="c-unit"><col class="c-era"><col class="c-cnt">
        <col class="c-kw"><col class="c-ans"><col class="c-c1"><col class="c-desc">
      </colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <footer>
    출처 · 한국사능력검정시험 기출문제 | 원자료 정리: <b>꿈꾸는라이언</b>
    (<a href="https://github.com/dreaming-ryan/korean-history2" target="_blank" rel="noopener">github.com/dreaming-ryan/korean-history2</a>)<br>
    연대는 학습 편의를 위한 대략값이며, 이 표는 학습 목적으로 정리·재구성한 자료입니다.
  </footer>
</div>

<script>

Year": 1592, "yl": "임진왜란"}, {"unit": "조선시대", "unitIcon": "📜", "r": 7, "cnt": 20, "kw": "탕평비", "ans": "영조", "ansType": "mid", "c1": "붕당 정치의 폐해를 경계하기 위해 탕평비를 건립하였다.", "desc": "영조는 성균관 앞에 탕평비를 세워 편당 없이 공평하게 인재를 등용하겠다는 탕평 의지를 천명하고, 노론·소론의 균형 등용을 실시하였다.", "sortYear": 1742, "yl": "영조"}, {"unit": "조선시대", "unitIcon": "📜", "r": 8, "cnt": 17, "kw": "직전법", "ans": "세조", "ansType": "early", "c1": "현직 관리에게만 수조권을 지급하는 직전법을 시행하였다.", "desc": "세조는 1466년 현직 관리에게만 수조지를 지급하는 직전법을 시행하여 세습되던 수신전·휼양전을 폐지하고 국가 재정을 강화하였다.", "sortYear": 1466, "yl": "1466"}, {"unit": "조선시대", "unitIcon": "📜", "r": 9, "cnt": 16, "kw": "승정원", "ans": "승정원", "ansType": "organ", "c1": "왕의 비서 기관으로 왕명의 출납을 관장하였다.", "desc": "승정원은 왕명의 출납을 담당한 왕의 비서 기관으로 은대(銀臺)라고도 불렸으며, 도승지를 수장으로 좌·우승지 등 6명의 승지가 6조를 각각 분담하였다.", "sortYear": 1405, "yl": "조선 초"}, {"unit": "조선시대", "unitIcon": "📜", "r": 10, "cnt": 16, "kw": "균역법", "ans": "균역법", "ansType": "law", "c1": "재정을 보충하기 위해 지주에게 결작을 부과하였다.", "desc": "영조는 1750년 군포 부담을 2필에서 1필로 줄이는 균역법을 시행하였으며, 부족한 재원을 충당하기 위해 결작·선무군관포·어염세·선박세를 추가로 거두었다.", "sortYear": 1750, "yl": "1750"}, {"unit": "조선시대", "unitIcon": "📜", "r": 11, "cnt": 14, "kw": "나선 정벌", "ans": "효종", "ansType": "mid", "c1": "나선 정벌에 조총 부대를 파견하였다.", "desc": "효종 때 청의 요청으로 변급(1차)·신류(2차)가 이끄는 조총 부대를 흑룡강 유역에 파견하여 러시아군과 전투를 벌인 나선 정벌에 참전하였다.", "sortYear": 1654, "yl": "효종"}, {"unit": "조선시대", "unitIcon": "📜", "r": 12, "cnt": 13, "kw": "홍문관", "ans": "홍문관", "ansType": "organ", "c1": "사헌부, 사간원과 함께 3사로 불렸다.", "desc": "성종 때 설치된 홍문관은 왕의 학문 자문·경연 담당 기관으로 옥당(玉堂)이라고도 불렸으며, 사헌부(감찰)·사간원(간쟁)과 함께 3사를 이루었다.", "sortYear": 1478, "yl": "성종"}, {"unit": "조선시대", "unitIcon": "📜", "r": 13, "cnt": 13, "kw": "사르후 전투", "ans": "광해군", "ansType": "mid", "c1": "강홍립 부대가 사르후 전투에 참전하였다.", "desc": "광해군은 명의 원군 요청에 따라 강홍립을 도원수로 1만 3천 명의 군대를 파견하였으나, 강홍립은 후금에 투항하는 중립 외교를 실행하였다.", "sortYear": 1619, "yl": "광해군"}, {"unit": "조선시대", "unitIcon": "📜", "r": 14, "cnt": 13, "kw": "대동법", "ans": "대동법", "ansType": "law", "c1": "관청에 물품을 조달하는 공인이 등장하였다.", "desc": "광해군 때 경기도에 처음 시행된 대동법은 집집마다 부과하던 ": "🚂", "r": 47, "cnt": 3, "kw": "호포제", "ans": "흥선대원군", "ansType": "heungseon", "c1": "호포제를 시행하여 양반에게도 군포를 징수하였다.", "desc": "흥선대원군은 종래 상민에게만 부과하던 군포를 양반에게도 징수하는 호포제를 시행하여 재정을 확충하고 양반 특권을 축소하였으며, 서원 철폐와 비변사 혁파도 단행하였다.", "sortYear": 1871, "yl": "1871"}, {"unit": "개화기", "unitIcon": "🚂", "r": 48, "cnt": 3, "kw": "보빙사", "ans": "1883년", "ansType": "year", "c1": "민영익을 대표로 한 보빙사가 미국에 파견되었다.", "desc": "1883년 조미수호통상조약 체결 이후 민영익을 전권대신으로 한 보빙사가 미국에 파견되어 대통령을 예방하고 근대 문물을 시찰하였으며, 유길준은 이때 미국에 남아 유학하였다.", "sortYear": 1883, "yl": "1883"}, {"unit": "개화기", "unitIcon": "🚂", "r": 49, "cnt": 3, "kw": "서재필", "ans": "독립신문", "ansType": "person", "c1": "서재필이 창간한 우리나라 최초의 민간 신문이었다.", "desc": "서재필은 1896년 우리나라 최초의 민간 신문인 독립신문을 창간하여 순한글과 영문판으로 발행하였으며, 같은 해 독립협회를 설립하여 자주 국권 운동을 이끌었다.", "sortYear": 1896, "yl": "1896"}, {"unit": "개화기", "unitIcon": "🚂", "r": 50, "cnt": 3, "kw": "양기탁·베델", "ans": "대한매일신보", "ansType": "media", "c1": "양기탁과 영국인 베델이 창간한 신문이었다.", "desc": "대한매일신보는 1904년 양기탁과 영국인 베델(배설)이 창간하였으며, 베델의 외국인 신분 덕분에 일제의 검열을 피해 항일 논조의 기사를 게재하고 의병 활동을 호의적으로 보도하였다.", "sortYear": 1904, "yl": "1904"}, {"unit": "일제강점기", "unitIcon": "🕊️", "r": 1, "cnt": 19, "kw": "조선 혁명 선언", "ans": "의열단", "ansType": "secret", "c1": "신채호가 쓴 조선 혁명 선언을 활동 지침으로 삼았다.", "desc": "1923년 신채호가 작성한 조선 혁명 선언은 의열단의 행동 지침으로, 외교론·준비론을 비판하고 민중의 직접 혁명을 통한 독립을 주장하였다.", "sortYear": 1923, "yl": "1923"}, {"unit": "일제강점기", "unitIcon": "🕊️", "r": 2, "cnt": 12, "kw": "영릉가 전투", "ans": "조선혁명군", "ansType": "military", "c1": "중국 의용군과 연합하여 영릉가 전투에서 승리하였다.", "desc": "양세봉이 이끄는 조선혁명군은 남만주에서 중국 의용군과 연합하여 영릉가·흥경성 전투에서 일본군을 격퇴하며 한·중 연합 작전의 성과를 거두었다.", "sortYear": 1932, "yl": "1932"}, {"unit": "일제강점기", "unitIcon": "🕊️", "r": 3, "cnt": 12, "kw": "독립 공채", "ans": "대한민국 임시정부", "ansType": "impgov", "c1": "독립운동 자금 마련을 위해 독립 공채를 발행하였다.", "desc": "대한민국 임시정부는 독립 공채를 발행하고 연통제·교통국을 운영하여 자금과 정보를 수집하였으며, 구미 위원부를 통한 외교 활동과 한국독립운동지혈사 등의 편찬 사업도 병행하였다.", "sortYear": 1919, "yl": "1919"}, {"unit": "일제강점기", "unitIcon": "🕊️", "r": 4, "cnt": 12, "kw": "문화 통치", "ans": "3.1운동", " const UNITS = [];
DATA.forEach(d=>{ if(!UNITS.find(u=>u.name===d.unit)) UNITS.push({name:d.unit, icon:d.unitIcon}); });
UNITS.sort((a,b)=>uidx(a.name)-uidx(b.name));
const maxCnt = Math.max.apply(null, DATA.map(d=>d.cnt));

let state = {unit:'all', q:'', mode:'chrono', sortKey:null, sortDir:1};

const $ = s=>document.querySelector(s);
document.getElementById('tot').textContent = DATA.length;

const chipsEl = document.getElementById('unitChips');
function renderChips(){
  const items = [{name:'all', icon:'📚', label:'전체'}].concat(UNITS.map(u=>({name:u.name, icon:u.icon, label:u.name})));
  chipsEl.innerHTML = items.map(it=>
    `<span class="chip${state.unit===it.name?' on':''}" data-u="${it.name}">${it.icon} ${it.label}</span>`).join('');
}
chipsEl.addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(!c) return;
  state.unit=c.dataset.u; render(); });

const headEl = document.getElementById('head');
function renderHead(){
  let h = '<th class="rownum">#</th>';
  h += COLS.map(c=>{
    const act = state.sortKey===c.k;
    const ar = act ? (state.sortDir>0?'▲':'▼') : '↕';
    return `<th data-k="${c.k}" class="${act?'act':''}">${c.label}<span class="ar">${ar}</span></th>`;
  }).join('');
  headEl.innerHTML = h;
}
headEl.addEventListener('click', e=>{ const th=e.target.closest('th[data-k]'); if(!th) return;
  const k=th.dataset.k;
  if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=1;}
  state.mode=null; render(); });

document.getElementById('modeSeg').addEventListener('click', e=>{
  const b=e.target.closest('button[data-m]'); if(!b) return;
  state.mode=b.dataset.m; state.sortKey=null; render(); });

function esc(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function current(){
  let rows = DATA.slice();
  if(state.unit!=='all') rows = rows.filter(d=>d.unit===state.unit);
  if(state.q){ const q=state.q.toLowerCase();
    rows = rows.filter(d=> (d.kw+' '+d.ans+' '+d.c1+' '+d.desc+' '+d.unit+' '+d.yl).toLowerCase().includes(q)); }
  if(state.mode==='chrono'){
    rows.sort((a,b)=> (a._u-b._u) || (a.sortYear-b.sortYear) || (b.cnt-a.cnt));
  } else if(state.mode==='freq'){
    rows.sort((a,b)=> (a._u-b._u) || (b.cnt-a.cnt) || (a.sortYear-b.sortYear));
  } else if(state.sortKey){
    const c=COLS.find(x=>x.k===state.sortKey);
    rows.sort((a,b)=>{
      if(c.type==='num'){ return (a.cnt-b.cnt)*state.sortDir; }
      if(c.type==='year'){ return (a.sortYear-b.sortYear)*state.sortDir; }
      return String(a[state.sortKey]).localeCompare(String(b[state.sortKey]),'ko')*state.sortDir;
    });
  }
  return rows;
}

function render(){
  renderChips(); renderHead();
  const rows = current();
  document.getElementById('body').innerHTML = rows.map((d,i)=>{
    const bar = `<span class="cnt-bar" style="width:${Math.max(5,Math.round(d.cnt/maxCnt*40))}px"></span>`;
    return `<tr>
      <td class="rownum">${i+1}</td>
      <td class="unit">${esc(d.unitIcon+' '+d.unit)}</td>
      <td class="era">${esc(d.yl)}</td>
      <td class="num">${d.cnt}${bar}</td>
      <td class="kw">${esc(d.kw)}</td>
      <td class="ans"><span class="ans-badge">${esc(d.ans)}</span></td>
      <td class="c1">${esc(d.c1)}</td>
      <td class="desc">${esc(d.desc)}</td>
    </tr>`;
  }).join('');
  document.getElementById('count').innerHTML = `전체 ${DATA.length}개 중 <b>${rows.length}개</b> 표시`;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===state.mode));
}

$('#q').addEventListener('input', e=>{ state.q=e.target.value.trim(); render(); });

const hideBtn = $('#hideBtn');
hideBtn.addEventListener('click', ()=>{
  document.body.classList.toggle('hideans');
  const on=document.body.classList.contains('hideans');
  hideBtn.classList.toggle('on',on);
  hideBtn.textContent = on ? '👁 정답 보이기' : '🙈 정답 가리기';
});
document.getElementById('body').addEventListener('click', e=>{
  if(!document.body.classList.contains('hideans')) return;
  const b=e.target.closest('.ans-badge'); if(b) b.classList.toggle('reveal');
});

$('#csvBtn').addEventListener('click', ()=>{
  const rows=current();
  const head=['단원','연대','출제횟수','핵심 키워드','정답','대표 기출 선택지','설명'];
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  rows.forEach(d=> lines.push([d.unit,d.yl,d.cnt,d.kw,d.ans,d.c1,d.desc].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='한능검_빈출선택지.csv'; document.body.appendChild(a); a.click(); a.remove();
});

render();
</script>
</body>
</html>

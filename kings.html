고 경학 박사·의학 박사를 파견해 지방 교육을 맡겼다. 국자감을 정비하고 의창·상평창을 두어 유교 정치의 기틀을 세웠다.","u":"고려시대","c":1},{"k":"저고여 피살","y":"1225","s":"몽골의 사신 저고여가 피살된 곳을 조사한다.","d":"1225년 고려에 왔던 몽골 사신 저고여가 돌아가는 길에 살해되자 몽골은 이를 구실로 국교를 끊고 1231년 침입하였다. 이후 최우는 강화도로 도읍을 옮겨 장기 항전에 들어갔다.","u":"고려시대","c":1},{"k":"김보당의 난","y":"1173","s":"김보당이 무신 정권에 저항하여 봉기한 곳을 파악한다.","d":"1173년 동북면 병마사 김보당이 의종의 복위를 내걸고 무신 정권에 맞서 군사를 일으켰으나 진압되었고, 이 과정에서 의종이 경주에서 살해되었다. 이듬해 서경에서는 조위총의 난이 일어났다.","u":"고려시대","c":1},{"k":"충주산성 전투","y":"1253","s":"방호별감 김윤후가 군인과 백성을 이끌고 충주산성에서 승리한 것을 기념하여 세운 것이야.","d":"1253년 몽골의 5차 침입 때 충주산성 방호별감 김윤후가 노비 문서를 불태우며 백성과 함께 싸워 70여 일간 성을 지켜냈다. 앞서 1232년 처인성에서 살리타를 사살한 인물과 같은 사람이다.","u":"고려시대","c":1},{"k":"서적포","y":"1101","s":"서적포를 설치하여 출판을 담당하게 하였다.","d":"숙종은 국자감에 서적포를 두어 책의 간행과 보급을 맡겼고, 의천의 건의로 주전도감을 설치해 해동통보 등 화폐를 만들었다. 윤관의 건의로 별무반을 편성한 것도 숙종 때다.","u":"고려시대","c":1},{"k":"상형청자","y":"12세기","s":"고려 상형청자 특별전","d":"사람이나 동물, 식물의 모양을 본떠 만든 고려청자로, 12세기 순청자 전성기의 뛰어난 조형성을 보여 준다. 청자 사자형 뚜껑 향로, 청자 어룡형 주전자 등이 대표작이다.","u":"고려시대","c":1},{"k":"황비창천 명 거울","y":"고려","s":"황비창천 명 거울은 항해하는 배가 표현되어 있습니다.","d":"밝게 빛나는 창성한 하늘이라는 뜻의 황비창천이 새겨진 고려의 청동 거울로, 풍랑을 헤치는 배가 새겨져 있어 당시 무역선의 모습을 짐작하게 한다. 고려는 벽란도를 통해 송·일본은 물론 동남아시아·아라비아 상인과도 교역하였다.","u":"고려시대","c":1},{"k":"통문관","y":"1276","s":"외국어 교육과 통역을 관장하는 통문관을 설치하였다.","d":"1276년 충렬왕은 한어를 비롯한 외국어 교육과 통역을 맡는 통문관을 설치하였으며, 이는 뒤에 사역원으로 이어졌다. 원 간섭기에 몽골어 통역의 수요가 커진 사정이 배경이다.","u":"고려시대","c":1},{"k":"제국대장공주","y":"1274","s":"원의 황녀, 겁령구들과 입국하다","d":"충렬왕은 세자 시절 원 세조의 딸 제국대장공주와 혼인하였고, 이후 고려 왕은 대대로 원 공주와 혼인하며 원의 부마국이 되었다. 공주를 따라온 사속인 겁령구들이 권세를 부렸고, 왕실 호칭이 낮아지고 변발·호복이 유행하였다.","u":"고려시대","c":1},{"k":"안경공","y":"1269","s":"원종을 폐위하고 안경공 창을 즉위시켰다.","d":"1269년 무신 집권자 임연이 개경 환도를 추진하던 원종을 폐하고 그 동생 안경공 창을 세웠으나, 원의 압력으로 넉 달 만에 원종이 복위하였다. 이 사건으로 무신 정권이 무너지고 1270년 개경 환도가 이루어지자 삼별초가 항쟁을 시작하였다.","u":"고려시대","c":1},{"k":"만월대","y":"고려","s":"고려 왕조의 궁궐터였던 만월대","d":"개성 송악산 기슭에 있던 고려의 정궁 터로, 경사지를 이용한 웅장한 축대 위에 건물을 세운 것이 특징이다. 개성에는 태조 왕건과 신혜왕후를 모신 현릉, 정몽주를 기리는 숭양서원, 거란 낙타가 굶어 죽은 만부교도 있다.","u":"고려시대","c":1},{"k":"수덕사 대웅전","y":"1308","s":"수덕사 대웅전의 공포 양식을 알아본다.","d":"1308년에 지은 예산 수덕사 대웅전은 지붕 무게를 기둥에만 전달하는 주심포 양식의 대표 건물로, 배흘림기둥과 맞배지붕이 어우러진 고려 목조 건축의 백미다. 안동 봉정사 극락전, 영주 부석사 무량수전과 함께 고려 목조 건축으로 꼽힌다.","u":"고려시대","c":1},{"k":"편경과 박연","y":"1430","s":"박연이 만든 편경은 중국의 것보다 음높이가 정확하며","d":"세종 때 박연은 남양에서 나는 경석으로 편경을 만들어 우리 실정에 맞게 아악을 정비하였고, 정간보라는 악보를 창안하였다. 성종 때 성현 등이 이를 집대성해 악학궤범을 편찬하였다.","u":"조선시대","c":1},{"k":"4군 개척과 이만주","y":"1433","s":"최윤덕이 이만주 부대를 정벌하였다.","d":"1433년 세종의 명으로 최윤덕이 압록강 유역 여진 추장 이만주를 정벌하고 4군을 설치하였으며, 김종서는 두만강 일대에 6진을 개척하였다. 이로써 오늘날과 비슷한 국경선이 확정되었다.","u":"조선시대","c":1},{"k":"무역소","y":"세종","s":"경성과 경원에 무역소를 두었다.","d":"조선은 여진을 회유하기 위해 경성과 경원에 무역소를 두어 국경 무역을 허용하고 귀순한 이들에게 관직과 토지를 주었다. 한편으로는 4군 6진을 개척하는 강경책을 함께 썼다.","u":"조선시대","c":1},{"k":"남이의 옥","y":"1468","s":"유자광의 고변으로 남이가 처형되었다.","d":"1468년 예종 즉위 직후 유자광의 고변으로 남이가 역모 혐의를 받아 강순 등과 함께 처형되었다. 남이는 세조 때 이시애의 난 진압과 건주위 여진 정벌에 공을 세운 인물이다.","u":"조선시대","c":1},{"k":"갑자사화","y":"1504","s":"폐비 윤씨 사사 사건을 빌미로 신하들을 숙청하는 등 폭정을 자행하다가 반정으로 폐위되었습니다.","d":"1504년 연산군은 어머니 폐비 윤씨의 사사 사건을 구실로 관련된 신하들을 대거 죽인 갑자사화를 일으켰다. 폭정이 이어지자 1506년 중종반정으로 폐위되어 교동도에 유배되었다.","u":"조선시대","c":1},{"k":"을사사화","y":"1545","s":"외척 간의 권력 다툼으로 윤임이 제거되었다.","d":"1545년 명종이 어린 나이로 즉위하자 외척인 소윤 윤원형 일파가 대윤 윤임 일파를 제거한 사화로, 이때 많은 사림도 함께 화를 입었다. 무오·갑자·기묘사화에 이은 네 번째 사화다.","u":"조선시대","c":1},{"k":"이치 전투","y":"1592","s":"전라 절제사 권율과 동복 현감 황진이 이끄는 관군은 치열한 전투 끝에 적의 진격을 저지하였다.","d":"1592년 권율과 황진이 금산에서 전주로 넘어가는 길목인 이치에서 일본군을 막아내 전라도의 곡창 지대를 지켰다. 이 승리로 조선 수군의 배후가 안전해져 전쟁 초기 적의 전략에 큰 타격을 주었다.","u":"조선시대","c":1},{"k":"북관대첩","y":"1592","s":"정문부가 북관대첩을 이끌었다.","d":"임진왜란 때 함경도에서 정문부가 의병을 이끌고 길주·백탑교 등에서 일본군을 물리친 승리로, 그 공을 새긴 북관대첩비는 일제가 일본으로 가져갔다가 2005년 반환되어 북한에 전달되었다.","u":"조선시대","c":1},{"k":"총융청과 수어청","y":"1624","s":"한성 방어를 위하여 총융청과 수어청을 창설하였다.","d":"인조는 이괄의 난과 정묘호란을 겪으며 수도 외곽 방어를 위해 총융청과 수어청을 설치하였다. 선조 때의 훈련도감, 효종 때 강화된 어영청, 숙종 때의 금위영과 더불어 5군영이 완성되었다.","u":"조선시대","c":1},{"k":"영정법","y":"1635","s":"풍흉에 관계없이 전세 부담액을 고정한 이유를 분석한다.","d":"1635년 인조는 풍흉과 관계없이 토지 1결당 쌀 4~6두를 걷는 영정법을 실시하였다. 전세 부담은 줄었으나 각종 부가세가 더해져 농민의 실제 부담은 크게 나아지지 않았다.","u":"조선시대","c":1},{"k":"성호사설","y":"이익","s":"성호사설에서 나라를 망치는 여섯 가지 좀을 제시하였다.","d":"이익은 성호사설에서 나라를 좀먹는 여섯 가지로 노비·과거·양반·기교·승려·게으름을 들었고, 곽우록에서는 생계에 필요한 최소한의 토지를 영업전으로 정해 매매를 금지하는 한전론을 주장하였다.","u":"조선시대","c":1},{"k":"신문고 부활","y":"1771","s":"국초에 신문고를 설치하여 억울함을 지닌 백성들로 하여금 북을 쳐서 알리도록 하였는데","d":"태종 때 처음 설치된 신문고는 뒤에 폐지되었다가 영조 때 다시 설치되어 백성의 억울함을 왕에게 직접 알리는 통로가 되었다. 영조는 청계천 준천 사업을 위해 준천사를 두고 균역법을 실시하는 등 민생을 살폈다.","u":"조선시대","c":1},{"k":"연소답청","y":"조선 후기","s":"양반들이 봄날에 자연을 즐기고자 나들이하는 모습을 그린 작품","d":"조선 후기 풍속 화가 혜원 신윤복이 그린 작품으로, 양반들의 봄나들이를 감각적으로 묘사하였다. 그는 미인도·단오풍정 등에서 여성과 남녀 간의 정취를 즐겨 다뤄 김홍도와 대비된다.","u":"조선시대","c":1},{"k":"신유박해와 정약종","y":"1801","s":"이승훈이 잡혀가고 정약종도 죄인으로 몰려 죽었다고 하네.","d":"1801년 순조 즉위 후 노론 벽파가 남인 시파를 몰아내며 천주교를 탄압한 사건으로, 이승훈·정약종·주문모 신부 등이 처형되고 정약용은 강진, 정약전은 흑산도로 유배되었다. 이때 황사영 백서 사건이 일어났다.","u":"조선시대","c":1},{"k":"추사 고택","y":"조선 후기","s":"추사 고택 — 이황과 사단칠정 논쟁을 한 인물을 검색한다.","d":"충남 예산에 있는 추사 김정희의 생가로, 그가 나고 자란 곳이다. 김정희는 금석과안록에서 북한산비가 진흥왕 순수비임을 밝혔고, 제주 유배 시절 세한도와 추사체를 남겼다.","u":"조선시대","c":1},{"k":"영건도감","y":"1865","s":"경복궁 중건을 주관한 영건도감","d":"경복궁 중건을 맡은 임시 기구로, 공사비를 마련하기 위해 원납전을 걷고 당백전을 발행했으며 백성을 부역에 동원하였다. 왕실의 권위를 세우려 했으나 물가 폭등과 원성을 불러 흥선 대원군 실각의 한 원인이 되었다.","u":"개화기","c":1},{"k":"위정척사 상소","y":"1866","s":"기정진과 이항로가 상소를 하여 강화가 불가함을 말하자","d":"1860년대 이항로·기정진은 서양과의 통상을 반대하는 척화주전론을 폈고, 1876년 최익현은 왜양일체론으로 강화도 조약에 반대하였다. 1881년에는 조선책략 유포에 반발해 이만손 등이 영남 만인소를 올렸다.","u":"개화기","c":1},{"k":"광혜원","y":"1885","s":"알렌의 건의로 세워진 최초의 서양식 병원","d":"1885년 미국인 선교사 알렌의 건의로 세워진 우리나라 최초의 근대식 병원으로, 곧 제중원으로 이름을 바꾸었다. 배재 학당·이화 학당과 함께 개신교 선교사들이 남긴 근대 문물이다.","u":"개화기","c":1},{"k":"한성 전기 회사","y":"1898","s":"서대문과 청량리 사이를 오가는 전차를 운영하였어요.","d":"1898년 황실과 미국인 콜브란이 합작해 세운 회사로, 1899년 서대문~청량리 전차를 개통하고 전등·전화 사업도 맡았다. 전차 개통은 서울의 도시 생활을 크게 바꾼 사건이었다.","u":"개화기","c":1},{"k":"신돌석","y":"1906","s":"신돌석, 의병장으로 활약하다","d":"신돌석은 을사늑약 이후 경상도 영해·울진 일대에서 활약한 최초의 평민 의병장으로, 태백산 호랑이라 불렸다. 평민 의병장의 등장은 의병 전쟁이 전 계층으로 확대되었음을 보여 준다.","u":"개화기","c":1},{"k":"이재명","y":"1909","s":"이재명, 명동 성당 앞에서 이완용을 습격하다","d":"1909년 이재명이 명동 성당 앞에서 을사오적 이완용을 칼로 찔러 중상을 입혔다. 같은 해 안중근의 이토 히로부미 저격과 함께 국권 피탈에 맞선 의열 투쟁을 보여 준다.","u":"개화기","c":1},{"k":"융희","y":"1907","s":"뒤를 이은 순종은 융희라는 연호를 사용하였다.","d":"대한 제국은 고종이 광무, 순종이 융희라는 연호를 썼다. 순종은 1907년 고종의 강제 퇴위로 즉위해 1910년 국권 피탈까지 재위하였다.","u":"개화기","c":1},{"k":"신편제종교장총록","y":"1090","s":"신편제종교장총록을 편찬하였다.","d":"의천은 송·요·일본에서 불교 서적을 모아 목록집인 신편제종교장총록을 만들고, 이를 바탕으로 흥왕사에 교장도감을 두어 교장(속장경)을 간행하였다. 해동 천태종을 열고 교관겸수를 내세운 인물이다.","u":"고려시대","c":1},{"k":"전봉준 공초","y":"1894","s":"전봉준 공초, 갑오군정실기, 사발통문","d":"전봉준을 심문한 기록인 공초와 관군의 진압 기록인 갑오군정실기, 봉기를 결의한 사발통문 등 동학 농민 혁명 기록물은 2023년 유네스코 세계기록유산에 등재되었다. 부패한 지배층과 외세에 맞선 아래로부터의 개혁 운동이었음을 보여 준다.","u":"개화기","c":1},{"k":"신라 금관","y":"5~6세기","s":"금관총 금관, 황남대총 금관 등 현재까지 발견된 신라의 금관 6점이 최초로 한자리에 모이는 금관 특별전","d":"금관총·황남대총·천마총 등 경주의 돌무지덧널무덤(적석목곽분)에서 출토된 금관은 나뭇가지 모양(出자형) 세움 장식과 사슴뿔 모양 장식, 곱은옥이 특징이다. 적석목곽분은 도굴이 어려운 구조여서 껴묻거리가 풍부하게 남았으며, 이 금관들은 대체로 5~6세기 마립간 시기의 것으로 신라 왕권의 위상을 보여 준다. 벽화가 그려지기도 한 고구려·백제의 굴식 돌방무덤과는 무덤 양식과 출토 양상이 다르다.","u":"삼국시대","c":1},{"k":"고령 지산동 고분군","y":"대가야","s":"고령에는 궁성지, 지산동 고분군, 방어성인 주산성 등 대가야의 문화유산이 보존되어 있습니다.","d":"고령 지산동 고분군은 5~6세기 대가야 지배층의 무덤으로 순장 흔적과 금동관·가야 토기 등이 나왔으며, 궁성지·주산성과 함께 이곳이 대가야의 중심지였음을 보여 준다. 대가야는 금관가야 쇠퇴 이후 후기 가야 연맹을 주도하였고 562년 신라 진흥왕에게 멸망하였으며, 이 고분군은 2023년 '가야고분군'의 하나로 유네스코 세계유산에 등재되었다. 김해 대성동 고분군과 구지봉 설화로 대표되는 금관가야와 혼동하지 않아야 한다.","u":"삼국시대","c":1},{"k":"사자·조의·선인","y":"고구려 초","s":"대가들이 사자, 조의, 선인을 거느렸다.","d":"「삼국지」 위서 동이전에 전하는 고구려의 관직으로, 왕 아래 상가·고추가 등 대가들이 각기 사자·조의·선인을 거느렸다. 이는 초기 고구려가 5부의 유력 세력을 기반으로 한 연맹 체제였음을 보여 주며, 국가 중대사는 제가 회의에서 결정하였다. 백제의 정사암 회의, 신라의 화백 회의와 구별해서 알아 두어야 한다.","u":"삼국시대","c":1},{"k":"토졸","y":"고구려","s":"그 나라는 관을 세움에 9등이 있다. 첫 번째는 토졸이라 하며, 1품에 비견된다.","d":"「한원」에 인용된 「고려기」의 기록으로, 고구려는 관등을 9등으로 나누고 그 첫째를 토졸이라 하였는데 이는 최고 관등인 대대로의 다른 이름이다. 대대로는 원칙적으로 3년마다 귀족들이 선출하여 국정을 총괄하게 하였고, 후기에는 연개소문이 대막리지가 되어 권력을 장악하였다. 백제 16관등 중 최고인 좌평, 신라 17관등 중 최고인 이벌찬과 혼동하지 않아야 한다.","u":"삼국시대","c":1},{"k":"천리장성","y":"631","s":"왕이 많은 사람을 동원하여 동북의 부여성에서 동남의 바다에 이르기까지 천 리 남짓에 걸쳐 장성을 쌓았다.","d":"당의 침입에 대비하여 631년(영류왕 14) 동북쪽 부여성에서 동남쪽 바다(비사성)에 이르는 천리장성을 쌓기 시작하여 647년(보장왕 6)에 완성하였다. 축조를 감독하며 세력을 키운 연개소문은 642년 정변을 일으켜 영류왕을 제거하고 보장왕을 세운 뒤 대막리지가 되었다. 거란·여진의 침입에 대비해 압록강 하구에서 도련포까지 쌓은 고려의 천리장성(1033~1044)과 반드시 구분해야 한다.","u":"삼국시대","c":1},{"k":"부여 관북리 유적","y":"538","s":"관북리 유적 및 부소산성, 정림사지, 능산리 고분군, 나성","d":"관북리 유적과 부소산성, 정림사지, 능산리 고분군, 나성은 538년 성왕이 천도한 사비(부여)의 백제 후기 유적으로, 관북리 일대는 왕궁터로 추정된다. 능산리 절터에서 백제 금동대향로가 출토되었고 정림사지에는 5층 석탑이 남아 있으며, 이들 유적은 2015년 공주·익산 유적과 함께 백제역사유적지구로 유네스코 세계유산에 등재되었다. 무령왕릉과 공산성이 있는 웅진(공주) 시기 유적과 구분해야 한다.","u":"삼국시대","c":1},{"k":"유금필","y":"930","s":"견훤이 고창군을 포위하자 유금필이 왕에게 아뢰기를, 신은 군대를 진격해 서둘러 공격하기를 바랍니다.","d":"견훤이 고창군(안동)을 포위하자 유금필이 진격을 건의하였고, 왕건이 이를 받아들여 930년 고창 전투에서 후백제군을 크게 무찔렀다. 이 승리로 고려는 927년 공산 전투에서 신숭겸을 잃고 패배한 열세를 만회하고 경상도 일대의 주도권을 장악하였다. 이후 935년 신라 경순왕의 항복과 936년 일리천 전투를 거쳐 후삼국을 통일하였다.","u":"삼국시대","c":1},{"k":"건원중보","y":"996","s":"금속 화폐인 건원중보가 주조되었다.","d":"고려 성종 때인 996년에 우리나라 최초의 금속 화폐인 건원중보가 주조되었다. 그러나 실제 유통은 부진하여 곡식과 삼베가 여전히 주된 교환 수단으로 쓰였다. 숙종 때 의천의 건의로 주전도감을 설치하고 삼한통보·해동통보·활구(은병)를 발행한 것과 구분하여 기억해야 한다.","u":"고려시대","c":1},{"k":"해동공자 최충","y":"문종","s":"고려의 학자인 문헌공 최충으로, 해동공자라고도 불리기도 하였습니다.","d":"최충(984~1068)은 고려 문종 때 문하시중까지 오른 유학자로, 후대에 해동공자로 불렸다. 관직에서 물러난 뒤 9재 학당을 세워 사학 12도가 융성하는 계기를 만들었다. 시호가 문헌공이었기 때문에 그의 학당을 문헌공도라고도 부른다.","u":"고려시대","c":1},{"k":"수찬관","y":"현종","s":"거란의 침입으로 개경이 함락되자 역적들이 소실되자 역사서 편찬을 위한 수찬관에 임명되었습니다.","d":"거란의 2차 침입(1010~1011)으로 개경이 함락되면서 궁궐과 함께 실록이 불타 없어지자 현종은 사관을 정비하고 역사서 편찬에 나섰다. 최충은 1013년 국사수찬관에 임명되어 태조부터 목종까지를 다룬 『7대 실록』 편찬에 참여하였는데, 이 사업은 현종 때 시작되어 덕종 때인 1034년에 완성되었다. 다만 『7대 실록』은 오늘날 전하지 않는다.","u":"고려시대","c":1},{"k":"지공거","y":"1055","s":"지공거 출신으로 9재 학당을 설립하였습니다.","d":"지공거는 고려에서 과거를 주관하던 시험관으로, 급제자와 좌주·문생 관계를 맺어 문벌 형성의 바탕이 되었다. 최충 역시 지공거를 지냈고, 관직에서 물러난 뒤 1055년 무렵 9재 학당을 열어 유학 교육에 힘썼으며 이를 본떠 사학 12도가 세워졌다. 사학이 융성하자 정부는 관학 진흥책으로 숙종 때 서적포를, 예종 때 7재와 양현고를 마련하였다.","u":"고려시대","c":1},{"k":"입학도설","y":"1390","s":"입학도설을 저술하여 성리학의 기본 원리를 해설하였습니다.","d":"『입학도설』은 권근이 1390년에 지은 성리학 입문서로, 그림과 해설을 곁들여 성리학의 기본 원리를 알기 쉽게 풀이하였다. 권근은 고려 말에 활동하다가 조선 건국 이후 태종 대 문물 정비에 참여하였고, 하륜 등과 함께 『동국사략』 편찬에도 참여하였다. 안향이 성리학을 처음 소개하고 이제현이 만권당에서 원의 학자들과 교류한 것과는 구분해야 한다.","u":"고려시대","c":1},{"k":"대화궁","y":"1129","s":"폐하께서 음양의 지극한 말을 믿으시고 도참의 비설을 고찰하시어 대화궁을 창건하시니","d":"인종 때 묘청·정지상 등 서경 세력은 풍수지리설과 도참설을 근거로 서경 천도를 주장하였고, 1129년 서경 임원역 일대에 대화궁이 세워졌다. 이들은 칭제건원과 금국 정벌까지 내세웠으나 김부식 등 개경 세력의 반대로 뜻을 이루지 못하자 1135년 국호를 대위, 연호를 천개라 하며 난을 일으켰다. 이 반란은 김부식이 이끈 관군에게 약 1년 만에 진압되었다.","u":"고려시대","c":1},{"k":"홍건적의 침입","y":"1361","s":"신축년에 홍건적이 개경을 점거하자 임금이 복주로 피란하였다.","d":"공민왕 때 홍건적이 두 차례 침입하여 1359년 1차 침입에서는 서경이, 신축년인 1361년 2차 침입에서는 개경이 함락되었다. 이때 공민왕은 복주(오늘날 안동)까지 피란하였고, 이듬해인 1362년 정세운·안우·이방실·최영·이성계 등의 활약으로 개경을 되찾았다. 비슷한 시기에 있었던 왜구 격퇴(홍산·진포·황산 대첩)와 혼동하지 않아야 한다.","u":"고려시대","c":1},{"k":"이생규장전","y":"1361","s":"이생규장전은 홍건적의 침입으로 왕이 피란하고 백성이 고통을 겪는 등 전란의 참혹했던 상황을 역사적 배경으로 하고 있습니다.","d":"「이생규장전」은 김시습의 『금오신화』에 실린 한문 소설로, 홍건적의 침입으로 왕이 피란하고 백성이 참화를 겪은 고려 말의 상황을 배경으로 삼았다. 작품 속 시대 배경은 공민왕 대인 1361년 전후이지만, 작품 자체는 조선 전기 15세기에 지어졌다는 점을 구분해야 한다. 시험에서는 작품에 묘사된 전란 상황을 단서로 홍건적의 침입 시기를 묻는 자료로 활용된다.","u":"고려시대","c":1},{"k":"소의 별공","y":"1188","s":"동소·철소·자기소·지소·묵소 등 여러 소에서 별공으로 바치는 물건들을 너무 과중하게 징수하여","d":"소(所)는 향·부곡과 함께 고려의 특수 행정 구역으로, 그 주민들은 구리·철·자기·종이·먹 등 국가가 필요로 하는 물품을 만들어 공물로 바쳤다. 제시된 자료는 명종 18년(1188)의 기록으로, 정해진 공물 외에 별공의 부담까지 과중하여 주민들이 살던 곳을 떠나 떠돌게 되었음을 보여 준다. 이처럼 소민에 대한 차별과 수탈이 이어지는 가운데, 앞서 1176년에는 공주 명학소에서 망이·망소이의 난이 일어나기도 하였다.","u":"고려시대","c":1},{"k":"수시력 도입","y":"충선왕","s":"수시력의 도입과 최성지의 활동","d":"충선왕 때 최성지 등이 원에 다녀오면서 곽수경이 만든 수시력을 들여와 고려의 역법으로 사용하였다. 수시력은 1년의 길이를 365.2425일로 계산한 정밀한 역법으로, 뒷날 조선 세종 때 편찬된 『칠정산』 내편의 바탕이 되었다. 충선왕이 원의 수도 연경에 만권당을 세워 학문 교류를 넓힌 것과 함께 원 간섭기의 문화 수용 사례로 묶어 기억하면 좋다.","u":"고려시대","c":1},{"k":"금속활자와 직지","y":"1377","s":"금속활자 기술과 직지심체요절의 간행","d":"우왕 때인 1377년 청주 흥덕사에서 간행된 『직지심체요절』은 현존하는 세계에서 가장 오래된 금속 활자본으로, 현재 프랑스 국립도서관에 소장되어 있다. 기록상 더 이른 금속 활자 인쇄는 강화도 피란 시기인 1234년 무렵의 『상정고금예문』으로 이규보의 『동국이상국집』에 전하지만 실물은 남아 있지 않다. 목판 인쇄물인 팔만대장경이나 『무구정광대다라니경』과 혼동하지 않아야 한다.","u":"고려시대","c":1},{"k":"청자 상감 기법","y":"12세기","s":"고려 청자의 발달과 상감 기법의 활용","d":"고려청자는 11세기의 순청자에서 12세기 중엽 이후 상감 청자로 발전하였는데, 상감은 그릇 표면을 파낸 뒤 백토와 흑토를 메워 무늬를 내는 기법이다. 강진과 부안이 대표적인 생산지였으며, 원 간섭기를 거치면서 빛깔과 무늬가 점차 퇴조하여 조선의 분청사기로 이어졌다. 나전 칠기와 금속 공예에 쓰이던 상감을 청자에 적용한 점이 고려의 독창성으로 평가되며 시험에도 자주 출제된다.","u":"고려시대","c":1},{"k":"논산 관촉사 석조미륵보살입상","y":"광종","s":"은진 미륵이라고도 불리는 거대한 이 불상은 고려 시대 초기에 만들어진 것으로, 논산 관촉사에 가면 볼 수 있어.","d":"광종 때인 968년에 조성이 시작되어 목종 때인 1006년에 완성된 높이 18m가 넘는 거대한 석불로, 흔히 은진 미륵이라 불린다. 지방 호족의 후원 아래 만들어진 고려 초기 대형 석불의 대표작으로, 신체 비례가 자유롭고 토속적인 인상을 준다. 파주 용미리 마애이불 입상, 안동 이천동 마애여래 입상 등과 같은 계열로 묶어 기억하면 좋다.","u":"고려시대","c":1},{"k":"세자 책봉과 이방석","y":"1392","s":"공신 배극렴·조준·정도전이 세자를 세울 것을 청하면서, 나이와 공로를 고려하여 정하기를 청하였다. …… 임금이 마침내 뜻을 결정하여 어린 이방석을 왕세자로 삼았다.","d":"1392년 조선을 건국한 태조 이성계는 배극렴·조준·정도전 등에게 세자 책봉을 논의하게 한 뒤 계비 신덕 왕후 강씨 소생의 막내아들 이방석을 왕세자로 삼았다. 건국에 공이 컸던 이방원 등 신의 왕후 한씨 소생 왕자들이 배제되면서 불만이 커졌고, 이는 1398년 제1차 왕자의 난의 배경이 되었다. 이방석의 세자 이사(貳師)였던 정도전도 이때 함께 제거되었다는 점을 연결해 기억해야 한다.","u":"조선시대","c":1},{"k":"폐모살제","y":"광해군","s":"폐모살제 등을 구실로 반정을 일으킨 세력을 검색한다.","d":"광해군은 왕권에 위협이 될 수 있는 이복동생 영창 대군을 죽이고(1614) 인목 대비를 서궁에 유폐하였는데(1618), 이를 폐모살제라 한다. 서인 세력은 폐모살제와 명에 대한 의리를 저버렸다는 점을 구실로 1623년 인조반정을 일으켜 광해군을 몰아냈다. 반정을 주도한 세력이 서인이라는 점, 연산군을 축출한 중종반정과 혼동하지 않는 것이 중요하다.","u":"조선시대","c":1},{"k":"사헌부 상대","y":"조선","s":"백관에 대한 규찰과 탄핵 등을 관장하던 사헌부의 별칭인 상대","d":"사헌부는 백관을 규찰하고 관리의 비리를 탄핵하던 감찰 기구로, 서릿발 같은 기강을 세운다는 뜻에서 상대(霜臺)라는 별칭으로 불렸다. 사간원과 함께 양사(대간)를 이루어 간쟁과 서경권을 행사하였고, 여기에 홍문관을 더하여 삼사라 하였다. 고려에서는 어사대가 비슷한 감찰 기능을 맡았으므로 시대 구분에 주의해야 한다.","u":"조선시대","c":1},{"k":"대사헌","y":"조선","s":"대사헌을 수장으로 집의, 장령 등의 관직을 두었다.","d":"사헌부는 종2품 대사헌을 수장으로 집의·장령·지평·감찰 등의 관원을 두었다. 사간원의 수장이 정3품 대사간, 홍문관의 실질적 수장이 대제학인 것과 구별해야 한다. 사헌부와 사간원의 관원은 대간이라 불리며 5품 이하 관리 임명에 대한 서경권을 행사하였다.","u":"조선시대","c":1},{"k":"동평관","y":"태종","s":"사신 접대를 위해 한성에 동평관을 두었다.","d":"조선은 태종 때 한성에 동평관을 두어 일본 사신의 숙소로 삼고 이들을 접대하며 교역을 관리하였다. 여진 사신이 머물던 북평관, 명 사신을 접대하던 태평관과 구분해야 한다. 3포 개항, 계해약조와 더불어 조선 전기 사대교린 외교의 한 축인 대일 통교 정책으로 이해하면 된다.","u":"조선시대","c":1},{"k":"장양공정토시전부호도","y":"1588","s":"1588년 북병사 장양공 이일이 변경을 침범하던 여진을 정벌하는 장면이 그려진 그림","d":"1588년(선조 21) 북병사 이일이 두만강 건너 시전 부락의 여진을 정벌한 장면을 그린 기록화이다. 장양공은 이일의 시호이며, 세종 대 4군 6진 개척 이후에도 여진과의 충돌이 계속되었음을 보여 준다. 임진왜란 발발 직전 시기의 사건이라는 점에 유의해야 한다.","u":"조선시대","c":1},{"k":"양재역 벽서 사건","y":"1547","s":"부제학 정언각이 아뢰기를, 소신이 양재역에 이르러서 벽에 써 붙인 주서를 보았는데","d":"1547년(명종 2) 부제학 정언각이 경기 양재역에서 발견한 익명의 벽서를 조정에 보고하면서 일어난 사건으로, 정미사화라고도 한다. 을사사화(1545) 이후 권력을 잡은 소윤 윤원형 세력이 대윤의 잔여 세력과 사림을 대거 숙청하는 계기가 되었다. 문정 왕후가 수렴청정하던 명종 대의 사건임을 기억해야 한다.","u":"조선시대","c":1},{"k":"건저의 사건","y":"1591","s":"세자 책봉 문제를 계기로 정철이 유배되었다.","d":"1591년(선조 24) 서인의 영수 정철이 광해군을 세자로 책봉할 것을 건의하였다가 선조의 노여움을 사 유배된 사건이다. 이로써 서인이 실각하고 동인이 정국을 주도하였으며, 정철에 대한 처벌 수위를 놓고 동인이 강경파인 북인과 온건파인 남인으로 나뉘었다. 동인의 남인·북인 분화 계기라는 점에서 붕당의 흐름과 함께 정리해 두어야 한다.","u":"조선시대","c":1},{"k":"삼학사","y":"1637","s":"남한산성 무너진 날 죽었어야 할 몸인데 초수가 되어 아직도 못 돌아간 신하라네","d":"병자호란 때 청과의 화친을 반대한 척화론자 홍익한·윤집·오달제를 삼학사라 하며, 1637년 청에 잡혀가 심양에서 처형되었다. 인조는 남한산성에서 40여 일간 항전하였으나 결국 삼전도에서 항복하고 청과 군신 관계를 맺었다. 척화파 김상헌, 주화파 최명길과 함께 정리해 두어야 한다.","u":"조선시대","c":1},{"k":"감란록","y":"영조","s":"이인좌의 난을 평정한 직후 왕의 명으로 송인명 등이 난의 진행 과정과 원인에 대해 여러 자료를 참고해서 편찬한 것","d":"1728년(영조 4) 소론과 남인 일부가 일으킨 이인좌의 난을 진압한 뒤, 영조의 명으로 송인명 등이 난의 경위와 원인을 정리하여 1729년에 편찬한 책이다. 붕당 간의 대립이 반란의 근본 원인이라고 지적하여 탕평책의 명분을 뒷받침하였다. 영조 대의 탕평 정치, 탕평비 건립과 연결해 이해해야 한다.","u":"조선시대","c":1},{"k":"대전회통","y":"1865","s":"통치 체제를 정비하기 위해 대전회통을 편찬하였다.","d":"1865년(고종 2) 흥선 대원군의 주도로 조두순 등이 편찬한 조선의 마지막 통일 법전이다. 경국대전(성종)-속대전(영조)-대전통편(정조)의 뒤를 이었으며, 이듬해에는 관청별 사례집인 육전조례도 간행되었다. 정조 대의 대전통편과 헷갈리지 않도록 주의해야 한다.","u":"조선시대","c":1},{"k":"도성도","y":"정조","s":"장용영이 존재하던 시기 한양 도성 일대를 그린 도성도","d":"장용영은 1785년 설치된 장용위를 모체로 1793년 내영·외영 체제를 갖춘 정조의 친위 군영으로, 순조 즉위 후 1802년에 혁파되었다. 따라서 장용영이 존재하던 시기의 도성도는 정조 대 한양 도성 일대의 모습을 담은 지도이다. 정조 대에는 수원 화성 축조, 초계문신제 시행, 신해통공 실시 등이 함께 추진되었다.","u":"조선시대","c":1},{"k":"동국정운","y":"세종","s":"동국정운을 편찬하는 집현전의 학자","d":"동국정운은 1447년(세종 29) 신숙주·성삼문 등 집현전 학자들이 왕명으로 편찬한 우리나라 최초의 표준 한자음 운서로, 이듬해 간행되었다. 훈민정음으로 한자음을 정리하였다는 점에서 한글 창제 직후의 성과에 해당한다. 명의 운서인 홍무정운의 한자음을 훈민정음으로 표기한 홍무정운역훈, 서사시인 용비어천가와 구분해야 한다.","u":"조선시대","c":1},{"k":"경시서","y":"조선 전기","s":"시전의 상행위를 감독하는 경시서의 관리","d":"경시서는 시전의 상행위를 감독하고 물가를 조절하던 관청으로, 고려 때 설치되어 조선 건국 후에도 이어졌으며 1466년 세조 때 평시서로 이름이 바뀌었다. 조선은 한양에 시전을 두고 관허 상인에게 특정 물품의 독점 판매권을 주는 대신 국역을 부담시켰다. 조선 후기에 신해통공(1791)으로 육의전을 제외한 금난전권이 폐지된 사실과 함께 알아 두어야 한다.","u":"조선시대","c":1},{"k":"메밀 파종 권장","y":"조선 후기","s":"흉년이 들었을 때 기근을 구제하는 데 서쪽 지방의 토란이나 남쪽 지방의 고구마보다 월등히 나은 것은 메밀이다.","d":"조선 후기에는 흉년에 대비하여 메밀·토란 등이 구황 작물로 널리 재배되었고, 고구마는 1763년 조엄이 일본 대마도에서 들여왔으며 감자는 19세기에 전래되었다. 정조는 1798년 농서를 구하는 윤음을 내렸고, 이에 응해 전국에서 올라온 농서에는 이러한 구황 대책이 담겼다. 명종 대의 구황촬요처럼 정부가 구황 방법을 정리해 보급하던 전통이 이어진 것이다.","u":"조선시대","c":1},{"k":"3포 왜관","y":"1426","s":"염포의 왜관을 통해 일본과 교역하였다.","d":"조선은 태종 때 부산포·제포(내이포)를 연 데 이어 1426년(세종 8) 염포를 추가로 열어 3포에 왜관을 두고 일본과 제한된 범위에서 교역하였다. 1443년 계해약조로 세견선과 세사미두의 규모를 정해 교역량을 통제하였으며, 1510년 삼포왜란 이후 개항장이 축소되었다. 조선 후기에는 부산 초량에 왜관이 설치되어 통교가 이루어진 점과 구분해야 한다.","u":"조선시대","c":1},{"k":"김조순","y":"순조","s":"세도 정치의 주요 인물이자 왕의 장인인 김조순의 별저 옥호정과 그 일대를 그린 옥호정도","d":"김조순은 안동 김씨 세도 정치의 중심 인물로, 딸이 순조의 왕비인 순원 왕후가 되면서 국왕의 장인으로 권력을 장악하였다. 정조 사후 순조·헌종·철종 3대 60여 년간 안동 김씨와 풍양 조씨의 세도 정치가 이어졌고, 삼정의 문란 속에 홍경래의 난(1811)과 임술 농민 봉기(1862)가 일어났다. 옥호정도는 그의 서울 별서인 옥호정 일대를 그린 그림이다.","u":"조선시대","c":1},{"k":"김만덕","y":"1795","s":"김만덕이 흉년에 굶주린 백성을 구제한 기록을 살펴본다.","d":"김만덕은 제주 출신의 여성 거상으로, 1794년부터 이어진 제주의 큰 흉년 때 전 재산을 털어 쌀을 사들여 굶주린 백성을 구제하였다(1795). 정조는 그 공을 치하하여 소원대로 의녀반수로 삼아 궁궐에 들게 하고 금강산을 유람하게 하였으며, 채제공이 만덕전을 지어 행적을 기록하였다. 조선 후기 상업 발달 속에 등장한 인물로 정조 대에 활동하였다는 점을 기억해야 한다.","u":"조선시대","c":1},{"k":"속음청사","y":"1884","s":"김옥균 등은 청이 우리 자주권을 침해하는 데 분노하여 일본 공사와 정변을 일으켜 일본당으로 지목되었다. — 속음청사","d":"1884년 김옥균·박영효 등 급진 개화파가 우정총국 개국 축하연을 계기로 갑신정변을 일으켜 14개조 개혁 정강을 내걸었으나, 청군의 개입으로 3일 만에 무너졌다. 그 결과 이듬해인 1885년 조선과 일본 사이에 한성 조약이, 청과 일본 사이에 톈진 조약이 체결되었다. 제시된 『속음청사』는 온건 개화파 김윤식이 남긴 기록으로 급진 개화파를 '일본당'이라 부르며 비판적으로 서술한 자료이므로, 정변 주도 세력이 직접 남긴 글이 아니라는 점에 주의해야 한다.","u":"개화기","c":1},{"k":"최시형","y":"1898","s":"천도교의 제2대 교주 최시형에 대한 판결 선고서","d":"최시형은 교조 최제우의 뒤를 이은 동학의 제2대 교주로, 『동경대전』과 『용담유사』를 간행하고 포접제로 교단 조직을 정비하여 교세를 넓혔다. 동학 농민 운동이 진압된 뒤 1898년 체포되어 처형되었다. 동학이 천도교로 개칭된 것은 1905년 제3대 교주 손병희 때이므로, 최시형 활동 당시의 공식 명칭은 동학이었다는 점을 구분해야 한다.","u":"개화기","c":1},{"k":"포접제","y":"동학","s":"포접제를 활용하여 교세를 확장하였다.","d":"포접제는 동학의 신도 조직으로, 일정 지역의 신도를 접(接)으로 묶어 접주를 두고 여러 접을 다시 포(包)로 묶어 대접주를 둔 체제이다. 제2대 교주 최시형이 1880년대에 이를 정비하여 삼남 지방으로 교세를 넓혔고, 이 조직망은 뒤에 교조 신원 운동과 동학 농민 운동의 동원 기반이 되었다. 정부가 설치한 행정 조직이 아니라 동학 교단 자체의 조직이라는 점이 핵심이다.","u":"개화기","c":1},{"k":"포츠머스 조약","y":"1905","s":"일제가 포츠머스 조약을 체결하여 전쟁을 끝내고 대한 제국의 외교권을 박탈하려 하는 등","d":"1905년 9월 미국의 중재로 러시아와 일본이 포츠머스 조약을 맺어 러일 전쟁을 끝냈고, 러시아는 일본이 한국에서 갖는 정치·군사·경제상의 우월한 이익과 일본의 지도·보호·감리 조치를 인정하였다. 이에 앞서 가쓰라·태프트 밀약(7월)과 제2차 영일 동맹(8월)으로 미국과 영국의 묵인을 얻은 일본은 같은 해 11월 을사늑약을 강요해 대한 제국의 외교권을 빼앗았다. 포츠머스 조약 자체가 외교권을 박탈한 조약은 아니고 일본의 한국 지배를 국제적으로 묵인받은 조약이라는 점에 유의해야 한다.","u":"개화기","c":1},{"k":"독도 불법 편입","y":"1905","s":"일본이 독도를 불법 편입하였다.","d":"일본은 러일 전쟁 중이던 1905년 2월 시마네현 고시 제40호로 독도를 '다케시마'라 부르며 자국 영토에 불법 편입하였다. 이는 대한 제국 정부에 알리지 않은 일방적 조치로, 1900년 대한 제국이 칙령 제41호를 반포해 울릉도를 울도군으로 승격하고 군수가 독도(석도)까지 관할하도록 한 사실과 배치된다. 안용복의 활동(숙종 대)이나 칙령 제41호(1900)와 시기를 혼동하지 않아야 한다.","u":"개화기","c":1},{"k":"헌정 연구회","y":"1905","s":"1905년 헌정 연구회 조직","d":"헌정 연구회는 1905년 5월 이준·양한묵·윤효정 등이 조직한 애국 계몽 단체로, 국민의 정치의식을 높이고 입헌 군주제를 세우는 것을 목표로 하였다. 을사늑약 체결을 지지한 일진회를 규탄하는 등 활동하다가 일제의 탄압으로 1906년 활동을 멈추었고, 그 뒤 대한 자강회로 계승되었다. 황무지 개간권 요구를 저지한 보안회(1904)나 국권 회복과 공화정체를 지향한 신민회(1907)와 구분해야 한다.","u":"개화기","c":1},{"k":"대한문전","y":"1909","s":"국어 문법서인 대한문전을 편찬하였다.","d":"『대한문전』은 유길준이 우리말 문법을 체계적으로 정리해 1909년 융문관에서 간행한 국어 문법서이다. 국권 피탈을 앞둔 시기에 국어·국문 연구로 민족의식을 지키려 한 국학 운동의 성과에 해당한다. 유길준의 다른 저술인 『서유견문』(1895 간행)이나 주시경의 『국어문법』(1910), 학부 산하 국문 연구소(1907) 설치와 혼동하지 않도록 주의해야 한다.","u":"개화기","c":1},{"k":"한글 띄어쓰기","y":"1896","s":"최초로 한글에 띄어쓰기를 도입하였다.","d":"1896년 서재필이 정부의 지원을 받아 창간한 독립신문은 우리나라 최초의 민간 신문으로, 순 한글판과 영문판으로 발행되었으며 신문으로는 처음으로 한글 띄어쓰기를 도입하였다. 이는 일반 백성과 외국인에게 국내 사정을 알리려는 목적에서 나온 편집 방침이었다. 순 한문으로 간행된 최초의 근대 신문 한성순보(1883)나 국한문 혼용의 황성신문(1898)과 구별해야 한다.","u":"개화기","c":1},{"k":"칠지도","y":"4세기","s":"왜에 칠지도를 만들어 보냈다.","d":"백제 근초고왕 때 왜왕에게 보낸 것으로 추정되는 철제 칼로, 몸체 좌우에 가지 모양의 칼날이 뻗어 있다. 앞뒤 면의 금상감 명문에 백제 왕세자가 왜왕에게 준다는 내용이 담겨 있어 4세기 백제와 왜의 활발한 교류를 보여 주는 유물이다.","u":"삼국시대","c":1},{"k":"신주 설치","y":"553","s":"신라가 한강 하류를 차지하여 신주를 설치하였다.","d":"신라 진흥왕은 553년 나제 동맹을 깨고 백제가 되찾은 한강 하류 지역을 기습하여 차지한 뒤 신주를 설치하였다. 이로써 황해를 통한 대중국 교통로를 확보하였고, 이듬해 관산성 전투에서 백제 성왕을 전사시켰다.","u":"삼국시대","c":1},{"k":"송산리 6호분","y":"6세기","s":"동하총 무덤방의 벽에는 사신도가, 천장에는 연꽃과 구름무늬가 그려져 있습니다. 이는 송산리 6호분과 함께 (가)의 고분 벽화 연구에 중요한 자료로 평가됩니다.","d":"공주 송산리 고분군에 있는 백제 웅진 시기의 벽돌무덤으로, 중국 남조의 영향을 받아 축조되었다. 무덤방 벽에 사신도가 그려져 있어 부여 능산리 동하총과 함께 백제의 고분 벽화를 연구하는 데 중요한 자료이다.","u":"삼국시대","c":1},{"k":"일길찬·사찬","y":"6세기","s":"일길찬, 사찬 등의 관등이 있었다.","d":"일길찬과 사찬은 신라 17관등 가운데 각각 7등과 8등에 해당하는 관등이다. 법흥왕 때 정비된 관등제는 골품에 따라 오를 수 있는 상한이 정해져 있어 신분제와 밀접하게 결합된 신라 고유의 제도였다.","u":"삼국시대","c":1},{"k":"문적원","y":"8세기","s":"서적 관리, 주요 문서 작성 등을 위해 문적원을 두었다.","d":"발해가 당의 제도를 받아들여 설치한 중앙 기구로, 서적을 관리하고 주요 문서를 작성하는 일을 맡았다. 감찰을 담당한 중정대, 유학 교육을 맡은 주자감과 함께 3성 6부 밖에 별도로 둔 기구였다.","u":"삼국시대","c":1},{"k":"정당성 좌·우사정","y":"8세기","s":"좌·우사정이 6부를 나누어 관할하였다.","d":"발해는 3성 6부의 중앙 관제를 두었는데, 그 중심인 정당성 아래에서 좌사정이 충·인·의부를, 우사정이 지·예·신부를 나누어 관할하였다. 유교 덕목을 6부의 이름으로 삼은 점과 함께 발해 관제의 독자성을 보여 준다.","u":"삼국시대","c":1},{"k":"무령군 소장","y":"9세기 초","s":"당으로 건너가 무령군 소장이 되다","d":"장보고는 젊은 시절 당에 건너가 서주 무령군의 소장이 되어 활약하였다. 이후 신라인이 해적에게 붙잡혀 노비로 팔리는 현실을 보고 귀국하여, 흥덕왕에게 건의해 완도에 청해진을 설치하고 해적을 소탕하였다.","u":"삼국시대","c":1},{"k":"적산 법화원","y":"9세기","s":"산둥반도에 적산 법화원을 창건하다","d":"장보고가 산둥반도 적산촌에 세운 사찰로, 당에 머물던 신라인들의 신앙과 교류의 중심지 역할을 하였다. 일본 승려 엔닌의 입당구법순례행기에 그 모습이 기록되어 있어 신라인의 활발한 해상 활동을 전해 준다.","u":"삼국시대","c":1},{"k":"도기 기마인물형 명기","y":"6세기","s":"신라의 무덤에서 출토된 도기 기마인물형 명기","d":"경주 금령총에서 출토된 신라의 토기로, 말을 탄 주인상과 하인상 한 쌍으로 이루어져 있다. 죽은 이의 영혼을 저승으로 인도한다는 관념에서 무덤에 넣은 껴묻거리로, 신라인의 내세관과 복식·마구를 보여 준다.","u":"삼국시대","c":1},{"k":"경주 식읍","y":"935","s":"우리 왕께서 신라국을 없애 경주라 하고, 그에게 식읍으로 하사하셨다더군.","d":"935년 신라 경순왕 김부가 고려에 항복하자 태조 왕건은 신라를 없애 경주라 하고 그 땅을 김부의 식읍으로 하사하였다. 아울러 그를 경주의 사심관으로 삼아 지방을 통제하게 하였으니, 이것이 호족 포섭책인 사심관 제도의 시초가 되었다.","u":"고려시대","c":1},{"k":"후주와의 사신 왕래","y":"10세기","s":"후주와의 사신 왕래로 대외 관계 안정을 꾀하였어요.","d":"광종은 즉위 후 중국 후주와 사신을 주고받고 그 연호를 사용하며 대외 관계의 안정을 꾀하였다. 이때 후주 사신을 따라왔다가 귀화한 쌍기의 건의로 958년 과거제를 실시하였으며, 노비안검법과 백관의 공복 제정으로 왕권을 강화하였다.","u":"고려시대","c":1},{"k":"정치도감","y":"1347","s":"폐정 개혁을 목표로 정치도감을 설치하였다.","d":"정치도감은 1347년 충목왕이 원 간섭기에 누적된 폐정을 개혁하고자 설치한 임시 기구이다. 권세가가 불법으로 빼앗은 토지와 노비를 조사해 바로잡으려 하였으나, 기황후 친족 등 부원 세력의 반발로 큰 성과를 거두지 못한 채 폐지되었다.","u":"고려시대","c":1},{"k":"7재와 강예재","y":"1109","s":"7재를 설치하였다. 주역을 공부하는 곳은 이택재, 상서는 대빙재, 모시(毛詩)는 경덕재, 주례는 구인재, 대례는 복응재, 춘추는 양정재, 무학은 강예재라고 하였다.","d":"예종은 사학 12도에 밀린 관학을 진흥하고자 1109년 국자감에 전문 강좌인 7재를 두었다. 주역의 이택재, 상서의 대빙재, 모시의 경덕재 등 유학 6재와 무학을 가르치는 강예재로 구성되었으며, 뒤에 장학 재단인 양현고도 설치하였다.","u":"고려시대","c":1},{"k":"무학재 혁파","y":"1133","s":"무학으로 무사를 선발하는 일과 무학재의 호칭은 모두 혁파하겠다.","d":"국자감 7재 가운데 무학을 가르치던 강예재, 곧 무학재는 무예와 병법을 익혀 무사를 선발하던 과정이었다. 그러나 문신 위주의 지배층이 이를 비판하여 인종 11년인 1133년에 혁파되었고, 무신에 대한 차별이 심화되어 무신 정변의 배경이 되었다.","u":"고려시대","c":1},{"k":"혜민국","y":"1112","s":"병자에게 약을 지급하는 혜민국이 설치되었다.","d":"혜민국은 1112년 예종 때 개경에 설치되어 병자에게 약을 지급하고 치료를 담당한 의료 기구이다. 흉년에 백성을 구제한 구제도감, 환자를 돌본 동서 대비원 등과 함께 고려의 사회 시책이 제도적으로 정비되었음을 보여 준다.","u":"고려시대","c":1},{"k":"정혜결사와 권수정혜결사문","y":"12세기 말","s":"이것은 불일보조국사라는 시호를 받은 (가)의 행적을 담고 있는 송광사 보조국사비입니다. 비문에는 그가 정혜결사를 조직하고, 「권수정혜결사문」을 지었다는 내용이 들어있습니다.","d":"지눌은 무신 집권기 불교계의 세속화를 비판하며 「권수정혜결사문」을 짓고 정혜결사를 제창하였다. 순천 송광사를 중심으로 수선사 결사를 이끌며 선정과 지혜를 함께 닦는 정혜쌍수와 돈오점수를 내세웠고, 사후 불일보조국사의 시호를 받았다.","u":"고려시대","c":1},{"k":"해동고승전","y":"1215","s":"승려들의 전기를 기록한 해동고승전을 저술하였다.","d":"각훈은 고종의 명을 받아 1215년 무렵 해동고승전을 편찬하였다. 삼국 시대 이래 이름난 승려들의 전기를 정리한 우리나라에서 가장 오래된 승전으로, 현재는 일부만 전하지만 교종 중심의 불교사 인식을 보여 주는 자료이다.","u":"고려시대","c":1},{"k":"공녀","y":"원 간섭기","s":"많은 여성이 공녀로 끌려갔어.","d":"원 간섭기 고려는 원의 요구에 따라 처녀를 공녀로 바쳐야 하였고, 1274년 결혼도감이 설치되어 이를 담당하였다. 공녀 징발을 피하려는 조혼 풍습이 생길 만큼 백성의 고통이 컸으며, 이곡 등이 원에 그 폐지를 요청하는 글을 올리기도 하였다.","u":"고려시대","c":1},{"k":"농상집요","y":"1349","s":"농상집요를 소개하는 관리","d":"농상집요는 원에서 편찬된 농서로, 충정왕 때 이암이 고려에 들여와 소개하였다. 화북 지방의 밭농사 중심 농법을 담고 있어 우리 풍토에 그대로 맞지는 않았으나, 선진 농업 기술이 전해져 농업 생산력을 높이는 계기가 되었다.","u":"고려시대","c":1},{"k":"식목도감","y":"고려 전기","s":"고려의 중앙 관제 중 독자적 정치 기구로 도병마사와 식목도감을 두었다.","d":"식목도감은 도병마사와 함께 고려의 독자적인 회의 기구로, 중서문하성의 재신과 중추원의 추밀이 모여 국가의 법제와 격식을 제정하였다. 대외 국방 문제를 논의한 도병마사와 짝을 이루며 귀족들의 합의로 국정을 운영하였음을 보여 준다.","u":"고려시대","c":1},{"k":"음서","y":"고려 전기","s":"반드시 과거로만 관직에 진출하는 것이 아니라, 음서 등으로 관직에 진출하기도 하였다.","d":"고려에서는 과거 외에 조상의 공로로 관직에 나아가는 음서가 있어, 5품 이상 관리의 자손은 시험을 거치지 않고 관리가 될 수 있었다. 세습이 가능한 공음전과 더불어 문벌 귀족 사회를 유지하는 기반이 되었으며, 조선에 비해 대상이 넓었다.","u":"고려시대","c":1},{"k":"영주 부석사 소조여래좌상","y":"고려 시대","s":"우리 모둠은 영주 부석사 소조여래좌상을 소재로 하여 열쇠고리를 제작하고자 합니다.","d":"영주 부석사 무량수전 안에 모셔진 고려 시대 불상으로, 나무로 뼈대를 세우고 진흙을 붙여 만든 소조 기법의 대표작이다. 통일 신라 불상 양식을 계승한 단정한 얼굴과 항마촉지인의 자세가 특징이며 국보로 지정되어 있다.","u":"고려시대","c":1},{"k":"청자 모자 원숭이 모양 연적","y":"12세기","s":"청자 모자 원숭이 모양 연적으로 방향제 만들기","d":"12세기 순청자의 절정기에 만들어진 상형 청자로, 새끼를 안은 어미 원숭이의 모습을 본떠 빚은 문방구이다. 맑고 은은한 비색과 사실적인 조형미가 돋보이며, 고려 귀족 문화의 세련된 취향을 보여 주는 국보이다.","u":"고려시대","c":1},{"k":"청자 상감운학문 매병","y":"13세기","s":"청자 상감운학문 매병으로 조명등 만들기","d":"12세기 중엽 이후 발달한 상감 기법으로 만든 고려청자의 대표작으로, 표면을 파낸 뒤 다른 색 흙을 메워 구름과 학 무늬를 새겼다. 전라도 강진과 부안에서 주로 생산되었으며, 고려만의 독창적인 미의식을 보여 주는 국보이다.","u":"고려시대","c":1},{"k":"오자치 초상","y":"1467","s":"이 그림은 무관 오자치를 그린 것으로, 현존하는 무관 초상화 중에서 가장 이른 시기의 작품입니다.","d":"오자치는 1467년 이시애의 난을 평정한 공으로 적개공신에 책봉된 무신으로, 그 공을 기려 공신 초상이 제작되었다. 사모와 단령을 갖추고 교의에 앉은 전신 좌상으로, 현존하는 조선 무관 초상화 가운데 가장 이른 시기의 작품으로 평가된다.","u":"조선시대","c":1},{"k":"호패법 재실시","y":"세조 때","s":"오자치는 (가)이/가 호패법을 재실시하는 등 지방 세력 통제를 강화하자, 이에 반발하며 함길도에서 이시애가 일으킨 난을 평정하였습니다.","d":"세조는 왕권과 중앙 집권을 강화하기 위해 한동안 중단되었던 호패법을 다시 실시하여 인구와 군역 대상자를 철저히 파악하고자 하였다. 이러한 지방 세력 통제 정책에 반발하여 1467년 함길도에서 이시애의 난이 일어났다.","u":"조선시대","c":1},{"k":"적개공신","y":"1467","s":"이시애가 일으킨 난을 평정한 공으로 적개공신에 책봉되었습니다.","d":"1467년 함길도에서 일어난 이시애의 난을 평정한 공으로 세조가 책봉한 공신이다. 남이, 강순, 어유소, 오자치 등이 포함되었으며, 이들은 기존 훈구 세력을 견제하는 새로운 정치 세력으로 성장하였다.","u":"조선시대","c":1},{"k":"부민고소금지법","y":"1420","s":"부민고소금지법이 제정되었다.","d":"세종 때인 1420년 지방민이 수령의 잘못을 고발하지 못하도록 제정한 법으로, 상하 질서를 바로잡고 수령의 권위를 세우려는 목적을 지녔다. 수령권이 강화되어 중앙 집권 체제가 다져졌으나 백성이 억울함을 호소할 길은 좁아졌다.","u":"조선시대","c":1},{"k":"정유재란","y":"1597","s":"이것은 강화 교섭 결렬 이후 일본의 재침으로 시작된 이 전란 당시 흥양 현감 최희량이 작성한 전과 보고서의 일부입니다.","d":"임진왜란 중 진행되던 명과 일본의 강화 교섭이 결렬되자 1597년 일본군이 다시 침입하였다. 조선 수군은 칠천량에서 크게 패하였으나 이순신이 명량에서 대승을 거두었고, 1598년 노량 해전을 끝으로 7년 전쟁이 마무리되었다.","u":"조선시대","c":1},{"k":"최희량 첩보 서목","y":"1598","s":"흥양에 침입한 일본군을 격퇴한 사실과 새로 제작한 전선(戰船)에 대한 내용 등이 자세히 기록되어 있으며, 삼도수군통제사 이순신의 서명도 있습니다.","d":"정유재란 당시 흥양 현감이던 최희량이 왜군을 격퇴한 전과와 새로 만든 전선의 상황을 상관에게 보고한 문서이다. 삼도수군통제사 이순신의 서명이 남아 있어 정유재란기 수군 활동을 생생하게 전하는 자료로 가치가 높다.","u":"조선시대","c":1},{"k":"회답겸쇄환사","y":"1607","s":"포로 송환을 목적으로 회답겸쇄환사가 일본에 파견되었다.","d":"임진왜란 이후 국교 재개를 요청한 일본 에도 막부에 답서를 전하고 끌려간 포로를 데려오기 위해 1607년 처음 파견되었다. 1617년과 1624년까지 세 차례 파견되었으며, 이후에는 통신사로 이름을 바꾸어 문화 교류를 이어 갔다.","u":"조선시대","c":1},{"k":"사량진 왜변","y":"1544","s":"조선 정부의 교역 제한에 반발하여 사량진 왜변이 일어났다.","d":"삼포왜란 이후 맺은 임신약조로 교역이 크게 제한되자 이에 불만을 품은 왜인들이 1544년 경상도 사량진에 침입하였다. 조선은 일본인의 왕래를 금지하였다가 1547년 정미약조를 맺어 제한된 범위에서 교역을 다시 허용하였다.","u":"조선시대","c":1},{"k":"목호룡의 고변","y":"1722","s":"성상을 시해하려는 자가 목호룡의 고변으로 조정이 큰 혼란에 휩싸였다는군.","d":"1722년 지관 출신 목호룡이 노론 세력이 경종을 시해하려 모의하였다고 고변하여 조정이 큰 혼란에 빠졌다. 이를 계기로 임인옥사가 일어나 김창집 등 노론 4대신이 사사되고 소론이 정국을 장악하였다.","u":"조선시대","c":1},{"k":"신임옥사","y":"1721~22","s":"연잉군과 노론이 곤경에 처하게 될 것 같군.","d":"경종 즉위 후 노론이 연잉군을 왕세제로 책봉하고 대리청정까지 추진하자, 소론이 이를 역모로 몰아 1721년부터 1722년까지 두 차례 옥사를 일으켰다. 노론 4대신이 죽임을 당하고 소론이 권력을 잡았으며, 훗날 영조 탕평책의 배경이 되었다.","u":"조선시대","c":1},{"k":"도산서원도","y":"1751","s":"이 그림은 강세황이 그린 도산서원도입니다. 여기에는 서원의 배치와 건물 크기, 방향 등이 실제와 부합하게 묘사되어 있으며 건물 이름도 표기되어 있습니다.","d":"1751년 강세황이 이황을 기리는 도산 서원과 그 주변 경관을 그린 실경 산수화이다. 건물의 배치와 크기, 방향을 실제와 가깝게 묘사하고 이름까지 적어 넣어 회화성과 기록성을 함께 갖춘 작품으로 평가된다.","u":"조선시대","c":1},{"k":"성학십도","y":"1568","s":"도산 서원은 성학십도를 지어 군주의 수양을 강조하고, 기대승과 사단칠정 논쟁을 전개한 (가)의 학문과 덕을 기리는 곳입니다.","d":"이황은 1568년 선조에게 성학십도를 올려 군주가 스스로 성학을 따라 수양할 것을 열 폭의 그림과 해설로 강조하였다. 기대승과 사단칠정 논쟁을 벌였으며, 그의 학문은 영남학파로 이어지고 일본 성리학에도 큰 영향을 주었다.","u":"조선시대","c":1},{"k":"동호문답","y":"1569","s":"동호문답을 통해 다양한 개혁 방안을 제시하였다.","d":"이이가 1569년 선조에게 올린 글로, 손님과 주인의 문답 형식을 빌려 왕도 정치의 이상과 현실 개혁 방안을 제시하였다. 공납의 폐단을 고치기 위한 수미법 등을 주장하여 뒷날 대동법 논의로 이어지는 밑거름이 되었다.","u":"조선시대","c":1},{"k":"제천 배론성지","y":"1801","s":"제천 배론성지는 순조 1년(1801)에 일어난 (가) 당시 정부의 탄압을 피해 천주교 교인들이 모여 살던 교우촌에서 비롯되었습니다.","d":"1801년 순조가 즉위한 뒤 정권을 잡은 노론 벽파가 남인 시파를 몰아내려 천주교를 대대적으로 탄압한 사건이다. 이승훈과 정약종 등이 처형되고 정약용은 유배되었으며, 황사영은 제천 배론의 토굴에 숨어 백서를 작성하였다.","u":"조선시대","c":1},{"k":"이필제의 난","y":"1871","s":"이필제가 영해 지역에서 난을 일으키는 계기가 되었다.","d":"동학교도 이필제는 교조 최제우가 처형된 뒤 그 억울함을 풀 것을 내세워 1871년 경상도 영해에서 봉기하였다. 한때 지방관을 죽이며 세력을 떨쳤으나 곧 진압되었고, 큰 타격을 입은 동학은 최시형을 중심으로 조직을 재건하였다.","u":"조선시대","c":1},{"k":"봉산탈춤과 오광대","y":"조선 후기","s":"우리 박물관에서는 전국의 주요 탈춤을 한자리에서 만날 수 있는 공연을 마련하였습니다. 1부 봉산탈춤, 2부 송파산대놀이, 3부 고성오광대, 4부 수영야류","d":"조선 후기 상품 화폐 경제가 발달하고 서민 의식이 성장하면서 장시와 포구를 무대로 탈춤이 크게 유행하였다. 황해도의 봉산탈춤, 경남의 고성오광대, 부산의 수영야류, 서울의 송파산대놀이가 대표적이며 양반의 위선을 풍자하였다.","u":"조선시대","c":1},{"k":"옥계 시사","y":"1786","s":"옥계 시사에서 시를 낭송하는 중인","d":"조선 후기 경제력과 학식을 갖춘 중인층이 신분 상승 욕구를 문학으로 드러내며 시사를 결성하였다. 1786년 천수경 등이 인왕산 옥류동에 모여 만든 옥계 시사가 대표적이며, 이러한 흐름을 위항 문학이라고 부른다.","u":"조선시대","c":1},{"k":"수선총도","y":"19세기","s":"이것은 한양의 모습을 그린 수선총도입니다. 지도에는 종로에 위치한 시전 외에도 도성 내 이현, 남대문 밖의 칠패와 같은 난전이 표기되어 있습니다.","d":"19세기에 목판으로 제작된 한양 지도로, 도성의 궁궐과 관청, 성곽과 도로망을 자세히 담고 있다. 종로의 시전뿐 아니라 이현과 칠패 같은 난전까지 표기되어 조선 후기 한양의 상업 발달을 보여 주는 자료이다.","u":"조선시대","c":1},{"k":"이현과 칠패","y":"조선 후기","s":"당시에는 서로의 취급 물품을 두고 난전과 시전 사이의 갈등, 시전들 간의 다툼이 일어나기도 하였습니다.","d":"조선 후기 사상이 성장하면서 동대문 부근의 이현과 남대문 밖의 칠패가 종로 시전과 함께 한양의 3대 시장으로 자리 잡았다. 시전 상인의 금난전권을 둘러싼 갈등이 이어지다가 1791년 신해통공으로 육의전을 제외한 금난전권이 폐지되었다.","u":"조선시대","c":1},{"k":"사섬서 저화","y":"1401","s":"사섬서에서 저화를 발행하는 장인","d":"태종은 1401년 사섬서를 설치하여 지폐인 저화의 발행과 유통을 맡겼다. 동전 부족을 보완하고 국가가 화폐 유통을 장악하려는 시도였으나, 가치가 자주 떨어지고 백성이 사용을 꺼려 널리 유통되지는 못하였다.","u":"조선시대","c":1},{"k":"선혜청 공가","y":"1608","s":"선혜청에서 공가(貢價)를 받는 상인","d":"1608년 광해군 때 대동법이 경기도에 처음 시행되면서 이를 관장할 기구로 선혜청이 설치되었다. 공인은 선혜청에서 공가를 미리 받아 관청에 필요한 물품을 사서 납품하였고, 이는 상품 화폐 경제의 발달을 촉진하였다.","u":"조선시대","c":1},{"k":"식년시·알성시·증광시","y":"조선 시대","s":"과거는 문과, 무과, 잡과로 구성되었는데 문과와 무과를 중심으로 하여 양반 관료 체제가 갖추어졌으며, 식년시, 알성시, 증광시 등으로 운영되었다.","d":"조선의 과거는 문과와 무과, 잡과로 나뉘었고 문과와 무과 급제자를 중심으로 양반 관료 체제가 운영되었다. 3년마다 치르는 정기 시험인 식년시 외에 국가 경사 때 여는 증광시, 국왕의 문묘 참배 때 치르는 알성시 등이 있었다.","u":"조선시대","c":1},{"k":"인천 해관","y":"1883","s":"이 자료는 조선 정부가 영국인 스트리플링을 인천 해관의 초대 세무사로 임명한다는 문서로, 조선 정부는 인천 해관 창설을 통해 관세 부과 업무를 공식적으로 시작하였다.","d":"개항 이후 무관세 무역의 폐해가 커지자 조선 정부는 묄렌도르프의 건의를 받아들여 1883년 인천에 해관을 설치하였다. 영국인 스트리플링을 초대 세무사로 임명해 수출입 화물의 관세 부과 업무를 시작하였고, 같은 해 원산과 부산에도 해관이 설치되었다.","u":"개화기","c":1},{"k":"스트리플링","y":"1883","s":"왕명에 따라, 귀하가 조선 해관의 세무사로 임명되었음을 알려 드립니다.","d":"스트리플링은 조선이 해관을 창설할 때 초빙한 영국인 관리로, 왕명에 따라 1883년 인천 해관의 초대 세무사에 임명되었다. 당시 해관은 총세무사 묄렌도르프의 지휘 아래 운영되어 근대적 관세 행정의 출발점이 되었다.","u":"개화기","c":1},{"k":"박규수의 통상 개화론","y":"1870년대","s":"박규수 – 북학 사상을 바탕으로 통상 개화론을 주장하다","d":"박규수는 박지원의 손자로 북학 사상을 계승하여 문호를 열고 교역해야 한다는 통상 개화론을 주장하였다. 평안도 관찰사로 제너럴 셔먼호 사건을 처리하였고, 관직에서 물러난 뒤 사랑방에서 김옥균·박영효 등을 지도해 개화파 형성에 영향을 주었다.","u":"개화기","c":1},{"k":"박성춘","y":"1898","s":"박성춘 – 백정 출신으로 관민 공동회에서 연설하다","d":"박성춘은 백정 출신으로 1898년 독립 협회가 종로에서 연 관민 공동회에서 개막 연설을 하였다. 천민도 국정을 논할 수 있음을 보여 준 장면이었으며, 이 자리에서 헌의 6조가 결의되어 고종에게 올려졌다.","u":"개화기","c":1},{"k":"파리 만국 박람회 한국관","y":"1900","s":"이 자료는 파리 만국 박람회 당시 한국관의 모습을 담은 채색 광고 엽서이다. 고종은 박람회를 서구 문물을 받아들이고 우리나라를 세계에 소개하는 기회로 활용하고자 했다.","d":"대한 제국은 1900년 파리 만국 박람회에 공식 참가하여 경복궁 근정전을 본뜬 한국관을 세우고 도자기와 비단 등을 전시하였다. 고종은 이를 서구 문물을 받아들이고 자주 독립국 대한 제국을 세계에 알리는 기회로 삼고자 하였다.","u":"개화기","c":1},{"k":"임시 박람회 사무소","y":"1902","s":"1902년 고종은 박람회 관련 업무를 담당할 정부 기관으로 농상공부 산하에 임시 박람회 사무소를 개설하였다.","d":"파리 만국 박람회 참가를 계기로 박람회의 효용을 인식한 고종은 1902년 농상공부 산하에 임시 박람회 사무소를 설치하였다. 박람회 관련 업무를 전담한 정부 기구로, 식산흥업을 내세운 광무개혁의 흐름과 맞닿아 있다.","u":"개화기","c":1},{"k":"선거조례","y":"1894","s":"군국기무처의 주도로 과거를 폐지하고 별도의 선거조례를 제정하여, 유교 경전에 대한 지식이나 문장력보다는 실무에 적합한 재능과 능력을 갖춘 인재를 관리로 등용하고자 하였다.","d":"제1차 갑오개혁을 주도한 군국기무처는 1894년 과거제를 폐지하고 선거조례와 전고국 조례를 제정하였다. 유교 경전 지식이나 문장력 대신 실무 능력을 갖춘 인재를 시험으로 뽑도록 하여 신분에 구애받지 않는 관리 임용의 길을 열었다.","u":"개화기","c":1},{"k":"박승환 자결","y":"1907","s":"군대 해산 명령에 맞서 시위대 대대장 박승환이 자결한 후 전개된 시가전에서 부상 입은 부대원들이 실려 왔습니다.","d":"1907년 한일 신협약의 부속 각서에 따라 대한 제국 군대가 해산되자 시위대 대대장 박승환이 이에 항거하여 자결하였다. 이를 계기로 서울 시내에서 시가전이 벌어졌고, 해산 군인들이 합류하면서 정미의병이 크게 확산되었다.","u":"개화기","c":1},{"k":"에비슨","y":"1904","s":"에비슨 선생님께서는 이때 다친 부대원들을 치료해 주셨는데요, 여자 간호사들은 그동안 남자 환자들의 치료를 꺼리던 관습과 달리 헌신적으로 치료에 나섰습니다.","d":"에비슨은 캐나다에서 활동하다 내한한 선교 의사로 제중원 운영을 맡았고, 세브란스의 기부를 받아 1904년 세브란스 병원을 세웠다. 의학교를 함께 운영해 한국인 의사를 길러 냈으며, 1907년 군대 해산 때 부상당한 군인들을 치료하였다.","u":"개화기","c":1},{"k":"유인석의 충주성 점령","y":"1896","s":"유인석이 이끄는 부대가 충주성을 점령하였다.","d":"을미사변과 단발령에 반발해 일어난 을미의병 때 위정척사 사상을 지닌 유인석은 제천에서 거병하였다. 1896년 충주성을 점령하고 관찰사를 처단하는 등 기세를 떨쳤으나, 고종의 해산 권고 조칙이 내려지자 부대를 이끌고 만주로 망명하였다.","u":"개화기","c":1},{"k":"하와이 사탕수수 농장 이민","y":"1903","s":"첫 공식 이민, 백여 명의 이민자들이 대한 제국이 발행한 여행권을 가슴에 품고 1903년 도착했다. 1905년까지 노동 이민으로 약 7,000명이 이곳에 이주해 뿌리를 내렸다.","d":"정부가 1902년 수민원을 두어 이민 업무를 관장한 가운데 1903년 첫 공식 이민단 100여 명이 하와이에 도착하였다. 1905년까지 약 7천 명이 사탕수수 농장 노동자로 건너갔으며, 을사늑약 무렵 일제의 방해로 이민이 중단되었다.","u":"개화기","c":1},{"k":"부관 연락선","y":"1905","s":"시모노세키를 출발한 연락선 잇키마루가 어제 부산항에 도착하며 정기 운항을 시작했다. 올해 1월 경부선이 개통된 이후 8개월 만에 해로까지 연결되면서, 한성-부산-도쿄로 연결되는 교통망이 구축되었다.","d":"1905년 1월 경부선이 개통된 데 이어 같은 해 9월 부산과 시모노세키를 잇는 부관 연락선 이키마루가 정기 운항을 시작하였다. 한성에서 부산을 거쳐 일본으로 이어지는 교통망이 완성되면서 일제의 침탈과 물자 수탈이 한층 쉬워졌다.","u":"개화기","c":1},{"k":"최익현 태인 의병","y":"1906","s":"최익현이 태인에서 의병을 일으켰다.","d":"을사늑약에 반발한 최익현은 1906년 전북 태인의 무성 서원에서 임병찬과 함께 의병을 일으켰다. 순창에서 관군과 마주하자 같은 동포와 싸울 수 없다며 무기를 놓고 체포되었고, 쓰시마섬으로 끌려가 순국하였다.","u":"개화기","c":1},{"k":"집사부와 14부","y":"651","s":"집사부를 비롯한 14부를 설치하였다.","d":"신라는 진덕 여왕 때 왕명 출납을 맡은 집사부를 설치하고 그 장관을 중시라 하였으며, 이후 병부·위화부 등을 더해 14부의 중앙 관제를 갖추었다. 집사부의 설치는 귀족 회의인 화백의 권한을 줄이고 국왕 중심의 통치 체제를 강화하려는 조치였다.","u":"삼국시대","c":1},{"k":"호우명 그릇","y":"415","s":"영락이라는 연호를 사용한 왕의 능비를 디지털 영상으로 복원하여 선보이고자 합니다. 한편, 이번 전시에서는 그의 시호가 새겨진 문화유산도 함께 전시할 예정입니다.","d":"경주 호우총에서 출토된 청동 그릇으로, 바닥에 을묘년국강상광개토지호태왕이라는 글자가 새겨져 있다. 광개토 대왕의 시호가 신라 무덤의 껴묻거리에 남아 있다는 점에서 5세기 고구려가 신라에 강한 영향력을 행사하였음을 보여 주는 유물이다.","u":"삼국시대","c":1},{"k":"검모잠","y":"670","s":"검모잠은 남은 백성을 모아 궁모성에서 패강 남쪽으로 내려와 당나라 관인 및 승려 법안 등을 죽이고 신라로 향하였다. 사야도에 이르러 고구려 대신 연정토의 아들 안승을 알현하고, 한성으로 모셔서 임금으로 받들었다.","d":"고구려 멸망 후 검모잠은 670년 궁모성에서 유민을 모아 부흥 운동을 일으키고 안승을 왕으로 받들었다. 그러나 당군의 공세 속에 안승과 대립하다 죽임을 당하였고, 안승은 신라로 망명해 문무왕에게 보덕국왕으로 봉해졌다.","u":"삼국시대","c":1},{"k":"안동도호부","y":"668","s":"안동도호부가 설치된 경위를 알아본다.","d":"당은 668년 고구려를 멸망시킨 뒤 평양에 안동도호부를 두고 설인귀를 도호로 삼아 옛 고구려 땅을 직접 지배하려 하였다. 백제 땅의 웅진도독부, 신라를 겨눈 계림도독부와 함께 한반도 전체를 차지하려는 당의 야욕을 드러낸 기구로, 나당 전쟁의 원인이 되었다.","u":"삼국시대","c":1},{"k":"보령 성주사지 대낭혜화상탑비","y":"890","s":"이것은 보령 성주사지 대낭혜화상탑비로, 진성여왕의 명을 받아 최치원이 비문을 작성했습니다. 혜공왕 피살 이후 왕위 쟁탈전이 치열했던 시기에 당에서 수행하고 돌아와 9산 선문 중 하나인 성주산문을 개창한 낭혜화상의 행적이 기록되어 있습니다.","d":"낭혜화상 무염이 세운 성주산문의 내력을 담은 비로, 진성 여왕의 명으로 최치원이 비문을 지었다. 최치원의 사산비명 가운데 하나이며, 신라 하대 지방 호족의 후원을 받아 선종 9산 선문이 자리 잡아 가던 모습을 전해 주는 자료이다.","u":"삼국시대","c":1},{"k":"상경 용천부","y":"756","s":"상경 용천부 등 (가)의 5경에서 발굴되는 철제·불상·석등 등을 통해 당시 불교문화가 발전하였음을 알 수 있어요.","d":"발해 문왕이 8세기 중엽 옮긴 수도로, 이후 대부분의 시기 동안 발해의 중심지였다. 당의 장안성을 본떠 주작대로를 낸 외성과 궁성을 갖추었으며, 절터와 석등·불상이 다수 발굴되어 발해 불교문화의 융성을 보여 준다.","u":"삼국시대","c":1},{"k":"안동 태사묘","y":"930","s":"안동 태사묘는 고창 전투에서 (가)을/를 도와 견훤을 물리치는 데 공을 세워 향직을 수여 받은 권행, 김선평, 장길(장정필)의 위패를 봉안하고 있는 사당이다.","d":"930년 고창 전투에서 왕건을 도와 후백제군을 물리친 김선평·권행·장길 세 호족의 위패를 모신 사당이다. 왕건은 이들에게 성씨와 향직을 내리고 고창군을 안동부로 승격시켰으니, 호족을 포섭해 후삼국 통일의 기반을 다진 정책을 보여 준다.","u":"고려시대","c":1},{"k":"남경 승격","y":"1067","s":"한양을 남경으로 승격시켰다.","d":"고려는 개경과 서경, 동경의 3경 체제를 두었는데 문종 때인 1067년 한양을 남경으로 삼아 동경을 대신하게 하였다. 이후 숙종 때 남경개창도감을 두고 궁궐을 지었으며, 이는 뒷날 조선이 한양을 도읍으로 정하는 밑바탕이 되었다.","u":"고려시대","c":1},{"k":"호부와 삼사","y":"고려 전기","s":"수령이 직접 검사하여 호부에 신고하고, 호부에서는 다시 삼사에 보낸다.","d":"고려는 상서성 아래 6부를 두었는데 그중 호부가 호구와 토지, 조세 업무를 맡았고 삼사는 국가의 세금 출납과 회계를 담당하였다. 송의 삼사가 재정 전반을 총괄한 것과 달리 고려의 삼사는 회계만 맡았으며, 조선에서는 언론 기관인 3사와 이름만 같고 성격이 전혀 다르다.","u":"고려시대","c":1},{"k":"안찰사","y":"고려 전기","s":"삼사에서는 넘겨받은 문서를 조사한 뒤에 다시 그 지역 안찰사로 하여금 따로 사람을 보내 자세히 살펴 조사하게 하여 재해로 피해를 입었다면 조세를 감면한다.","d":"고려는 전국을 5도로 나누고 안찰사를 보내 관할 주현의 수령을 살피게 하였다. 임기가 6개월로 짧고 품계도 낮아 상주하지 않고 순찰하는 임시직에 가까웠으며, 조선에서 정3품 이상이 상주하며 도를 다스린 관찰사와 구별된다.","u":"고려시대","c":1},{"k":"제주 항파두리성","y":"1271","s":"항파두리성은 개경 환도 결정에 반발하여 강화도에서 봉기한 (가)이/가 진도를 거쳐 제주도로 옮겨 와 항쟁했던 곳인데요. 이 항파두리성 외에 제주도의 환해장성 등 (가)와/과 관련된 기록이 남아 있어, 앞으로 발굴 조사를 통한 연구가 기대됩니다.","d":"삼별초는 진도 용장성이 함락되자 김통정의 지휘 아래 제주도로 옮겨 항파두리성을 쌓고 마지막까지 항전하였다. 해안을 두른 환해장성도 이 시기 방어 시설로 전해지며, 1273년 여몽 연합군에게 진압되면서 삼별초의 항쟁이 막을 내렸다.","u":"고려시대","c":1},{"k":"강화산성","y":"1232","s":"우리나라 성곽의 역사를 찾아서 — 강화산성","d":"고려가 몽골의 침입에 맞서 강화도로 도읍을 옮긴 뒤 쌓은 성으로, 당시에는 내성·중성·외성을 갖춘 강도의 방어 시설이었다. 개경 환도 때 몽골의 요구로 헐렸으나 조선 숙종 때 돌로 다시 쌓아 오늘에 이른다.","u":"고려시대","c":1},{"k":"활인서","y":"조선 초","s":"유랑민을 구휼하는 활인서를 설치하였다.","d":"조선은 도성 안팎에 동활인서와 서활인서를 두어 갈 곳 없는 유랑민과 전염병 환자를 거두어 먹이고 치료하였다. 흉년에 곡식을 나눠 준 진휼청, 서민 진료를 맡은 혜민서와 함께 조선의 대표적인 구휼·의료 기구였다.","u":"조선시대","c":1},{"k":"경재소","y":"1409","s":"지방 고을에는 그곳의 유력한 집안이 있습니다. 그 가운데 서울에 살면서 벼슬하는 자들의 모임을 (가)이라고 합니다. …… 간사한 향리의 범법 행위를 살펴서 지방의 풍속을 유지했는데, 그 유래가 오래되었습니다.","d":"경재소는 서울에 사는 관리가 연고지의 유향소를 통제하도록 만든 기구로, 유향소 임원인 좌수와 별감의 임명권을 행사하였다. 중앙과 지방을 잇고 향촌을 통제하는 역할을 하였으나 폐단이 커져 1603년 선조 때 혁파되었다.","u":"조선시대","c":1},{"k":"유향소","y":"조선 초","s":"관할 유향소 임원의 임명권을 행사하였다.","d":"유향소는 지방 양반들이 만든 자치 기구로, 좌수와 별감을 뽑아 수령을 보좌하고 향리의 비리를 감찰하며 향촌의 풍속을 바로잡았다. 향회를 열어 여론을 모으고 향안과 향규를 두어 운영하였으며, 조선 후기에는 향청으로 불렸다.","u":"조선시대","c":1},{"k":"조선왕조실록","y":"1413","s":"사초와 시정기 등을 종합하여 편찬하였다.","d":"조선왕조실록은 태조부터 철종까지 472년의 역사를 연월일 순으로 적은 편년체 기록이다. 왕이 죽은 뒤 실록청을 세워 사관의 사초와 각 관청의 기록을 모은 시정기, 승정원일기 등을 종합해 편찬하였고, 1997년 유네스코 세계 기록 유산에 등재되었다.","u":"조선시대","c":1},{"k":"일성록","y":"1760","s":"한국의 세계 기록 유산 — 일성록","d":"정조가 세손 시절부터 하루를 반성하며 쓴 일기에서 비롯되어, 즉위 후 규장각 관원이 국왕의 동정과 국정을 정리한 국정 기록으로 발전하였다. 1760년부터 1910년까지 이어졌으며 2011년 유네스코 세계 기록 유산에 등재되었다.","u":"조선시대","c":1},{"k":"조보","y":"조선 시대","s":"국왕의 비서 기관에서 발행한 관보이다.","d":"조보는 승정원이 국왕의 명령과 인사, 조정의 소식을 정리해 관청과 관리에게 돌린 필사 형태의 관보로, 조선의 대표적인 관보이자 신문의 원형으로 평가된다. 선조 때 민간이 활자로 찍어 팔려다 처벌받은 일도 있었다.","u":"조선시대","c":1},{"k":"월인천강지곡","y":"1447","s":"훈민정음이 창제되고 3년 후에 왕비가 세상을 떠나자, (가)은/는 명복을 빌기 위해 아들 수양대군에게 부처의 일대기와 설법을 담은 석보상절을 편찬하도록 명했습니다. 그 내용을 (가)이/가 한글 노랫말로 옮긴 것이 월인천강지곡입니다.","d":"세종이 소헌 왕후의 명복을 빌기 위해 석보상절의 내용을 한글 노랫말로 옮긴 찬불가로, 하나의 달이 천 개의 강에 비친다는 뜻을 담았다. 훈민정음 창제 직후에 지어져 용비어천가와 함께 초기 한글의 모습을 전해 주는 귀중한 자료이다.","u":"조선시대","c":1},{"k":"석보상절","y":"1447","s":"아들 수양대군에게 부처의 일대기와 설법을 담은 석보상절을 편찬하도록 명했습니다.","d":"세종의 명으로 수양대군이 소헌 왕후의 명복을 빌기 위해 지은 석가모니의 일대기와 설법 모음으로, 1447년 한글로 간행되었다. 세조 때 월인천강지곡과 합쳐 월인석보로 다시 펴냈으며, 초기 한글 산문의 대표작으로 꼽힌다.","u":"조선시대","c":1},{"k":"하정사와 천추사","y":"조선 전기","s":"하정사, 천추사 등 사절단을 보냈다.","d":"조선은 명에 정기 사절을 보내는 사대 외교를 폈는데, 새해를 축하하는 하정사와 황태자의 생일을 축하하는 천추사, 황제의 생일에 가는 성절사 등이 있었다. 조공과 회사의 형식을 띠었지만 실제로는 선진 문물을 들여오는 공무역의 통로이기도 하였다.","u":"조선시대","c":1},{"k":"북한산성","y":"1711","s":"우리나라 성곽의 역사를 찾아서 — 북한산성","d":"숙종이 1711년 도성 방어를 보완하기 위해 북한산에 쌓은 산성으로, 유사시 왕이 피란할 수 있도록 행궁과 창고를 갖추었다. 임진왜란과 병자호란에서 도성을 지키지 못한 경험을 되풀이하지 않으려는 조치로, 남한산성과 함께 수도 외곽 방어의 축을 이루었다.","u":"조선시대","c":1},{"k":"정선의 진경산수화","y":"18세기","s":"이곳 철원 삼부연 폭포는 겸재 (가)이/가 그린 그림으로도 유명합니다. 우리 산천의 아름다움을 사실적으로 표현한 진경산수화를 실제 모습과 함께 감상해 보세요.","d":"겸재 정선은 중국 화풍을 그대로 따르던 관념 산수에서 벗어나 우리 산천을 직접 답사하고 그 모습을 화폭에 담은 진경산수화를 개척하였다. 금강산과 한양 주변, 철원 삼부연 폭포 등을 즐겨 그렸으며 조선 후기 회화의 새로운 흐름을 열었다.","u":"조선시대","c":1},{"k":"인왕제색도","y":"1751","s":"진경산수화의 대표작인 인왕제색도","d":"정선이 1751년 비가 갠 뒤의 인왕산을 그린 그림으로, 물기를 머금은 바위를 짙은 먹으로 대담하게 칠해 웅장한 느낌을 살렸다. 벗 이병연의 쾌유를 빌며 그렸다고 전하며, 진경산수화의 절정을 보여 주는 국보이다.","u":"조선시대","c":1},{"k":"금강전도","y":"1734","s":"금강산 일만 이천 봉을 한 화면에 담은 금강전도","d":"정선이 금강산 일만 이천 봉을 위에서 내려다본 시점으로 한 화면에 담은 그림이다. 왼쪽의 흙산은 부드러운 붓질로, 오른쪽의 바위산은 날카로운 수직 선으로 대비시켜 금강산의 기세를 표현한 진경산수화의 걸작이다.","u":"조선시대","c":1},{"k":"신해박해","y":"1791","s":"윤지충 등이 처형된 신해박해가 일어났다.","d":"1791년 전라도 진산의 윤지충과 권상연이 천주교 교리에 따라 신주를 불사르고 어머니 제사를 지내지 않은 일이 문제가 되어 처형된 사건으로, 진산 사건이라고도 한다. 조선에서 일어난 최초의 천주교 박해였으나 정조가 확대를 막아 큰 옥사로 번지지는 않았다.","u":"조선시대","c":1},{"k":"단성현 호적과 직역 변화","y":"조선 후기","s":"이것은 경상도 단성현 김○봉 가계의 직역 변화입니다. 사노비였던 그는 노력 끝에 면천되었고, 후손들도 꾸준히 신분 상승을 도모하여 유학 직역을 획득하였습니다.","d":"조선 후기 호적 대장을 보면 노비가 면천되고 그 후손이 유학을 칭하는 등 직역이 바뀌는 사례가 나타난다. 납속책과 공명첩으로 신분을 사거나 족보를 고쳐 양반을 칭하는 일이 늘면서 양반 수가 급증하고 상민과 노비가 줄어 신분 질서가 크게 흔들렸다.","u":"조선시대","c":1},{"k":"시전 상인 철시 시위","y":"1890","s":"며칠 전 시전 상인 수백 명이 가게 문을 닫고 외아문(통리교섭통상사무아문) 앞에서 연좌시위를 시작하였다. 시전 상인들은 몇 해 전부터 외국 상인의 한성 침투로 인해 입는 피해가 크다는 점을 주장하며 퇴거를 요구하였다.","d":"조청 상민 수륙 무역 장정으로 청 상인의 한성 진출이 허용되고 일본 상인까지 뒤따르자, 시전 상인들은 1890년 가게 문을 닫는 철시로 맞서며 외국 상인의 퇴거를 요구하였다. 이러한 상권 수호 움직임은 뒷날 황국 중앙 총상회 결성으로 이어졌다.","u":"개화기","c":1},{"k":"주미 대한 제국 공사관","y":"1889","s":"이곳은 1889년부터 외교 공관으로 사용되었으나, (가)으로 외교권을 박탈당하여 그 기능을 상실하였습니다. 현재 이 건물을 대한민국 정부가 매입하여 전시관으로 활용하고 있습니다.","d":"조선은 1888년 박정양을 초대 주미 공사로 보내 이듬해부터 워싱턴에 공사관을 두고 자주 외교를 폈다. 청의 방해 속에서도 독립국임을 알리는 창구였으나 1905년 을사늑약으로 외교권을 빼앗기며 문을 닫았고, 2012년 정부가 건물을 되사 전시관으로 쓰고 있다.","u":"개화기","c":1},{"k":"풍납동 토성과 석촌동 고분군","y":"한성 백제","s":"1일차 – 풍납동 토성, 석촌동 고분군","d":"서울 송파 일대에 남은 한성 백제의 유적이다. 풍납동 토성은 흙을 다져 쌓은 대규모 성으로 왕성으로 추정되며, 석촌동 고분군의 계단식 돌무지무덤은 고구려 무덤과 형태가 같아 백제 건국 세력이 고구려에서 갈라져 나왔음을 뒷받침한다.","u":"삼국시대","c":1},{"k":"익산 왕궁리 오층 석탑","y":"7세기","s":"왕궁리 오층 석탑이 있다.","d":"백제 무왕이 익산에 조성한 왕궁 터에 서 있는 탑으로, 좁고 낮은 지붕돌과 목탑을 본뜬 짜임이 부여 정림사지 오층 석탑을 잇는 백제계 양식을 보여 준다. 다만 세운 시기는 백제 멸망 뒤인 고려 초로 보는 견해가 유력하다.","u":"삼국시대","c":1},{"k":"안악 3호분과 개마 무사","y":"357","s":"이것은 (가)의 쌍영총 벽화의 개마 무사 부분 모사도입니다. 안악 3호분 등 (가)의 다른 고분 벽화에서도 개마 무사가 그려져 있어 이 국가의 군사, 무기 등의 모습을 알 수 있습니다.","d":"황해도 안악 3호분은 357년이라는 묵서명이 남은 굴식 돌방무덤으로, 대행렬도에 말과 사람이 모두 갑옷을 두른 개마 무사가 그려져 있다. 쌍영총 등 다른 고구려 고분 벽화에도 같은 중장 기병이 등장해 당시 군사와 무기의 모습을 전해 준다.","u":"삼국시대","c":1},{"k":"분황사 모전 석탑","y":"634","s":"돌을 벽돌 모양으로 다듬어 쌓았다.","d":"선덕 여왕 때인 634년 세워진 현존 최고(最古)의 신라 석탑으로, 안산암을 벽돌 모양으로 다듬어 쌓은 모전 석탑이다. 원래 9층으로 추정되나 현재 3층만 남아 있으며, 네 모서리에 돌사자를, 1층 몸돌 사면에 인왕상을 새겼다.","u":"삼국시대","c":1},{"k":"왕거인 필화 사건","y":"888","s":"화면에 표시된 부분은 진성여왕 때 유포된 글로 당시 정치 상황을 비판하는 내용입니다. 삼국유사에 따르면 찰니나제는 여왕을, 소판니와 삼아간은 위홍 등 간신들을 의미하는 것으로, 그들 때문에 나라가 망한다는 뜻입니다.","d":"진성 여왕 때 다라니 형식을 빌려 여왕과 위홍 등 총신을 비판하는 글이 저잣거리에 나붙자, 조정은 문인 왕거인을 범인으로 몰아 가두었다. 신라 하대 왕실의 문란과 이에 대한 지식인의 비판을 보여 주는 사건으로, 이듬해 원종과 애노의 난이 일어났다.","u":"삼국시대","c":1},{"k":"창녕 진흥왕 척경비","y":"561","s":"만옥정 공원에서 둘러본 신라 진흥왕 척경비","d":"진흥왕이 561년 대가야 방면으로 영토를 넓힌 뒤 창녕에 세운 비이다. 순수관경이라는 표현이 없어 순수비가 아닌 척경비로 분류하며, 비에 새겨진 수행 신하의 이름과 관등은 신라 관등제와 지방 통치를 연구하는 자료가 된다.","u":"삼국시대","c":1},{"k":"노비환천법","y":"987","s":"면천된 노비가 주인을 욕하면 환천하게 하다","d":"광종의 노비안검법으로 양인이 된 이들 가운데 옛 주인을 업신여기는 일이 생기자, 성종은 987년 이들을 다시 노비로 되돌리는 노비환천법을 시행하였다. 호족의 반발을 달래려는 조치로, 광종 대의 개혁이 일부 되돌려졌음을 보여 준다.","u":"고려시대","c":1},{"k":"김사미와 효심의 난","y":"1193","s":"김사미와 효심이 난을 일으켰어요.","d":"무신 집권기인 1193년 운문에서 김사미가, 초전에서 효심이 지방관의 가혹한 수탈에 맞서 봉기하여 서로 연합하였다. 경상도 일대를 휩쓴 최대 규모의 농민 항쟁으로 이의민 정권이 흔들리는 계기가 되었으며, 개경에서 일어난 만적의 난과 함께 무신 집권기 하층민 봉기를 대표한다.","u":"고려시대","c":2},{"k":"노국 대장 공주","y":"1349","s":"이 그림은 공민왕과 그의 왕비인 노국 대장 공주의 초상화야. 고려에는 노국 대장 공주 외에도 제국 대장 공주, 계국 대장 공주 등 원 출신의 왕비들이 여럿 있었어.","d":"원 황족 출신으로 공민왕과 혼인한 왕비로, 왕이 기철 일파를 숙청하고 반원 개혁을 펼 때 이를 지지하였다. 1365년 난산으로 세상을 떠나자 공민왕은 크게 상심해 국정을 신돈에게 맡겼으며, 충렬왕부터 공민왕까지 고려 왕들은 원 공주와 혼인하였다.","u":"고려시대","c":1},{"k":"고려도경","y":"1123","s":"1123년 송 사절의 한 사람으로 (가)에 왔던 서긍이 지은 책입니다. 이 책은 서긍이 예성항을 통해 개경으로 들어와 한 달 남짓 머물며 보고 들은 (가)의 다양한 모습을 그림을 곁들여 설명한 것입니다.","d":"송의 사신 서긍이 1123년 개경에 한 달 남짓 머물며 보고 들은 고려의 제도와 풍속, 물산을 글과 그림으로 정리한 책으로, 정식 이름은 선화봉사고려도경이다. 그림은 없어지고 글만 전하지만 고려청자를 비색이라 칭찬하는 등 당대 고려를 생생히 전해 준다.","u":"고려시대","c":1},{"k":"경천사지 십층 석탑","y":"1348","s":"이 탑은 원래 개성에 있었는데 지금은 국립 중앙 박물관에 옮겨져 새로운 영상 기법으로 전시되고 있습니다. (가) 시대에 만들어진 이 탑은 이후 원각사지 십층 석탑에 영향을 주기도 하였습니다.","d":"1348년 개성 경천사에 세운 대리석 탑으로, 원의 영향을 받아 기단과 몸돌을 아(亞)자 모양으로 만들고 표면을 불상과 용으로 빼곡히 새겼다. 일제 강점기에 일본으로 무단 반출되었다가 돌아왔으며, 조선 세조 때의 원각사지 십층 석탑에 영향을 주었다.","u":"고려시대","c":1},{"k":"임유무와 개경 환도","y":"1270","s":"왕이 먼저 나라 안의 신하들을 권유하여 개경으로 환도하게 하였다. 여러 신하들이 말하기를 \"임금의 명령인데, 감히 따르지 않을 수 있겠는가?\"라고 하였으므로, 임유무가 화가 나서 어떻게 해야 할지를 알지 못하였다.","d":"1270년 원종이 개경 환도를 밀어붙이자 마지막 무신 집권자 임유무가 이에 맞섰으나 부하들에게 살해되어 100년간의 무신 정권이 막을 내렸다. 환도가 단행되자 이에 반발한 삼별초가 강화도에서 봉기해 진도와 제주로 옮겨 가며 항쟁하였다.","u":"고려시대","c":1},{"k":"정년도목","y":"1225","s":"백관이 최우의 집에 나아가 정년도목(政年都目)을 올렸다. 최우가 청사에 앉아 그것을 받았다. 6품 이하는 당하(堂下)에서 두 번 절하고 땅에 엎드려 감히 고개를 들고 보지 못하였다.","d":"정년도목은 해마다 관리의 인사를 정리해 올리던 문서이다. 최우는 1225년 자기 집에 정방을 두고 이 문서를 직접 받아 백관의 인사 행정을 처리하였으니, 최씨 정권이 국왕을 제치고 인사권까지 장악하였음을 보여 준다.","u":"고려시대","c":1},{"k":"민무구·민무질","y":"1410","s":"임금께서 민무구, 민무질에게 자결을 명하셨다더군. 몇 해 전 어린 세자를 이용해 권세를 잡으려 했다는 죄로 귀양을 보내셨었지.","d":"태종의 왕비 원경 왕후의 동생들로, 두 차례 왕자의 난에서 공을 세웠으나 어린 세자를 끼고 권세를 노렸다는 죄목으로 유배되었다가 1410년 자결을 명받았다. 외척을 미리 제거해 왕권을 다지려 한 태종의 정치를 보여 주는 사건이다.","u":"조선시대","c":1},{"k":"최만리","y":"1444","s":"만리재는 조선의 문신 최만리가 살았다고 하여 붙여진 지명이다. 세자의 스승이기도 하였던 최만리는 세종이 학문 연구, 편찬 사업 등을 수행하도록 설치한 (가)의 부제학으로 활약하였다. 그러나 훈민정음 창제를 반대하는 상소를 올려 세종과 갈등을 빚기도 하였다.","d":"집현전 부제학을 지낸 문신으로, 1444년 새 문자를 만드는 것은 중국을 섬기는 도리에 어긋나고 이두로 충분하다는 논지의 상소를 올려 훈민정음 창제에 반대하였다. 세종과 정면으로 맞선 대표적 사례이나, 그 밖에는 청렴한 학자로 평가받았다.","u":"조선시대","c":1},{"k":"장악원","y":"1470","s":"장악원 소장의 의궤와 악보가 오랜 세월이 지나서 끊어지고 문드러졌습니다. …… 이에 성현 등에게 명하여 다시 교정하게 하였다. 책이 완성되자 악학궤범이라고 이름 지었다.","d":"궁중 음악과 무용을 맡아보던 관청으로, 제례와 연회에 쓰이는 악곡을 연주하고 악공과 악생을 가르쳤다. 성종은 이곳에 전하던 악보가 낡자 성현 등에게 명해 정리하게 하였고, 그 결과 음악 이론을 집대성한 악학궤범이 완성되었다.","u":"조선시대","c":1},{"k":"동문휘고","y":"1788","s":"외교 문서를 집대성한 동문휘고가 편찬되었다.","d":"정조의 명으로 1788년 편찬된 외교 문서집으로, 조선 후기 청과 일본을 오간 국서와 자문 등을 사안별로 모아 정리하였다. 사대교린 외교의 실무 지침이자 조선 후기 대외 관계를 연구하는 데 빼놓을 수 없는 자료이다.","u":"조선시대","c":1},{"k":"김효원과 심의겸","y":"1575","s":"이조 전랑 임명을 둘러싸고 김효원과 심의겸이 대립하였다.","d":"1575년 이조 전랑 자리를 놓고 신진 사림을 대표하는 김효원과 외척인 심의겸이 맞서면서 사림이 갈라졌다. 김효원이 서울 동쪽에 살아 그 편을 동인, 심의겸이 서쪽에 살아 그 편을 서인이라 불렀으니 붕당 정치의 출발점이 되었다.","u":"조선시대","c":1},{"k":"효릉과 인종","y":"1545","s":"이곳은 최근에 개방된 효릉입니다. 조선 국왕 인종과 그의 왕비 인성왕후가 모셔져 있습니다. 인종은 즉위한 지 1년도 되지 않아 사망하였습니다.","d":"중종의 맏아들로 즉위한 인종은 조광조를 신원하고 현량과를 되살리는 등 사림을 다시 등용하였으나 재위 8개월 만에 세상을 떠났다. 뒤를 이은 명종이 어려 문정 왕후가 수렴청정하면서 윤임과 윤원형 외척 간의 다툼이 을사사화로 번졌다.","u":"조선시대","c":1},{"k":"사로승구도","y":"1748","s":"「사로승구도」는 1748년 에도 막부의 요청으로 조선이 일본에 파견한 (가)이/가 부산에서 에도에 이르는 여정을 담은 작품입니다. 일본의 명승지나 사행 중 겪은 인상적인 광경을 30장면으로 표현하였습니다.","d":"1748년 통신사를 따라간 화원 이성린이 부산을 떠나 에도에 이르는 뱃길과 육로를 30장면에 담은 기록화이다. 일본의 명승과 사행 중의 광경을 사실적으로 그려, 조선 후기 통신사의 여정과 한일 문화 교류를 보여 주는 자료이다.","u":"조선시대","c":1},{"k":"조천록","y":"조선 전기","s":"사행을 다녀온 여정을 조천록으로 남겼다.","d":"조선 전기 명에 다녀온 사신들이 남긴 사행 기록을 조천록 또는 조천기라 한다. 천자를 뵈러 간다는 뜻을 담았으며, 병자호란 뒤 청에 보낸 사행 기록을 단순히 연경에 다녀왔다는 뜻의 연행록이라 부른 것과 대비된다.","u":"조선시대","c":1},{"k":"강희안","y":"15세기","s":"인재(仁齋) 강희안 특별전 — 조선 전기 시·그림·글씨에 모두 뛰어난 것으로 유명했던 강희안의 대표작으로 간결하고 과감한 필치가 돋보인다.","d":"세종 대의 문신으로 시와 그림, 글씨에 두루 뛰어나 삼절로 불렸다. 집현전 학사로 훈민정음 해례 편찬과 용비어천가 주석에 참여하였고, 우리나라 최초의 원예서인 양화소록을 지어 꽃과 나무 기르는 법을 정리하였다.","u":"조선시대","c":1},{"k":"고사관수도","y":"15세기","s":"강희안의 대표작으로 간결하고 과감한 필치가 돋보인다.","d":"강희안이 그린 그림으로, 바위에 턱을 괴고 엎드려 흐르는 물을 바라보는 선비를 담았다. 배경을 과감히 생략하고 굵고 거친 붓질로 인물의 표정에 집중해, 자연 속에서 사색하는 사대부의 정신세계를 드러낸 조선 전기 회화의 대표작이다.","u":"조선시대","c":1},{"k":"이원익","y":"1608","s":"이원익은 방납의 폐단을 없애고자 선혜청을 두고 이 법을 실시할 것을 주장했습니다.","d":"선조부터 인조까지 다섯 임금을 섬기며 여러 차례 영의정을 지낸 재상으로, 청백리로 이름이 높았다. 1608년 광해군이 즉위하자 방납의 폐단을 없애기 위해 선혜청을 두고 경기도에 대동법을 시행할 것을 건의하여 관철시켰다.","u":"조선시대","c":1},{"k":"제주 귤림 서원","y":"1689","s":"기축봉사를 올려 명에 대한 의리를 강조한 나는 희빈 장씨의 소생을 원자로 정한 데 반대하다가 이곳 제주도로 유배되었습니다.","d":"제주에 유배되었던 김정·송인수·정온·김상헌·송시열 다섯 사람을 기리는 서원으로, 오현단이 그 터에 남아 있다. 송시열은 1689년 기사환국 때 원자 책봉에 반대하다 제주로 유배되었고, 서울로 압송되던 길에 정읍에서 사약을 받았다.","u":"조선시대","c":1},{"k":"시목전과 염해전","y":"조선 후기","s":"매우 심하게 폐단을 빚는 3강(한강·용산강·서강)의 시목전(柴木廛)·염해전(鹽醢廛)과 같은 무리는 그 주모자를 색출하여 형조로 송치해서 엄한 형벌로 다스려 후일을 징계하도록 분부하는 것이 어떻겠습니까?","d":"조선 후기 한강·용산강·서강 일대에는 땔감을 파는 시목전과 소금·젓갈을 파는 염해전 같은 시전이 들어섰다. 이들은 물건을 미리 사재어 값을 조종하는 도고 상업으로 큰 이익을 남겼고, 물가가 뛰자 정부가 주모자를 처벌하며 단속에 나섰다.","u":"조선시대","c":1},{"k":"슈펠트","y":"1867","s":"9월 말에 평양의 대동강에서 좌초한 미국 상선에 승선한 사람들이 살해당했고 배가 불살라졌다는 고통스럽고 놀랄 만한 사건이 있었다고 들었습니다. — 미국 군함 와추세트 수사총병 슈펠트","d":"미국 해군 장교 슈펠트는 1867년 군함 와추세트호를 이끌고 와 제너럴 셔먼호 사건의 진상을 물었으나 답을 얻지 못하였다. 훗날 청의 이홍장을 통해 조선과 교섭하여 1882년 조미 수호 통상 조약 체결을 이끌어 냈다.","u":"개화기","c":1},{"k":"고광순","y":"1907","s":"이곳 지리산 연곡사에는 의병장 고광순의 순절비가 있습니다. 그는 지리산을 중심으로 장기 항전을 계획하다가 일본군의 토벌 작전으로 순국하였습니다.","d":"임진왜란 때 순절한 고경명의 후손으로, 을사늑약에 이어 고종 강제 퇴위와 군대 해산이 이어지자 전라도에서 의병을 일으켰다. 지리산을 근거지로 삼아 장기 항전을 꾀하다 1907년 연곡사에서 일본군의 기습을 받고 순국하였다.","u":"개화기","c":1},{"k":"덕수궁 정관헌","y":"1900","s":"덕수궁 내에 있는 정관헌은 전통 건축 양식에 근대적 요소를 결합한 것으로 평가받고 있습니다. 고종이 황제로 즉위한 후 구본신참을 바탕으로 개혁을 추진할 때 건립되었습니다.","d":"대한 제국 시기 덕수궁 안에 세운 서양식 정자로, 고종이 커피를 마시며 쉬거나 외국 사절을 맞던 곳이다. 로마네스크식 기둥에 박쥐와 소나무 등 전통 문양을 새긴 난간을 둘러, 옛것을 근본으로 새것을 참고한다는 구본신참의 정신을 건축으로 보여 준다.","u":"개화기","c":1},{"k":"감은사지 동 삼층 석탑","y":"682","s":"(나) 경주 감은사지 동 삼층 석탑","d":"신문왕이 682년 감은사를 완성하며 금당 앞에 나란히 세운 두 탑 가운데 하나로, 통일 신라 삼층 석탑의 첫 모습을 보여 준다. 이중 기단 위에 3층 몸돌을 올린 웅장한 구조는 뒷날 불국사 삼층 석탑으로 이어지는 전형 양식의 출발점이 되었다.","u":"삼국시대","c":1},{"k":"무용총 수렵도","y":"5세기","s":"말을 타고 활을 쏘며 사슴을 쫓는 사냥 장면이 그려져 있다.","d":"중국 지린성 지안의 고구려 굴식 돌방무덤 벽화로, 말 위에서 몸을 돌려 활을 쏘는 무사와 달아나는 사슴·호랑이를 힘차게 그렸다. 인물을 신분에 따라 크게 또는 작게 그린 점에서 고구려의 신분 질서도 읽을 수 있다.","u":"삼국시대","c":0},{"k":"각저총 씨름도","y":"5세기","s":"두 사람이 씨름하는 장면과 나무 아래 심판이 그려져 있다.","d":"지안에 있는 고구려 고분 벽화로, 큰 나무 아래에서 두 장사가 맞붙어 씨름하는 모습을 담았다. 한 사람이 눈이 크고 코가 높은 서역인의 모습이어서 고구려가 서역과 교류하였음을 보여 주는 자료로 꼽힌다.","u":"삼국시대","c":0},{"k":"수산리 고분 벽화","y":"5세기","s":"교예를 구경하는 귀족 부부와 시녀가 그려져 있다.","d":"평안남도 강서의 고구려 고분 벽화로, 나들이 나온 귀족 부부가 재주 부리는 광대를 구경하는 장면을 담았다. 여인이 입은 주름치마가 일본 다카마쓰 고분 벽화의 여인상과 닮아 고구려가 일본에 문화를 전했음을 보여 준다.","u":"삼국시대","c":0},{"k":"강서대묘 사신도","y":"7세기","s":"무덤 방 네 벽에 청룡·백호·주작·현무를 그렸다.","d":"평안남도 강서의 고구려 후기 고분으로, 널방 네 벽에 방위를 지키는 사신을 그리고 천장에는 연꽃과 구름을 배치하였다. 생활 풍속 대신 사신을 그린 것은 도교가 널리 퍼졌음을 뜻하며, 힘차고 세련된 필치로 고구려 회화의 절정을 보여 준다.","u":"삼국시대","c":0},{"k":"금동 연가 7년명 여래 입상","y":"539","s":"광배 뒷면에 연가 7년이라는 글자가 새겨져 있다.","d":"경남 의령에서 발견된 고구려 불상으로, 광배 뒤에 연가 7년에 평양 동사에서 만들었다는 글이 새겨져 있다. 길쭉한 얼굴과 좌우로 뻗친 옷자락이 중국 북위 양식을 따르며, 고구려 불상이 신라 땅까지 전해졌음을 보여 준다.","u":"삼국시대","c":0},{"k":"서산 용현리 마애여래 삼존상","y":"7세기","s":"백제의 미소라 불리는 바위에 새긴 삼존불이다.","d":"서산 가야산 절벽에 새긴 백제 불상으로, 가운데 여래 입상과 좌우의 보살·반가사유상으로 이루어졌다. 부드럽고 온화한 웃음 때문에 백제의 미소로 불리며, 빛이 드는 방향에 따라 표정이 달라 보이는 것이 특징이다.","u":"삼국시대","c":0},{"k":"공주 무령왕릉","y":"525","s":"지석이 함께 나와 무덤의 주인과 만든 시기를 알 수 있는 벽돌무덤이다.","d":"1971년 송산리 고분군에서 도굴되지 않은 채 발견된 백제 무덤으로, 중국 남조의 영향을 받아 벽돌로 쌓았다. 무덤 주인과 축조 연대를 적은 지석이 나와 삼국 시대 무덤 가운데 유일하게 주인을 확정할 수 있으며, 금제 관식과 석수 등 유물 수천 점이 출토되었다.","u":"삼국시대","c":0},{"k":"산수무늬 벽돌","y":"7세기","s":"산과 나무, 구름을 새겨 도교의 이상 세계를 표현하였다.","d":"부여 외리의 절터에서 나온 백제 벽돌로, 아래에 물, 가운데에 산과 소나무, 위에 구름을 배치해 신선이 사는 세계를 그렸다. 백제 금동 대향로와 함께 백제 귀족 사회에 도교 사상이 퍼져 있었음을 보여 준다.","u":"삼국시대","c":0},{"k":"사택지적비","y":"654","s":"백제 귀족이 세월의 덧없음을 한탄하며 세운 비석이다.","d":"의자왕 때 대좌평을 지낸 사택지적이 654년 세운 비로, 늙어 가는 것을 한탄하며 절과 탑을 세운 사연을 사륙변려체의 유려한 한문으로 새겼다. 백제 귀족의 높은 한문 소양과 노장 사상의 영향을 함께 보여 준다.","u":"삼국시대","c":0},{"k":"단양 신라 적성비","y":"551","s":"진흥왕이 남한강 상류로 진출한 뒤 공을 세운 이들을 표창하며 세웠다.","d":"진흥왕이 죽령을 넘어 단양 지역을 차지한 뒤, 신라를 도운 적성 사람 야이차와 그 가족을 표창하고 새 영토의 백성을 위로하기 위해 세운 비이다. 이사부·거칠부 등 당시 고위 관리의 이름이 새겨져 있어 6세기 신라의 관등제를 알려 준다.","u":"삼국시대","c":0},{"k":"울진 봉평리 신라비","y":"524","s":"법흥왕 때 율령에 따라 지방민을 처벌한 내용이 새겨져 있다.","d":"법흥왕 때인 524년 울진 지역에서 일어난 분쟁을 처리하며 세운 비로, 노인법 등 율령에 따라 관련자를 처벌한 사실을 적었다. 신라가 율령을 반포하고 지방까지 법으로 다스렸음을 실물로 확인시켜 주는 자료이다.","u":"삼국시대","c":0},{"k":"포항 냉수리 신라비","y":"503","s":"재산 상속을 둘러싼 다툼을 왕과 귀족들이 함께 판결한 내용이 새겨져 있다.","d":"지증왕 때인 503년 절거리라는 인물의 재산 소유를 둘러싼 분쟁을 왕과 여섯 부의 유력자가 함께 의논해 판결한 내용을 새긴 비이다. 사라라는 국호와 갈문왕 칭호가 보여 아직 왕권이 귀족 회의를 넘어서지 못한 단계임을 알려 준다.","u":"삼국시대","c":0},{"k":"우륵과 가야금","y":"6세기","s":"가야금을 만들고 신라에 투항하여 음악을 전하였다.","d":"대가야의 악사 우륵은 가실왕의 명으로 가야금을 만들고 12곡을 지었다. 나라가 기울자 신라 진흥왕에게 투항해 국원소경, 곧 충주에 살면서 제자들에게 가야금과 노래·춤을 전하였고 그 음악은 신라의 궁중 음악이 되었다.","u":"삼국시대","c":0},{"k":"다보탑","y":"8세기","s":"목조 건축을 본떠 화려하게 꾸민 통일 신라의 이형 석탑이다.","d":"불국사 대웅전 앞에 석가탑과 마주 서 있는 탑으로, 네모난 기단에 계단을 내고 그 위에 팔각 난간과 지붕을 올려 목조 건축을 돌로 옮긴 듯 화려하다. 정해진 틀을 벗어난 이형 석탑의 대표작으로 통일 신라 석공의 기량을 보여 준다.","u":"삼국시대","c":0},{"k":"상원사 동종","y":"725","s":"현존하는 우리나라 종 가운데 가장 오래된 통일 신라의 범종이다.","d":"725년에 만들어진 현존 최고(最古)의 우리나라 종으로, 강원도 평창 상원사에 있다. 몸통에 하늘을 날며 악기를 연주하는 비천상을 새겼고, 소리를 고르게 하는 음통을 갖추어 한국 범종의 기본 형식을 이루었다.","u":"삼국시대","c":0},{"k":"경주 동궁과 월지","y":"674","s":"태자가 머물던 별궁과 연못으로 안압지라고도 불린다.","d":"문무왕이 삼국 통일을 이룬 뒤 조성한 별궁과 인공 연못으로, 조선 시대에 기러기와 오리가 날아든다 하여 안압지라 불렸다. 연못 바닥에서 주사위인 주령구와 목간, 금속 공예품 등 3만여 점이 나와 통일 신라 귀족의 생활을 전해 준다.","u":"삼국시대","c":0},{"k":"원측","y":"7세기","s":"당에 건너가 유식 사상을 연구하고 서명학파를 이루었다.","d":"신라 출신 승려로 당에 건너가 현장의 문하에서 유식 사상을 배웠다. 서명사에 머물며 독자적인 해석을 펴 서명학파를 이루었고, 그 학풍은 티베트 불교에까지 영향을 미쳐 국제적으로 이름을 떨쳤다.","u":"삼국시대","c":0},{"k":"평창 월정사 팔각 구층 석탑","y":"11세기","s":"송의 영향을 받은 다각 다층 석탑이다.","d":"강원도 평창 월정사에 있는 고려 전기의 석탑으로, 여덟 모의 몸돌을 아홉 층까지 쌓아 올렸다. 신라의 사각 삼층 석탑과 달리 송의 영향을 받은 다각 다층 양식이며, 개성 있는 지방 문화의 발달을 보여 준다.","u":"고려시대","c":0},{"k":"하남 하사창동 철조석가여래좌상","y":"10세기","s":"고려 초 지방 호족의 후원으로 만들어진 대형 철불이다.","d":"높이 2.8미터에 이르는 우리나라 최대의 철불로, 경기도 하남의 절터에서 옮겨 왔다. 신라 불상의 자세를 이어받았으나 얼굴이 평면적이고 어깨가 벌어진 점이 다르며, 고려 초 지방 호족이 세력을 과시하며 후원한 불교 미술을 보여 준다.","u":"고려시대","c":0},{"k":"수월관음도","y":"14세기","s":"물가 바위에 앉은 관음보살을 섬세하게 그린 고려 불화이다.","d":"달빛 어린 물가 바위에 걸터앉은 관음보살과 이를 우러르는 선재동자를 그린 고려 후기 불화이다. 비단 뒤에서 색을 칠하는 배채법으로 은은한 빛깔을 내고 옷의 무늬를 금니로 세밀하게 그려, 세계적으로 높이 평가받는 고려 귀족 문화의 정수이다.","u":"고려시대","c":0},{"k":"청자 참외 모양 병","y":"12세기","s":"무늬 없이 형태와 비색만으로 아름다움을 살린 순청자이다.","d":"고려 인종의 무덤에서 나온 것으로 전하는 12세기 순청자로, 참외를 닮은 몸체와 주름진 아가리가 단정한 곡선을 이룬다. 무늬를 넣지 않고 맑은 비색과 형태만으로 아름다움을 낸 고려 순청자 절정기의 작품이다.","u":"고려시대","c":0},{"k":"다포 양식","y":"고려 후기","s":"기둥 사이에도 공포를 짜 올린 건축 양식으로 성불사 응진전이 대표적이다.","d":"지붕 무게를 받치는 공포를 기둥 위뿐 아니라 기둥 사이에도 얹어 화려한 느낌을 주는 건축 양식으로, 원의 영향을 받아 고려 후기에 들어왔다. 황해도 성불사 응진전과 심원사 보광전이 대표적이며, 조선 시대 궁궐과 큰 절 건물로 이어졌다.","u":"고려시대","c":0},{"k":"숭례문","y":"1398","s":"한양 도성의 남쪽 정문으로 국보 제1호로 지정되었다.","d":"태조 때 한양 도성을 쌓으며 세운 남쪽 정문으로, 예를 숭상한다는 뜻을 담아 숭례문이라 하였다. 현존하는 서울의 목조 건축 가운데 가장 오래되었으며, 2008년 방화로 불탄 뒤 5년에 걸쳐 복구되었다.","u":"조선시대","c":0},{"k":"창덕궁","y":"1405","s":"자연 지형을 살려 지은 궁궐로 유네스코 세계 유산에 등재되었다.","d":"태종이 세운 이궁으로, 임진왜란으로 경복궁이 불탄 뒤 270여 년 동안 조선의 정궁 노릇을 하였다. 지형을 깎지 않고 그대로 살려 건물을 앉힌 점과 아름다운 후원이 높이 평가되어 1997년 세계 유산에 등재되었다.","u":"조선시대","c":0},{"k":"창경궁","y":"1483","s":"성종이 대비들을 모시기 위해 지은 궁궐이다.","d":"성종이 세조비 정희 왕후 등 세 대비를 모시기 위해 옛 수강궁 터에 세운 궁궐이다. 정전인 명정전은 현존하는 조선 궁궐 정전 가운데 가장 오래되었으며, 일제 강점기에 동물원과 식물원이 들어서며 창경원으로 격하되었다가 1980년대에 복원되었다.","u":"조선시대","c":0},{"k":"종묘와 사직단","y":"1395","s":"왼쪽에 종묘, 오른쪽에 사직단을 두는 좌묘우사에 따라 배치하였다.","d":"종묘는 역대 왕과 왕비의 신주를 모신 사당이고, 사직단은 토지의 신과 곡식의 신에게 제사 지내던 제단이다. 한양 천도 때 경복궁을 중심으로 좌묘우사의 원칙에 따라 배치하였으며, 종묘는 제례와 제례악과 함께 세계 유산에 등재되었다.","u":"조선시대","c":0},{"k":"법주사 팔상전","y":"1626","s":"현존하는 유일한 조선 시대 오층 목탑이다.","d":"충북 보은 법주사에 있는 우리나라에 하나뿐인 조선 시대 목탑으로, 임진왜란 때 불탄 것을 1626년에 다시 세웠다. 안쪽 벽에 석가의 일생을 여덟 장면으로 그린 팔상도가 걸려 있어 팔상전이라 부른다.","u":"조선시대","c":0},{"k":"금산사 미륵전","y":"1635","s":"겉은 삼층이지만 안은 하나로 트인 조선 후기의 불전이다.","d":"전북 김제 금산사에 있는 불전으로, 바깥에서 보면 삼층이지만 안은 위아래가 트여 거대한 미륵불을 모셨다. 화엄사 각황전, 법주사 팔상전과 함께 조선 후기 불교의 사회적 성장과 건축 기술의 발달을 보여 준다.","u":"조선시대","c":0},{"k":"화엄사 각황전","y":"1702","s":"현존하는 목조 건물 가운데 가장 큰 조선 후기의 중층 불전이다.","d":"전남 구례 화엄사에 있는 조선 후기의 이층 불전으로, 우리나라 목조 건축 가운데 규모가 가장 크다. 숙종이 깨달음의 왕이라는 뜻으로 각황전이라 이름 지었으며, 조선 후기 신도들의 시주로 큰 불사가 이루어졌음을 보여 준다.","u":"조선시대","c":0},{"k":"한국의 서원","y":"조선 시대","s":"소수·도산·병산·옥산·돈암 서원 등 아홉 곳이 세계 유산에 등재되었다.","d":"서원은 선현에게 제사 지내고 지방 양반의 자제를 가르치던 사립 교육 기관이다. 주세붕이 세운 소수 서원을 시작으로 전국에 퍼졌으며, 소수·남계·옥산·도산·필암·도동·병산·무성·돈암 아홉 곳이 2019년 세계 유산에 등재되었다.","u":"조선시대","c":0},{"k":"천상열차분야지도","y":"1395","s":"고구려의 천문도를 바탕으로 태조 때 돌에 새긴 천문도이다.","d":"태조 때인 1395년 고구려 평양성의 천문도 탁본을 바탕으로 돌에 새긴 천문도로, 1,467개의 별을 위치와 밝기에 따라 새겼다. 새 왕조의 권위가 하늘에서 비롯되었음을 내세우려는 뜻을 담았으며, 세계에서 손꼽히게 오래된 천문도이다.","u":"조선시대","c":0},{"k":"측우기","y":"1441","s":"세계 최초로 강우량을 재기 위해 만든 기구이다.","d":"1441년 세종 때 장영실 등이 만든 강우량 측정 기구로, 원통에 고인 빗물의 깊이를 자로 재어 기록하였다. 전국 관청에 보급해 지역별 강우량을 모아 조세 부과와 농사에 활용하였으며, 서양보다 200년 가까이 앞섰다.","u":"조선시대","c":0},{"k":"혼천의","y":"1433","s":"천체의 운행과 위치를 관측하던 기구이다.","d":"여러 겹의 둥근 테를 짜 맞춰 해와 달, 별의 위치와 움직임을 살피던 천문 관측 기구로, 세종 때 장영실과 이천 등이 만들었다. 뒤에 홍대용이 물레바퀴로 돌아가는 혼천시계를 만들어 발전시켰다.","u":"조선시대","c":0},{"k":"몽유도원도","y":"1447","s":"안평 대군이 꿈에서 본 무릉도원을 안견이 사흘 만에 그렸다.","d":"세종 때 화원 안견이 안평 대군의 꿈 이야기를 듣고 사흘 만에 그린 그림으로, 왼쪽의 현실 세계와 오른쪽의 도원을 대비시켜 배치하였다. 여러 시점을 함께 쓴 구성이 뛰어나며 조선 전기 회화의 최고 걸작으로 꼽히나 현재 일본에 있다.","u":"조선시대","c":0},{"k":"송하보월도","y":"16세기","s":"노비 출신 화원이 소나무 아래 달빛을 거니는 선비를 그렸다.","d":"노비 출신으로 그림 솜씨를 인정받아 화원이 된 이상좌의 작품으로, 굽은 소나무 아래에서 달을 보며 걷는 선비를 담았다. 강한 먹의 대비와 각진 붓질이 중국 화원 화풍의 영향을 보여 주는 조선 전기 회화이다.","u":"조선시대","c":0},{"k":"초충도","y":"16세기","s":"풀과 벌레를 섬세하게 그려 여성 화가의 예술 세계를 보여 준다.","d":"신사임당이 그린 것으로 전하는 그림들로, 수박과 오이 같은 채소 곁에 나비와 여치, 개구리를 정밀하게 배치하였다. 소박한 소재를 맑은 색으로 담아내 조선 전기 여성의 예술 활동을 보여 주는 대표작이다.","u":"조선시대","c":0},{"k":"파적도","y":"18~19세기","s":"고양이가 병아리를 물고 달아나는 순간을 익살스럽게 그렸다.","d":"조선 후기 화원 김득신의 풍속화로, 들고양이가 병아리를 채 가자 주인이 담뱃대를 들고 뛰쳐나오다 마루에서 떨어질 뻔한 순간을 담았다. 야단법석이라는 뜻의 야묘도추라고도 하며, 찰나의 움직임을 생생하게 잡아낸 솜씨가 돋보인다.","u":"조선시대","c":0},{"k":"윤두서 자화상","y":"18세기","s":"터럭 한 올까지 그려 낸 조선 후기 초상화의 걸작이다.","d":"고산 윤선도의 증손인 윤두서가 그린 자화상으로, 정면을 응시하는 얼굴만 화폭에 담고 수염 한 올까지 세밀하게 그렸다. 겉모습뿐 아니라 정신까지 담아야 한다는 전신사조의 정신을 보여 주는 조선 후기 초상화의 대표작이다.","u":"조선시대","c":0},{"k":"장승업","y":"19세기","s":"호방한 필치로 산수와 화조를 그린 조선 말기의 화가이다.","d":"고아로 자라 그림을 독학한 조선 말기의 화가로, 안견·김홍도와 함께 조선 3대 화가로 꼽힌다. 힘차고 거침없는 붓질로 산수와 인물, 꽃과 새를 두루 그렸으며 대표작으로 호취도와 삼인문년도가 있다.","u":"조선시대","c":0},{"k":"백자 달항아리","y":"18세기","s":"보름달처럼 둥근 형태에 아무 무늬가 없는 조선 후기 백자이다.","d":"위아래를 따로 만들어 붙여 빚은 큰 백자 항아리로, 둥근 모습이 보름달을 닮아 달항아리라 부른다. 무늬와 색을 절제하고 넉넉한 형태만으로 아름다움을 낸 점에서 조선 백자의 정신을 가장 잘 보여 주는 그릇으로 평가된다.","u":"조선시대","c":0},{"k":"청화 백자","y":"조선 후기","s":"푸른 코발트 안료로 무늬를 그려 구운 백자이다.","d":"흰 바탕에 코발트 안료로 무늬를 그린 뒤 유약을 발라 구운 자기로, 조선 전기에는 값비싼 수입 안료 탓에 왕실에서만 쓰였다. 후기에 이르러 국내에서 안료를 구하게 되면서 널리 퍼졌고 산수·화조·문자 무늬가 다양하게 나타났다.","u":"조선시대","c":0},{"k":"동국통감","y":"1485","s":"성종 때 고조선부터 고려까지의 역사를 정리한 편년체 통사이다.","d":"성종의 명으로 서거정 등이 1485년 완성한 역사서로, 단군 조선부터 고려 말까지를 연월일 순으로 정리한 최초의 통사이다. 삼국을 대등하게 다루고 사림의 시각을 담은 사론을 붙여 조선 전기 역사 인식을 보여 준다.","u":"조선시대","c":0},{"k":"동문선","y":"1478","s":"성종 때 삼국 시대부터 조선 초까지의 뛰어난 시와 글을 모았다.","d":"성종의 명으로 서거정 등이 1478년 엮은 시문 선집으로, 삼국 시대부터 당대까지의 시와 산문 4,300여 편을 실었다. 우리 글도 중국에 뒤지지 않는다는 자주적 문학 의식을 서문에 밝혀 조선 전기 문화 자부심을 드러냈다.","u":"조선시대","c":0},{"k":"택리지","y":"1751","s":"전국을 답사하여 각 지방의 자연과 인심, 살 만한 곳을 서술하였다.","d":"이중환이 1751년 펴낸 인문 지리서로, 사대부가 살 만한 곳의 조건을 지리·생리·인심·산수 네 가지로 제시하고 팔도의 자연과 물산, 풍속을 서술하였다. 단순한 지리 정보를 넘어 지역의 성격을 논한 점에서 조선 후기 실학적 지리학의 대표작이다.","u":"조선시대","c":0},{"k":"동사강목","y":"1778","s":"고조선부터 고려까지를 강목체로 정리하고 독자적 정통론을 세웠다.","d":"안정복이 1778년 완성한 역사서로, 큰 줄기를 강으로 세부 사실을 목으로 나누어 서술하는 강목체를 취하였다. 단군-기자-마한-통일 신라-고려로 이어지는 독자적 정통론을 내세워 중국 중심 역사관에서 벗어나려 하였다.","u":"조선시대","c":0},{"k":"연려실기술","y":"18세기","s":"조선 시대의 정치와 문화를 사건별로 객관적으로 정리하였다.","d":"이긍익이 400여 종의 야사를 모아 조선 태조부터 숙종까지의 사건을 주제별로 엮은 역사서이다. 자신의 견해를 덧붙이지 않고 자료를 그대로 실어 출처를 밝히는 기사본말체 서술을 택해, 실증적 태도를 보여 주는 조선 후기 사서로 평가된다.","u":"조선시대","c":0},{"k":"반계수록","y":"17세기","s":"토지를 국가가 나누어 주는 균전론을 주장하였다.","d":"유형원이 전북 부안에 은거하며 20여 년에 걸쳐 쓴 개혁론으로, 토지 사유를 없애고 신분에 따라 차등을 두어 나누어 주자는 균전론을 폈다. 자영농 육성을 통해 나라의 근본을 세우려 한 중농학파 실학의 출발점이 되었다.","u":"조선시대","c":0},{"k":"경세유표와 흠흠신서","y":"19세기","s":"경세유표에서 국가 제도의 개혁을, 흠흠신서에서 형벌 행정의 신중함을 논하였다.","d":"정약용이 유배지에서 지은 저술로, 경세유표는 관제와 토지·조세 등 국가 제도 전반의 개혁 방안을 담았고 흠흠신서는 살인 사건의 조사와 판결에서 지켜야 할 원칙을 정리하였다. 지방관의 자세를 다룬 목민심서와 함께 1표 2서로 불린다.","u":"조선시대","c":0},{"k":"임원경제지","y":"19세기","s":"농업과 일상생활 전반을 백과사전식으로 집대성하였다.","d":"서유구가 30여 년에 걸쳐 엮은 113권의 방대한 저술로, 농사와 원예·목축은 물론 음식과 건축, 의약과 예술까지 향촌 생활에 필요한 지식을 16개 분야로 나누어 정리하였다. 조선 후기 농업 백과사전의 결정판으로 꼽힌다.","u":"조선시대","c":0},{"k":"환구단","y":"1897","s":"고종이 황제 즉위식을 거행하고 하늘에 제사를 지낸 제단이다.","d":"1897년 고종이 황제로 즉위하며 하늘에 제사를 올리기 위해 지금의 서울 소공동에 세운 제단이다. 천자만이 하늘에 제사 지낼 수 있다는 관념을 깨고 대한 제국이 자주 독립국임을 선포한 상징이었으나, 일제가 헐고 그 자리에 호텔을 지었다.","u":"개화기","c":0},{"k":"정동 제일 교회","y":"1897","s":"아펜젤러가 세운 우리나라 최초의 서양식 개신교 예배당이다.","d":"미국 선교사 아펜젤러가 1897년 완공한 우리나라 최초의 서양식 개신교 교회 건물이다. 배재 학당·이화 학당과 이웃해 근대 교육과 문화를 퍼뜨리는 거점이 되었고, 뒷날 3·1 운동과 독립운동가들의 모임 장소로도 쓰였다.","u":"개화기","c":0},{"k":"구 러시아 공사관","y":"1890","s":"아관 파천 때 고종이 1년간 머물렀던 곳이다.","d":"1890년 정동에 세워진 러시아 공사관으로, 을미사변 뒤 신변에 위협을 느낀 고종이 1896년 이곳으로 거처를 옮겨 1년 남짓 머물렀다. 이 기간에 열강의 이권 침탈이 심해졌으며, 6·25 전쟁으로 대부분 파괴되고 탑 부분만 남았다.","u":"개화기","c":0},{"k":"종두법","y":"1879","s":"지석영이 천연두를 예방하는 종두법을 보급하였다.","d":"지석영은 1879년 부산 제생의원에서 종두법을 배우고 처가가 있는 충주에서 처음 시술한 뒤, 일본에서 백신 제조법을 익혀 전국에 보급하였다. 천연두로 인한 아동 사망을 크게 줄였으며, 그는 국문 연구소 위원으로 한글 연구에도 힘썼다.","u":"개화기","c":0},{"k":"익산 미륵사지 석탑","y":"639","s":"목탑 양식을 본떠 돌로 쌓은 현존 최고(最古)의 석탑이다.","d":"백제 무왕이 익산에 세운 미륵사의 서쪽 탑으로, 기둥과 지붕돌을 목탑처럼 짜 맞춰 돌로 쌓은 우리나라에서 가장 오래된 석탑이다. 2009년 해체 수리 중 사리봉영기가 나와 639년에 사택 왕후가 세웠음이 밝혀졌다.","u":"삼국시대","c":0},{"k":"임신서기석","y":"6세기","s":"두 청년이 유교 경전을 익히고 나라에 충성할 것을 맹세하며 새겼다.","d":"임신년에 신라의 두 청년이 3년 안에 시경·상서·예기·춘추를 익히고 나라가 어지러우면 충성을 다하겠다고 맹세한 내용을 돌에 새긴 것이다. 신라 청년들이 유교 경전을 공부하였음을 보여 주며, 한자를 우리말 순서로 늘어놓은 점도 특징이다.","u":"삼국시대","c":0},{"k":"불국사 삼층 석탑","y":"8세기","s":"무구정광대다라니경이 발견된 통일 신라의 전형적인 삼층 석탑이다.","d":"석가탑이라고도 하며, 이중 기단 위에 3층 몸돌을 올린 통일 신라 석탑의 전형을 보여 준다. 군더더기 없는 비례로 조화의 아름다움을 이루었고, 1966년 해체 수리 중 2층 몸돌에서 현존 최고(最古)의 목판 인쇄물인 무구정광대다라니경이 나왔다.","u":"삼국시대","c":0},{"k":"성덕 대왕 신종","y":"771","s":"에밀레종이라 불리며 비천상이 새겨진 통일 신라의 종이다.","d":"경덕왕이 아버지 성덕왕을 기리려 만들기 시작해 혜공왕 때인 771년 완성한 종으로, 에밀레종이라고도 한다. 몸통에 무릎 꿇고 향로를 받든 비천상을 새겼으며 웅장하고 긴 여운의 소리로 이름이 높다.","u":"삼국시대","c":0},{"k":"여주 고달사지 승탑","y":"10세기","s":"팔각 원당형을 따른 고려 초의 대표적인 승탑이다.","d":"경기도 여주 고달사 터에 남은 고려 초 승탑으로, 신라 말 이래의 팔각 원당형을 이어받았다. 가운데 돌에 거북과 네 마리 용을 힘차게 새겨 고려 초 석조 미술의 웅장한 기풍을 보여 준다.","u":"고려시대","c":0},{"k":"원주 법천사지 지광국사탑","y":"1085","s":"평면이 네모난 독특한 형태에 화려한 조각을 새긴 승탑이다.","d":"고려 문종 때 국사를 지낸 지광국사 해린을 기리는 승탑으로, 팔각이 아닌 네모 평면에 휘장과 꽃, 봉황을 빼곡히 새겨 화려하기 그지없다. 일제 강점기에 일본으로 반출되었다가 돌아왔으며 최근 복원을 마쳤다.","u":"고려시대","c":0},{"k":"송악명당기","y":"9세기","s":"풍수지리 사상이 반영된 송악명당기를 저술하였다.","d":"도선은 신라 말에 활동한 선종 승려로, 당에서 들여온 풍수지리설을 널리 보급하였다. 그가 지은 것으로 전해지는 송악명당기와 도선비기는 땅의 형세를 인간의 길흉화복과 연결하였다. 풍수지리 사상은 경주 중심의 사고에서 벗어나 지방의 중요성을 강조하여 호족의 사상적 기반이 되었다.","u":"삼국시대","c":1},{"k":"천남생과 천남건","y":"668년","s":"천남산은 사재소경으로, 승려 신성은 은청광록대부로, 천남생은 우위대장군으로 삼았다. …… 천남건은 검주(黔州)로 유배를 보냈다.","d":"연개소문이 죽은 뒤 대막리지를 이어받은 장남 천남생(연남생)은 동생 남건·남산과 권력 다툼 끝에 밀려나 당에 투항하였다. 668년 평양성이 함락되자 남산과 승려 신성은 당에 항복하여 관직을 받았고, 끝까지 항전한 남건은 검주로 유배되었다. 지배층의 내분은 고구려 멸망을 앞당겼다.","u":"삼국시대","c":1},{"k":"매소성 전투","y":"675년","s":"매소성 전투에서 당의 군대를 격파하였다.","d":"당이 웅진도독부와 안동도호부를 두고 한반도 전체를 지배하려 하자 신라는 고구려 부흥 운동을 지원하며 나당 전쟁에 나섰다. 675년 신라군은 매소성에서 이근행이 이끈 당군을 격파하였고, 이듬해 기벌포에서 당 수군까지 물리쳐 삼국 통일을 완성하였다.","u":"삼국시대","c":1},{"k":"박서와 귀주성 전투","y":"1231년","s":"박서는 김중온의 군사로 성의 동서쪽을, 김경손의 군사로는 성의 남쪽을, 별초 250여 인은 나누어 3면을 지키게 하였다. (가)의 군사들이 성을 여러 겹으로 포위하고 공격하자 성안의 군사들이 갑자기 나가 싸워 그들을 패주시켰다.","d":"1231년 살리타가 이끄는 몽골군이 1차 침입하자 서북면 병마사 박서와 분도장군 김경손이 귀주성에서 맞섰다. 성을 여러 겹으로 포위한 몽골군의 거듭된 공격을 한 달 넘게 막아내며 여러 차례 격퇴하였고, 고려의 강한 항전 의지를 보여 준 대표적 전투로 꼽힌다.","u":"고려시대","c":1},{"k":"역옹패설","y":"1342년","s":"최근에 역옹패설을 저술하셨는데 독자들이 관심 가질 만한 내용을 소개해 주세요.","d":"이제현이 1342년 관직에서 물러나 있을 때 지은 시화·수필집이다. 전집에는 역사적 인물의 일화와 골계적인 이야기를, 후집에는 시문 비평을 담아 고려 후기의 문학과 사회상을 전한다. 이제현은 원의 만권당에서 성리학을 익힌 학자로 사략도 저술하였다.","u":"고려시대","c":1},{"k":"하회마을과 하회별신굿탈놀이","y":"고려 중기","s":"하회마을에서 하회별신굿탈놀이 관람하기","d":"경북 안동의 풍산 류씨 동성 마을로, 낙동강이 마을을 감싸 돌아 하회라 불린다. 고려 중기부터 전승된 것으로 전해지는 하회별신굿탈놀이는 양반과 승려를 풍자한 탈춤으로 국가무형유산이며, 마을은 2010년 유네스코 세계유산에 등재되었다.","u":"고려시대","c":1},{"k":"대위국","y":"1135년","s":"묘청이 반란을 일으키고 국호를 대위라 하였다.","d":"인종 때 묘청 등 서경 세력은 풍수지리설을 내세워 서경 천도와 금 정벌, 칭제건원을 주장하였다. 1135년 서경에서 국호를 대위, 연호를 천개라 하고 군대를 천견충의군이라 부르며 난을 일으켰으나, 김부식이 이끈 관군에게 약 1년 만에 진압되었다.","u":"고려시대","c":1},{"k":"무악 천도 논의","y":"1394년","s":"임금이 무악에 이르러서 도읍을 정할 땅을 물색하였다. 좌시중 조준, 우시중 김사형에게 말하였다. …… 근래에는 계룡이 도읍할 만한 곳이라 하기에 백성을 공사에 동원하여 힘들게 하였다. …… 그대들은 도읍할 만한 곳을 서운관 관리에게 다시 보고받도록 하라.","d":"태조는 즉위 직후 개경을 떠날 새 도읍을 찾아 계룡산에 신도 공사를 벌였다가 중단하고, 1394년 무악 일대를 후보지로 삼아 조준·김사형 등과 함께 직접 답사하였다. 그러나 지세가 좁다는 반대에 부딪혀 결국 한양이 도읍으로 확정되었다.","u":"조선시대","c":1},{"k":"이언적","y":"1545년","s":"이곳은 이언적의 위패를 모신 경주 옥산서원입니다. 이언적은 이른바 대윤과 소윤이라는 정치 세력 간의 갈등으로 윤임 등 대윤 세력이 탄압받은 이 사건 당시 관련자들의 처리를 두고 갈등이 생기자 스스로 관직에서 물러났습니다.","d":"이언적은 주리론의 선구자로 평가받는 16세기 성리학자이다. 명종 즉위 후 윤임의 대윤과 윤원형의 소윤이 충돌한 을사사화(1545) 때 관련자 처리를 두고 갈등이 생기자 스스로 관직에서 물러났고, 뒤에 유배되어 생을 마쳤으며 경주 옥산서원에 배향되었다.","u":"조선시대","c":1},{"k":"소현 세자","y":"1637년","s":"정명수가 심양에 있는 소현 세자의 관소에 와서 용골대의 뜻을 전하기를, 세자가 이곳에 들어온 지가 이미 5년이 되었으니, 어찌 스스로 먹고살 길을 마련하지 않는가.","d":"병자호란에서 패한 뒤 1637년 소현 세자는 동생 봉림 대군과 함께 청의 심양에 볼모로 끌려가 8년간 머물렀다. 그곳에서 아담 샬 등과 교류하며 서양 문물을 접하고 1645년 귀국하였으나 두 달 만에 죽었고, 이후 봉림 대군이 세자로 책봉되었다.","u":"조선시대","c":1},{"k":"오가작통법","y":"1485년","s":"오가작통법의 실시 목적을 파악한다.","d":"오가작통법은 다섯 집을 한 통으로 묶어 서로 감시하고 연대 책임을 지우게 한 향촌 통제 제도로, 성종 때 경국대전에 규정되고 숙종 대 오가통사목으로 강화되었다. 호적 정비와 유민·도적 단속이 목적이었으며, 조선 후기에는 천주교도 색출에도 이용되었다.","u":"조선시대","c":1},{"k":"시헌력","y":"1653년","s":"청으로부터 시헌력을 도입하자고 건의하였다.","d":"시헌력은 서양 천문학을 반영하여 아담 샬 등이 만든 청의 역법이다. 김육이 효종에게 도입을 건의하여 1653년부터 시행되었으며, 기존의 대통력을 대신해 조선 말까지 쓰이면서 서양 문물 수용의 대표 사례가 되었다.","u":"조선시대","c":1},{"k":"종묘 제례악","y":"15세기","s":"종묘에서 행하는 제향 의식이다.","d":"종묘 제례악은 역대 왕과 왕비의 신주를 모신 종묘의 제향 의식에서 연주된 음악이다. 세종이 지은 보태평과 정대업을 세조 때 제례악으로 채택한 것으로, 기악과 노래·일무가 어우러지며 2001년 유네스코 인류 무형 문화유산에 등재되었다.","u":"조선시대","c":1},{"k":"영산재","y":"조선시대","s":"부처의 영취산 설법 모습을 재현하였다.","d":"영산재는 석가모니가 영취산에서 법화경을 설법하던 장면을 재현한 불교 의식으로, 죽은 이의 극락왕생을 기원하는 49재의 한 형태이다. 조선시대에 널리 행해졌으며, 2009년 유네스코 인류 무형 문화유산으로 등재되었다.","u":"조선시대","c":1},{"k":"처용무","y":"조선 성종","s":"궁중 무용 중 유일하게 사람 형상의 가면을 쓰고 추는 춤으로 5명이 중앙과 동서남북을 상징하는 5가지 색깔의 옷을 입고 춤을 춥니다. 가면의 팥죽색은 악귀를 물리치는 벽사의 의미를 담고 있습니다.","d":"처용무는 신라 헌강왕 때의 처용 설화에서 비롯된 춤으로, 조선 세종 때 다섯 사람이 오방색 옷을 입고 추는 형태로 정비되어 성종 대 악학궤범에 기록되었다. 궁중 무용 가운데 유일하게 사람 형상의 가면을 쓰며 악귀를 쫓는 벽사의 뜻을 담고 있다.","u":"조선시대","c":1},{"k":"만인의총","y":"1597년","s":"만인의총을 조사하여 정유재란 당시 우리 고장의 백성들이 조명 연합군과 함께 결사 항전했음을 알 수 있었습니다.","d":"만인의총은 1597년 정유재란 때 남원성 전투에서 왜군에 맞서 싸우다 순절한 조명 연합군과 백성 1만여 명을 함께 모신 무덤이다. 전라북도 남원에 있으며, 정유재란 초기의 격전과 민관의 결사 항전을 보여 주는 유적이다.","u":"조선시대","c":1},{"k":"조영 수호 통상 조약","y":"1883년","s":"통상 지역에서 조선 이법 100리 이내, 혹은 장래 양국 관원이 서로 의논하여 정하는 경계 안에서 영국 인민은 여행증명서 없이 마음대로 돌아다닐 수 있다. 여행증명서를 지닌 영국 인민은 조선 각지를 돌아다니며 통상하거나, 각종 화물을 들여와 팔거나, 일체 토산물을 구매할 수 있다.","d":"조미 수호 통상 조약 이후 서양 각국과의 수교가 이어지는 가운데 영국과 맺은 조약으로, 1882년의 초안이 영국의 비준 거부로 무산된 뒤 1883년에 다시 체결되었다. 최혜국 대우를 규정하고 여행증명서를 지닌 영국인의 내지 통상을 허용하였으며 관세율도 낮추었다. 이후 다른 서양 국가와의 조약에 기준이 되었다.","u":"개화기","c":1},{"k":"당오전","y":"1883년","s":"당오전이 발행된 배경을 파악한다.","d":"임오군란 배상금과 각종 개화 사업 추진으로 재정이 궁핍해지자 1883년 묄렌도르프의 건의에 따라 주조된 화폐이다. 상평통보의 다섯 배에 해당하는 명목 가치를 지녔으나 실질 가치가 이에 미치지 못해 극심한 물가 상승을 불러왔다. 김옥균은 발행에 반대하며 일본에서 차관을 도입하자고 주장하였다.","u":"개화기","c":1},{"k":"개정 전시과","y":"998년","s":"12월에 문무 양반 및 군인들의 전시과를 개정하였다. 제1과는 전지 100결, 시지 70결을 지급한다. …… 제18과는 전지 20결을 지급한다. 이 한(限)에 들지 못한 자에게는 모두 전지 17결을 주기로 하고 이것을 통상의 법식으로 한다.","d":"목종 1년(998) 12월 인품을 배제하고 관직만을 기준으로 18과로 나누어 정비한 개정 전시과이다. 제1과는 전지 100결과 시지 70결, 제18과는 전지 20결을 주었고 등급에 들지 못한 자에게는 한외과로 전지 17결을 지급하였다. 한외과는 문종 30년(1076) 경정 전시과에서 폐지되었다.","u":"고려시대","c":1},{"k":"조일 수호 조규 부록","y":"1876년","s":"부산항에서 일본국 인민이 통행할 수 있는 도로 이정(里程)은 부두로부터 기산하여 조선 이법(里法)으로 동서남북 직경 10리로 정한다. 일본국 인민은 마음대로 통행하며 조선 토산물과 일본국 물품을 사고팔 수 있다.","d":"1876년 강화도 조약의 세부 사항을 정하기 위해 체결된 후속 조약이다. 개항장에서 일본인이 활동할 수 있는 범위를 사방 10리로 정한 간행이정을 설정하고, 개항장 내 일본 화폐의 유통을 허용하였다. 같은 시기 맺어진 조일 무역 규칙과 함께 일본의 경제적 침투를 뒷받침하였다.","u":"개화기","c":1}];

const STAT  = {"items":1101,"linked":685,"deeds":213,"events":545,"kings":104,"withany":98};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { dyn:'all', q:'', open:new Set(), full:new Set() };

document.getElementById('ne').textContent = STAT.events;

).join('');

  state.dyn = b.dataset.d; render();
});

  state.q = e.target.value.trim();
  if (state.q){ const v = visible(); if (v.length && v.length <= 4) v.forEach(K => state.open.add(K.st+'|'+K.n)); }
  render();
});

  const vis = visible();
  if (state.open.size >= vis.length) state.open.clear();
  else vis.forEach((K,i) => state.open.add(K.st+'|'+K.n));
  render();
});

function nameHit(K, q){ return (K.st+' '+K.n).toLowerCase().includes(q); }
function itemHit(K, q){
  return [...K.D, ...K.E].some(i => {
    const it = ITEMS[i];
    return (it.k+' '+it.s+' '+it.d).toLowerCase().includes(q);
  });
}
// '세종'을 치면 설명에 세종이 언급된 다른 왕까지 딸려 나오지 않도록,
// 왕 이름이 걸리면 이름 일치만 보여 주고 아니면 업적 내용으로 넓힌다.
function visible(){
  let ks = KINGS.filter(K => state.dyn === 'all' || K.st === state.dyn);
  if (!state.q) return ks;
  const q = state.q.toLowerCase();
  const byName = ks.filter(K => nameHit(K, q));
  return byName.length ? byName : ks.filter(K => itemHit(K, q));
}

function itemHTML(i){
  const it = ITEMS[i];
  return `<div class="item">
    <div><span class="ik">${esc(it.k)}</span><span class="iy">${esc(it.y)}</span>${it.c?`<span class="ic">출제 ${it.c}회</span>`:''}</div>
    <div class="is">${esc(it.s)}</div>
    <div class="id">${esc(it.d)}</div>
  </div>`;
}
function sectionHTML(ids, icon, label, key, note){
  if (!ids.length) return `<div class="sec"><div class="sech"><i>${icon}</i> ${label} <em>없음</em></div></div>`;
  const LIM = 8;
  const showAll = state.full.has(key) || ids.length <= LIM;
  const shown = showAll ? ids : ids.slice(0, LIM);
  return `<div class="sec">
    <div class="sech"><i>${icon}</i> ${label} <em>${ids.length}건${note||''}</em></div>
    ${shown.map(itemHTML).join('')}
    ${showAll ? '' : `<div class="more" data-full="${key}">+ ${ids.length-LIM}건 더 보기</div>`}
  </div>`;
}

function render(){
  const vis = visible();
  const maxLen = Math.max(...KINGS.map(K => K.b-K.a), 1);
  let html = '', lastDyn = null;
  for (const K of vis){
    if (K.st !== lastDyn){
      lastDyn = K.st;
      const n = vis.filter(x => x.st === K.st).length;
      html += `<div class="dyn">${ICON[K.st]} ${K.st} <span class="n">${n}명</span></div>`;
    }
    const id = K.st+'|'+K.n;
    const open = state.open.has(id);
    const empty = !K.D.length && !K.E.length;
    const w = Math.max(4, Math.round((K.b-K.a)/maxLen*100));
    html += `<div class="king${open?' open':''}${empty?' empty':''}" data-id="${esc(id)}">
      <div class="khead">
        <div class="kseq">${K.i}</div>
        <div class="kmain">
          <span class="kname">${esc(K.n)}</span><span class="kreign">${K.a}~${K.b} · ${K.b-K.a}년</span>
          <div class="kbar" style="width:${w}%"></div>
        </div>
        <div class="ktags">
          ${K.D.length?`<span class="tag d">⭐ ${K.D.length}</span>`:''}
          ${K.E.length?`<span class="tag e">📅 ${K.E.length}</span>`:''}
          ${empty?`<span class="tag z">기출 없음</span>`:''}
        </div>
        <div class="caret">▶</div>
      </div>
      <div class="kbody">
        ${sectionHTML(K.D, '⭐', '이 왕이 한 일', id+'|D')}
        ${sectionHTML(K.E, '📅', '재위 중 있었던 일', id+'|E')}
      </div>
    </div>`;
  }
  $('#list').innerHTML = html || '<div class="none">조건에 맞는 왕이 없습니다.</div>';
  const nd = vis.reduce((s,K)=>s+K.D.length,0), ne = vis.reduce((s,K)=>s+K.E.length,0);
  $('#count').innerHTML = `왕 <b>${vis.length}</b>명 · ⭐ 업적 <b>${nd}</b>건 · 📅 재위기 <b>${ne}</b>건`;
}

$('#list').addEventListener('click', e => {
  const m = e.target.closest('[data-full]');
  if (m){ state.full.add(m.dataset.full); render(); return; }
  const h = e.target.closest('.khead'); if(!h) return;
  const id = h.parentElement.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  render();
});

render();
</script>

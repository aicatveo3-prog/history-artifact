<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕별 정리 · 한국사</title>
<style>
  :root{
    --bg:#E9E3D4; --card:#FCFAF5; --ink:#2A2622; --green:#4C7A6B; --green-d:#3a5f53;
    --muted:#8a7f68; --line:#d9cfb8; --chip:#F3EEE0; --gold:#B08A45;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--green);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:14px}
  .ttl{font-family:'Noto Serif KR',serif;font-weight:700;font-size:23px;letter-spacing:-.01em;margin:0}
  .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .navrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--card);
    border:1px solid #E0D8C4;border-radius:999px;font-size:13px;font-weight:700;color:#5f5748;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .back:hover{background:var(--chip)}

  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:14px 0 10px}
  .search{flex:1;min-width:190px;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid #E0D8C4;border-radius:11px;padding:9px 13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .search input{border:none;outline:none;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 16px}
  .chip{padding:8px 14px;background:var(--card);border:1px solid #E0D8C4;border-radius:999px;
    font-size:13px;font-weight:700;color:#5f5748;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .chip:hover{background:var(--chip)}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .count{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
  .count b{color:var(--green-d)}

  .dyn{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--green-d);
    margin:26px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line);display:flex;
    align-items:center;gap:8px}
  .dyn span.n{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted)}

  .king{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;
    box-shadow:0 2px 8px rgba(74,63,40,.05);overflow:hidden}
  .king.empty{opacity:.5}
  .khead{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none}
  .khead:hover{background:#F8F4EA}
  .kseq{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .king.open .kseq{background:var(--green);color:#fff}
  .kname{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
  .kreign{font-size:12px;color:var(--muted);margin-left:7px;font-weight:600}
  .kmain{flex:1;min-width:0}
  .kbar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold),#d9c08a);margin-top:6px}
  .ktags{flex-shrink:0;display:flex;gap:5px;align-items:center}
  .tag{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:7px;white-space:nowrap}
  .tag.d{background:#EDF3F0;color:var(--green-d)}
  .tag.e{background:#F5EFE1;color:#8a7340}
  .tag.z{background:#F0ECE2;color:#b0a488}
  .caret{flex-shrink:0;color:#c3b8a0;font-size:13px;transition:transform .15s}
  .king.open .caret{transform:rotate(90deg)}

  .kbody{display:none;padding:2px 15px 15px;border-top:1px dashed var(--line)}
  .king.open .kbody{display:block}
  .sec{margin-top:13px}
  .sech{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px;display:flex;
    align-items:center;gap:6px}
  .sech i{font-style:normal}
  .sech em{font-style:normal;font-weight:700;color:#b6ab93;font-size:11.5px}
  .item{padding:9px 0;border-bottom:1px solid #F0EADC}
  .item:last-child{border-bottom:none}
  .ik{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .iy{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:7px}
  .ic{font-size:11px;color:#b6ab93;font-weight:700;margin-left:5px}
  .is{font-size:13px;font-weight:700;color:#4a443a;margin-top:4px;line-height:1.5}
  .id{font-size:12.5px;color:#6f6858;margin-top:4px;line-height:1.65}
  .more{margin-top:9px;font-size:12.5px;font-weight:800;color:var(--green);cursor:pointer}
  .none{font-size:12.5px;color:#b6ab93;padding:6px 0}

  .foot{margin-top:34px;font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}

  @media (max-width:560px){
    .wrap{padding:16px 11px 50px}
    .ttl{font-size:20px}
    .khead{gap:9px;padding:12px 12px}
    .kname{font-size:15.5px}
    .kreign{display:block;margin-left:0;margin-top:2px}
    .kbody{padding:2px 12px 14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="ttl">👑 왕별 정리</h1>
      <div class="sub">왕 <b id="nk">0</b>명 · <b id="nd">0</b>건은 <b>그 왕이 한 일</b> · <b id="ne">0</b>건은 <b>재위 중 있었던 일</b><br>
        한능검의 두 문제 유형 — “밑줄 그은 ‘이 왕’에 대한 설명” / “(가) 왕의 재위 시기에 있었던 사실” — 에 맞춰 나눴습니다.</div>
    </div>
  </header>

  <div class="navrow">
    <a class="back" href="index.html">← 유물 학습으로</a>
    <a class="back" href="frequency.html">📊 빈출 선택지 표</a>
  </div>

  <div class="toolbar">
    <label class="search">🔎 <input id="q" type="search" placeholder="왕 이름·업적 검색…" autocomplete="off"></label>
    <button class="chip" id="expandAll" type="button">전부 펼치기</button>
  </div>

  <div class="chips" id="dynChips"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="foot">
    ⭐ 업적은 항목의 주어가 그 왕인 것, 📅 재위 중 있었던 일은 연대가 재위 기간에 드는 나머지 항목을 자동으로 연결한 것입니다.<br>
    삼국 시대는 세 나라가 함께 있었으므로 재위기 항목을 같은 나라 것으로만 걸렀습니다. 연대가 대략값인 문화유산은 재위 구분이 어긋날 수 있습니다.
  </div>
</div>

<script>
const ITEMS = [{"k":"안승","y":"674","s":"안승을 보덕왕으로 봉하였다.","d":"문무왕은 고구려 부흥 운동 세력의 지도자 안승을 보덕왕으로 봉하여 당에 대항하는 세력을 포섭하였다.","u":"삼국시대","c":19},{"k":"녹읍","y":"689","s":"관료전을 지급하고 녹읍을 폐지하였다.","d":"신문왕은 귀족의 경제 기반인 녹읍을 폐지하고 관료전을 지급하여 왕권을 강화하였다.","u":"삼국시대","c":14},{"k":"솔빈부","y":"발해","s":"솔빈부의 말이 특산품으로 수출되었다.","d":"발해의 솔빈부는 말 생산으로 유명하였으며, 주변국과의 교역에서 주요 수출품으로 활용되었다.","u":"삼국시대","c":14},{"k":"미륵사","y":"639","s":"금마저에 미륵사를 창건하였다.","d":"백제 무왕은 익산 금마저에 미륵사를 창건하였으며, 미륵사지 석탑은 현존하는 가장 오래된 석탑이다.","u":"삼국시대","c":13},{"k":"대야성","y":"642","s":"윤충이 군사를 이끌고 대야성을 함락시켰다.","d":"642년 백제 의자왕이 보낸 장군 윤충이 신라의 대야성을 함락하고, 성주 김품석 부부를 살해하였다.","u":"삼국시대","c":13},{"k":"청해진","y":"828","s":"청해진을 설치하여 해상 무역을 전개하였다.","d":"흥덕왕 때 장보고는 완도에 청해진을 설치하고 해적을 소탕하며 동아시아 해상 무역권을 장악하였다.","u":"삼국시대","c":13},{"k":"황룡사","y":"645","s":"자장의 건의로 황룡사 구층 목탑이 건립되었다.","d":"선덕여왕 때 승려 자장의 건의로 황룡사 구층 목탑이 세워졌으며, 주변 9개 나라의 침략을 막기 위한 호국 목적이었다.","u":"삼국시대","c":13},{"k":"22담로","y":"무령왕","s":"지방의 22담로에 왕족을 파견하였다.","d":"백제 무령왕은 지방의 요충지 22곳에 담로를 설치하고 왕족을 파견하여 지방 통제력을 강화하였다.","u":"삼국시대","c":12},{"k":"골품제","y":"신라","s":"골품제가 실시되었다.","d":"신라의 골품제는 혈통에 따라 사회적 신분을 구분한 제도로, 골품에 따라 관직·일상생활까지 엄격히 규제하였다.","u":"삼국시대","c":12},{"k":"독서삼품과","y":"788","s":"독서삼품과를 시행하였다.","d":"원성왕은 유교 경전의 이해 수준에 따라 관리를 3등급으로 나누어 채용하는 독서삼품과를 시행하였다.","u":"삼국시대","c":12},{"k":"이사부","y":"512","s":"이사부가 우산국을 복속시켰다.","d":"지증왕 13년(512) 이사부는 나무 사자를 이용한 기략으로 우산국(울릉도)을 복속하여 신라 영토로 편입하였다.","u":"삼국시대","c":12},{"k":"김흠돌","y":"681","s":"김흠돌의 난이 진압되었다.","d":"신문왕은 즉위 직후 장인 김흠돌의 반란을 진압하고, 이를 계기로 귀족 세력을 숙청하며 전제 왕권을 확립하였다.","u":"삼국시대","c":12},{"k":"영락","y":"391","s":"영락이라는 독자적인 연호를 사용하였다.","d":"법흥왕은 '건원'이라는 독자 연호를 사용하였고, 광개토대왕은 '영락'을 사용하여 각각 자주 국가임을 표방하였다.","u":"삼국시대","c":12},{"k":"진대법","y":"194","s":"진대법이 시행되었다.","d":"고구려 고국천왕은 재상 을파소의 건의로 봄에 곡식을 빌려주고 가을에 갚는 진대법을 시행하여 빈민을 구제하였다.","u":"삼국시대","c":11},{"k":"정사암","y":"백제","s":"국가 중대사를 정사암에서 논의하였다.","d":"백제는 귀족 대표들이 정사암에 모여 재상을 선출하고 국가 중대사를 합의로 결정하는 귀족 회의 전통을 가졌다.","u":"삼국시대","c":10},{"k":"9서당","y":"687","s":"군사 조직으로 9서당 10정을 편성하였다.","d":"통일신라는 중앙군인 9서당에 고구려·백제·말갈인을 포함시키고, 지방군인 10정을 전국 요충지에 배치하였다.","u":"삼국시대","c":10},{"k":"평양성","y":"371","s":"백제가 평양성을 공격하여 고구려 왕이 전사하였다.","d":"백제 근초고왕은 371년 직접 군대를 이끌고 고구려 평양성을 공격하여 고국원왕을 전사시키는 대승을 거두었다.","u":"삼국시대","c":10},{"k":"왕오천축국전","y":"727","s":"구법 순례기인 왕오천축국전을 남겼다.","d":"통일신라의 승려 혜초는 인도와 중앙아시아를 순례하고 그 견문을 기록한 왕오천축국전을 저술하였다.","u":"삼국시대","c":10},{"k":"주자감","y":"발해","s":"주자감을 설치하여 인재를 양성하였다.","d":"발해는 당의 국자감을 본받아 주자감을 설치하고 귀족 자제들에게 유교 경전을 교육하여 관리를 양성하였다.","u":"삼국시대","c":9},{"k":"부여씨","y":"백제","s":"왕족인 부여씨와 8성 귀족이 지배층을 이루었다.","d":"백제는 왕족인 부여씨와 진씨·해씨 등 8개 성씨의 귀족이 정치·군사·경제의 핵심 지배층을 형성하였다.","u":"삼국시대","c":9},{"k":"원종","y":"889","s":"원종과 애노가 사벌주에서 반란을 일으켰다.","d":"889년(진성여왕 3) 원종과 애노가 사벌주(상주)에서 농민 반란을 일으키며 신라 말기 혼란의 서막을 열었다.","u":"삼국시대","c":9},{"k":"국사","y":"545","s":"거칠부에게 명하여 국사를 편찬하였다.","d":"신라 진흥왕은 대아찬 거칠부에게 명하여 역사서 국사를 편찬하게 함으로써 왕실 권위를 높이고 국가 체제를 정비하였다.","u":"삼국시대","c":9},{"k":"낙랑","y":"313","s":"낙랑군을 몰아내고 영토를 확장하였다.","d":"고구려 미천왕은 313년 낙랑군을, 314년 대방군을 차례로 축출하여 한반도에서 중국 세력을 완전히 몰아냈다.","u":"삼국시대","c":9},{"k":"마라난타","y":"384","s":"동진에서 온 마라난타를 통해 불교를 수용하였다.","d":"백제 침류왕은 384년 동진에서 온 승려 마라난타를 통해 공식적으로 불교를 수용하고 이듬해 절을 창건하였다.","u":"삼국시대","c":8},{"k":"기벌포","y":"676","s":"사찬 시득이 기벌포에서 당군을 격파하였다.","d":"676년 신라 사찬 시득이 기벌포(금강 하구)에서 당 수군을 격파함으로써 신라의 삼국 통일이 최종 완성되었다.","u":"삼국시대","c":8},{"k":"부경","y":"고구려","s":"집집마다 부경이라는 창고가 있었다.","d":"고구려에는 집집마다 부경이라 불리는 작은 창고가 있어 각 가정이 자체적으로 식량과 물자를 저장하였다.","u":"삼국시대","c":8},{"k":"세속5계","y":"600","s":"세속 5계를 제시하였다.","d":"신라의 승려 원광은 화랑에게 사군이충·사친이효·교우이신·임전무퇴·살생유택의 세속 5계를 제시하였다.","u":"삼국시대","c":8},{"k":"왜격퇴","y":"400","s":"군대를 보내 신라에 침입한 왜를 격퇴하였다.","d":"광개토대왕은 400년 신라의 요청으로 5만 군대를 보내 신라에 침입한 왜를 격퇴하였으며, 이는 광개토대왕릉비에 기록되었다.","u":"삼국시대","c":8},{"k":"이차돈","y":"527","s":"이차돈의 순교를 계기로 불교가 공인되었다.","d":"신라 법흥왕은 527년 이차돈의 순교를 계기로 귀족 세력의 반발을 누르고 불교를 공식적으로 공인하였다.","u":"삼국시대","c":8},{"k":"청방인문표","y":"강수","s":"외교 문서인 청방인문표를 작성하였다.","d":"통일신라의 문장가 강수는 당에 억류된 김인문의 석방을 요구하는 외교 문서 청방인문표를 작성하여 명성을 떨쳤다.","u":"삼국시대","c":8},{"k":"시장","y":"신라","s":"시장을 감독하는 관청인 동시전이 설치되었다.","d":"신라는 수도 경주에 동시·서시·남시 등의 시장을 두고 이를 감독하는 관청인 동시전을 설치하여 상업 활동을 관리하였다.","u":"삼국시대","c":8},{"k":"황산벌","y":"660","s":"계백이 이끈 결사대가 황산벌에서 항전하였다.","d":"660년 백제의 계백 장군은 5천 결사대를 이끌고 황산벌에서 신라군에 맞서 싸웠으나 패배하였고, 이후 백제가 멸망하였다.","u":"삼국시대","c":8},{"k":"화백회의","y":"신라","s":"화백 회의를 통해 의사 결정하였다.","d":"신라의 화백 회의는 진골 귀족 대표들이 만장일치로 국가 중대사를 결정하는 귀족 합의 기구였다.","u":"삼국시대","c":7},{"k":"남부여","y":"538","s":"국호를 남부여라 칭하였다.","d":"백제 성왕은 538년 사비(부여)로 천도하고 국호를 남부여로 바꾸어 부여 계승 의식을 강조하였다.","u":"삼국시대","c":7},{"k":"태학","y":"372","s":"태학과 경당을 두어 인재를 양성하였다.","d":"고구려 소수림왕은 372년 태학을 세워 귀족 자제를 교육하고, 지방에는 경당을 두어 평민 자제들도 교육받게 하였다.","u":"삼국시대","c":7},{"k":"서기","y":"375","s":"고흥에게 서기를 편찬하게 하였다.","d":"백제 근초고왕은 학자 고흥에게 명하여 국가의 역사를 기록한 서기를 편찬하게 하였으나, 현재는 전해지지 않는다.","u":"삼국시대","c":6},{"k":"김춘추","y":"648","s":"김춘추가 당으로 건너가 군사 동맹을 체결하였다.","d":"648년 신라의 김춘추는 당 태종을 직접 만나 군사 동맹을 체결하여 나당 연합의 토대를 마련하였다.","u":"삼국시대","c":6},{"k":"당항성","y":"신라","s":"당항성·영암이 국제 무역항으로 번성하였다.","d":"신라의 당항성(경기 화성)은 대당 교역의 핵심 거점 항구로 기능하였으며, 영암은 서남해안의 국제 무역항으로 번성하였다.","u":"삼국시대","c":6},{"k":"관산성","y":"554","s":"가야와 함께 관산성을 공격하였다.","d":"554년 백제 성왕은 가야와 연합하여 신라의 관산성을 공격하였으나 김무력의 군대에 기습당해 전사하였다.","u":"삼국시대","c":6},{"k":"화랑도","y":"576","s":"화랑도를 국가적인 조직으로 개편하였다.","d":"신라 진흥왕은 원래 있던 청소년 수련 조직 화랑도를 국가적인 인재 양성 조직으로 개편하였다. 우두머리인 화랑은 풍월주 또는 국선이라 불렸고 그 아래 귀족과 평민 출신 낭도가 따랐으며, 원광의 세속 5계를 규범으로 삼아 삼국 통일의 인재를 길러 냈다.","u":"삼국시대","c":7},{"k":"6좌평","y":"백제","s":"내신좌평 등 6좌평의 관제를 정비하였다.","d":"백제는 내신좌평·내두좌평·내법좌평·위사좌평·조정좌평·병관좌평의 6좌평 체제로 중앙 행정을 분담 운영하였다.","u":"삼국시대","c":6},{"k":"장문휴","y":"732","s":"장문휴를 보내 당의 산둥반도를 공격하였다.","d":"발해 무왕은 732년 수군 장수 장문휴를 보내 당의 등주(산둥반도)를 선제 공격하여 당과의 군사 긴장을 고조시켰다.","u":"삼국시대","c":6},{"k":"벽란도","y":"고려","s":"예성강 하구의 벽란도가 국제 무역항으로 번성하였다.","d":"고려의 벽란도는 예성강 하구에 위치한 국제 무역항으로, 송·거란·여진은 물론 아라비아 상인까지 내왕하며 활발한 대외 교역이 이루어졌다.","u":"고려시대","c":30},{"k":"귀주대첩","y":"1019","s":"강감찬이 귀주에서 거란군을 크게 무찔렀다.","d":"1019년 강감찬은 귀주(구주)에서 소배압이 이끄는 거란 10만 대군을 섬멸하는 귀주대첩을 이끌어 거란의 3차 침입을 격퇴하였다.","u":"고려시대","c":27},{"k":"12목","y":"983","s":"전국에 12목을 설치하고 지방관을 파견하였다.","d":"고려 성종은 최승로의 건의를 받아들여 전국 주요 거점 12곳에 목(牧)을 설치하고 처음으로 외관(지방관)을 파견하여 지방 통치를 강화하였다.","u":"고려시대","c":26},{"k":"해동통보","y":"1102","s":"주전도감을 설치하여 해동통보를 발행하였다.","d":"고려 숙종은 주전도감을 설치하고 해동통보·삼한통보 등의 화폐를 발행하여 상품 화폐 경제의 활성화를 도모하였다.","u":"고려시대","c":17},{"k":"강화도","y":"1232","s":"강화도로 도읍을 옮겨 장기 항전을 준비하였다.","d":"1232년 최우는 몽골의 침입에 맞서 강화도로 수도를 옮겨 40여 년간 항전하였으며, 이는 기병 중심인 몽골군의 약점을 이용한 전략이었다.","u":"고려시대","c":15},{"k":"과거제","y":"958","s":"쌍기의 건의를 받아들여 과거제를 시행하였다.","d":"고려 광종은 후주 출신 쌍기의 건의로 958년 과거제를 도입하여 능력 있는 인재를 등용하고 공신·호족 세력을 억제하며 왕권을 강화하였다.","u":"고려시대","c":15},{"k":"전민변정도감","y":"1366","s":"신돈을 중심으로 전민변정 사업을 추진하였다.","d":"공민왕은 신돈을 전민변정도감의 판사로 삼아 권문세족이 불법으로 빼앗은 토지와 노비를 원래 주인에게 돌려주는 개혁을 추진하였다.","u":"고려시대","c":15},{"k":"준풍","y":"광종","s":"광덕, 준풍 등의 독자적 연호를 사용하였다.","d":"광종은 '광덕'·'준풍' 등 독자적인 연호를 사용하여 황제국 체제를 표방하였으며, 이는 고려가 대내적으로 황제국 의식을 가졌음을 보여 준다.","u":"고려시대","c":14},{"k":"별무반","y":"1104","s":"신기군, 신보군, 항마군으로 편성되었다.","d":"윤관은 여진 정벌의 실패 원인이 기병력 부족임을 깨닫고 숙종에게 건의하여 기병(신기군)·보병(신보군)·승병(항마군)으로 구성된 별무반을 창설하였다.","u":"고려시대","c":11},{"k":"만권당","y":"1314","s":"만권당에서 원의 학자들과 교유하였다.","d":"이제현은 충선왕이 원의 대도(베이징)에 세운 만권당에서 조맹부·요수 등 원의 유명 학자들과 교류하며 성리학을 고려에 보급하는 데 기여하였다.","u":"고려시대","c":11},{"k":"변발·호복","y":"원 간섭기","s":"지배층을 중심으로 변발과 호복이 유행하였다.","d":"원 간섭기에는 고려 지배층 사이에서 몽골식 머리 모양인 변발과 몽골식 의복인 호복이 유행하는 등 몽골 풍속이 광범위하게 퍼졌다.","u":"고려시대","c":11},{"k":"도병마사","y":"고려","s":"재추를 중심으로 국방, 군사 문제를 논의하였다.","d":"고려의 독자적 정치 기구인 도병마사는 재신과 추밀이 참여하여 변경 방어·군사 문제를 합의로 결정하였으며, 원 간섭기에 도평의사사로 개편되었다.","u":"고려시대","c":10},{"k":"시무 28조","y":"982","s":"최승로의 시무 28조를 받아들여 통치 체제를 정비하였다.","d":"최승로는 성종에게 시무 28조를 올려 유교 정치의 실현, 불교 행사 억제, 지방관 파견 등 고려 초기 통치 체제 정비 방향을 제시하였다.","u":"고려시대","c":10},{"k":"유불 일치설","y":"13세기","s":"선문염송집을 편찬하고 유불 일치설을 주장하였다.","d":"지눌의 제자인 혜심은 수선사 2대 사주로서 선문염송집을 편찬하고 유교와 불교가 근본적으로 같다는 유불 일치설을 주장하였다.","u":"고려시대","c":9},{"k":"동북 9성","y":"1107","s":"별무반을 편성하고 동북 9성을 축조하였다.","d":"예종 때 윤관이 이끄는 별무반이 여진을 정벌하고 함주 등 동북쪽에 9개의 성을 쌓아 영토를 확보하였으나, 이후 여진의 요청으로 반환하였다.","u":"고려시대","c":9},{"k":"노비안검법","y":"956","s":"노비안검법을 시행하여 호족 세력을 견제하였다.","d":"광종은 956년 노비안검법을 실시하여 전쟁 중 불법으로 노비가 된 자를 양인으로 해방시켜 호족의 경제·군사적 기반을 약화시키고 왕권을 강화하였다.","u":"고려시대","c":9},{"k":"수선사","y":"1190","s":"불교 개혁을 주장하며 수선사 결사를 제창하였다.","d":"지눌은 불교계의 세속화를 비판하며 수선사 결사를 조직하고 선(禪)과 교(敎)의 일치를 추구하는 돈오점수·정혜쌍수를 수행 방법으로 제시하였다.","u":"고려시대","c":9},{"k":"교정도감","y":"1209","s":"교정도감을 두어 국가의 중요한 사무를 처리하였다.","d":"최충헌은 이의민을 제거하고 권력을 장악한 뒤 교정도감을 설치하여 국정 전반을 총괄하였으며, 이후 무신 정권의 최고 권력 기구로 기능하였다.","u":"고려시대","c":8},{"k":"천태종","y":"1097","s":"불교 교단 통합을 위해 해동 천태종을 개창하였다.","d":"문종의 넷째 아들인 의천은 송에 유학한 뒤 귀국하여 국청사를 근거지로 해동 천태종을 개창하고 교종 중심으로 선종을 통합하려 하였다.","u":"고려시대","c":8},{"k":"양현고","y":"1119","s":"관학 진흥을 위해 양현고를 설치하였다.","d":"예종은 국자감의 재정 지원을 위해 양현고를 설치하고 국자감에 7재라는 전문 강좌를 개설하는 등 관학 진흥 정책을 적극 추진하였다.","u":"고려시대","c":8},{"k":"훈요 10조","y":"943","s":"후대 왕들이 지켜야 할 정책 방향을 담은 훈요 10조를 남겼다.","d":"태조 왕건은 943년 후손들에게 불교 숭상·풍수지리 존중·북진 정책 계승 등 10가지 통치 지침을 담은 훈요 10조를 남겼다.","u":"고려시대","c":8},{"k":"삼별초","y":"1270","s":"개경 환도 결정에 반발하여 진도에서 항쟁하였다.","d":"삼별초는 1270년 개경 환도에 반발하여 봉기한 뒤 강화도·진도·제주도를 거점으로 몽골과 고려 정부군에 맞서 끝까지 저항하였다.","u":"고려시대","c":7},{"k":"은병","y":"1101","s":"활구라고 불리는 은병을 주조하였다.","d":"고려는 은 1근으로 한반도 지형을 본뜬 은병(활구)을 화폐로 제작하였으나, 고액의 가치로 실생활에서 거의 사용되지 않아 유통이 잘 이루어지지 않았다.","u":"고려시대","c":6},{"k":"백련 결사","y":"1216","s":"법화 신앙을 바탕으로 백련 결사를 이끌었다.","d":"요세는 강진 만덕사(백련사)에서 법화 신앙을 바탕으로 백련 결사를 조직하여 참회·정토 신앙을 강조하는 불교 개혁 운동을 전개하였다.","u":"고려시대","c":6},{"k":"보현십원가","y":"10세기","s":"보현십원가를 지어 불교 교리를 대중에게 전파하였다.","d":"균여는 화엄종 승려로서 향가 형식의 보현십원가 11수를 지어 불교 교리를 일반 백성들이 이해하기 쉽도록 대중화하는 데 앞장섰다.","u":"고려시대","c":6},{"k":"9재 학당","y":"1055","s":"9재 학당을 설립하여 유교 교육에 힘썼다.","d":"최충은 문헌공도(9재 학당)를 설립하여 유학 교육을 실시하였으며, 이후 사학(私學) 12도가 융성하는 계기가 되어 고려 사학 발전에 큰 영향을 미쳤다.","u":"고려시대","c":6},{"k":"흑창","y":"태조","s":"빈민 구제를 위해 흑창이 설치되었다.","d":"태조 왕건은 봄에 곡식을 빌려주고 가을에 갚는 방식으로 빈민을 구제하는 흑창을 설치하였으며, 이는 후에 의창으로 발전하였다.","u":"고려시대","c":6},{"k":"교장","y":"1091","s":"불교 경전에 대한 주석서를 모아 교장을 편찬하였다.","d":"의천은 흥왕사에 교장도감을 설치하고 송·요·일본 등에서 수집한 불교 경전 주석서 4,700여 권을 모아 속장경(교장)을 편찬하였다.","u":"고려시대","c":5},{"k":"청연각","y":"예종","s":"청연각과 보문각을 두어 학문 연구를 장려하였다.","d":"예종은 궁중에 청연각·보문각 등 도서관 겸 연구 기관을 설치하고 학사를 두어 경전을 강론하게 함으로써 문치주의와 학문 진흥을 도모하였다.","u":"고려시대","c":5},{"k":"계백료서","y":"태조","s":"정계와 계백료서를 지어 관리의 규범을 제시하였다.","d":"태조 왕건은 정계와 계백료서를 저술하여 관리가 지켜야 할 도리와 규범을 제시하였으며, 이는 고려 초기 관료제 정비의 기초가 되었다.","u":"고려시대","c":5},{"k":"돈오점수","y":"13세기","s":"돈오점수를 바탕으로 꾸준한 수행을 강조하였다.","d":"지눌은 단번에 깨달음을 얻은 뒤에도(돈오) 지속적인 수행(점수)이 필요하다는 돈오점수설을 제시하여 선종과 교종의 통합을 추구하였다.","u":"고려시대","c":5},{"k":"삼국사기","y":"1145","s":"삼국의 역사를 기전체로 정리한 삼국사기를 편찬하였다.","d":"김부식은 인종의 명으로 1145년 삼국사기를 편찬하였으며, 기전체 형식으로 신라·고구려·백제 삼국의 역사를 유교적 사관에 입각하여 서술하였다.","u":"고려시대","c":4},{"k":"쌍성총관부","y":"1356","s":"쌍성총관부를 공격하여 수복하였다.","d":"공민왕은 1356년 쌍성총관부를 공격하여 원에 빼앗겼던 철령 이북의 땅을 수복하였으며, 이 과정에서 이자춘과 이성계 부자가 활약하였다.","u":"고려시대","c":4},{"k":"광군","y":"947","s":"광군을 조직하여 거란의 침입에 대비하였다.","d":"태조 왕건이 사망한 직후 혜종~정종 시기에 거란의 침입에 대비하여 30만 광군을 조직하였으며, 이는 고려의 최초 대규모 상비군 조직이었다.","u":"고려시대","c":4},{"k":"만적","y":"1198","s":"만적이 개경에서 봉기를 도모하였다.","d":"1198년 최충헌의 노비 만적은 개경에서 '왕후장상의 씨가 따로 있냐'고 외치며 신분 해방을 요구하는 노비 반란을 모의하였으나, 사전에 발각되어 실패하였다.","u":"고려시대","c":4},{"k":"정방","y":"1225","s":"인사 행정 담당 기구로 정방을 설치하였다.","d":"최우는 자신의 집에 정방을 설치하여 문무 관리의 인사를 직접 관할하였으며, 이는 무신 정권이 행정권까지 장악한 것을 상징하는 기구이다.","u":"고려시대","c":4},{"k":"정동행성","y":"1280","s":"일본 원정을 위해 정동행성이 설치되었다.","d":"원은 일본 원정을 목적으로 고려에 정동행성을 설치하였으나, 원정 실패 후에도 정동행성을 유지하며 고려 내정에 간섭하는 기구로 활용하였다.","u":"고려시대","c":4},{"k":"정방 폐지","y":"1352","s":"인사 행정을 담당하던 정방을 폐지하였다.","d":"공민왕은 반원 자주 정책의 일환으로 원 간섭기 무신 정권의 잔재인 정방을 폐지하여 인사권을 왕실로 되돌리고 왕권 강화를 꾀하였다.","u":"고려시대","c":3},{"k":"봉사 10조","y":"1196","s":"봉사 10조를 올려 시정 개혁을 건의하였다.","d":"최충헌은 명종에게 봉사 10조를 올려 왕실 규모 축소·불교 행사 억제·지방관 규찰 등 시정 개혁을 건의하였으나 실제로는 권력 강화의 명분으로 활용하였다.","u":"고려시대","c":3},{"k":"묘청","y":"1135","s":"관군을 이끌고 묘청의 난을 진압하였다.","d":"묘청은 서경(평양) 천도와 금 정벌을 주장하며 1135년 반란을 일으켰으나, 김부식이 이끄는 관군에 의해 약 1년 만에 진압되었다.","u":"고려시대","c":2},{"k":"사심관","y":"태조","s":"사심관 제도를 시행하였다.","d":"태조 왕건은 귀순한 호족들을 해당 지역의 사심관으로 임명하여 지방 행정을 보좌하게 하였으며, 이는 호족을 통제하는 동시에 회유하는 양면적 정책이었다.","u":"고려시대","c":2},{"k":"기인 제도","y":"태조","s":"기인 제도를 실시하여 지방 세력을 견제하였다.","d":"고려는 지방 호족 세력을 통제하기 위해 그 자제를 수도 개경에 머물게 하는 기인 제도를 실시하였으며, 이는 신라의 상수리 제도를 계승한 것이다.","u":"고려시대","c":2},{"k":"전시과","y":"976","s":"관리에게 전지와 시지가 지급되었다.","d":"고려의 전시과는 관리에게 곡물을 얻는 전지와 땔감을 얻는 시지를 직역의 대가로 지급한 토지 제도로, 죽거나 직역이 소멸하면 반납하는 것이 원칙이었다.","u":"고려시대","c":2},{"k":"일리천 전투","y":"936","s":"일리천 전투에서 신검의 군대를 물리쳤다.","d":"936년 태조 왕건은 충남 일리천(연산 일대)에서 후백제 신검의 군대를 격파하고 후삼국을 통일하였다.","u":"고려시대","c":2},{"k":"팔만대장경","y":"1236","s":"대장도감을 설치하여 팔만대장경을 간행하였다.","d":"최우 정권은 몽골 침입을 불력으로 물리치기 위해 강화도에 대장도감을 설치하고 16년에 걸쳐 팔만대장경(재조대장경)을 조판하였다.","u":"고려시대","c":1},{"k":"초조대장경","y":"1011","s":"거란의 침입에 맞서 초조대장경을 조판하였다.","d":"현종 때 거란의 2차 침입을 불력으로 막고자 조판을 시작한 초조대장경은 몽골 침입 때 소실되었으며, 이후 팔만대장경 제작의 계기가 되었다.","u":"고려시대","c":1},{"k":"교관겸수","y":"11세기","s":"이론과 수행을 함께 강조하는 교관겸수를 제시하였다.","d":"의천은 불교 경전의 이론적 학습(교)과 참선 수행(관)을 함께 중시하는 교관겸수를 제시하여 교종 위주로 선종을 통합하려는 불교 통합 방향을 제시하였다.","u":"고려시대","c":1},{"k":"응방","y":"원 간섭기","s":"매를 기르고 훈련시키는 응방이 설치되었다.","d":"원 간섭기에 몽골에 공납할 매를 사육·훈련하는 응방이 설치되었으며, 응방의 관원들이 백성의 토지·재산을 침탈하는 등 많은 폐단을 낳았다.","u":"고려시대","c":1},{"k":"성상융회","y":"10세기","s":"성상융회를 제창하여 교종 내 대립을 해소하였다.","d":"균여는 성상융회(性相融會)를 제창하여 화엄종 내의 법성종·법상종 간 대립을 해소하고자 하였으며, 이는 고려 초 교종 통합의 선구적 시도였다.","u":"고려시대","c":1},{"k":"양계","y":"고려","s":"국경 지역인 양계에 병마사를 파견하였다.","d":"고려는 북방 국경 지역인 동계·북계(양계)에 병마사를 파견하여 군사적 방어를 담당하게 하였으며, 이는 내지의 5도 행정 체제와 구별되는 특수 행정 구역이었다.","u":"고려시대","c":1},{"k":"훈민정음","y":"1443","s":"훈민정음을 창제하여 백성들이 문자를 쉽게 익히도록 하였다.","d":"세종은 1443년 우리말을 표기하기 위한 독창적인 문자 체계인 훈민정음을 창제하고, 1446년 해례본과 함께 반포하였다.","u":"조선시대","c":29},{"k":"4군 6진","y":"세종","s":"김종서가 두만강 일대에 6진을 개척하였다.","d":"세종 때 최윤덕이 압록강 상류에 4군을 설치하고, 김종서가 두만강 일대에 6진을 개척하여 현재의 한반도 국경선 형태를 확립하였다.","u":"조선시대","c":29},{"k":"초계문신제","y":"정조","s":"문신을 재교육하기 위한 초계문신제를 실시하였다.","d":"정조는 37세 이하의 당하관 문신을 선발하여 규장각에서 재교육하는 초계문신제를 시행함으로써 왕권 강화와 인재 양성을 동시에 추구하였다.","u":"조선시대","c":27},{"k":"도고","y":"조선 후기","s":"독점적 도매상인인 도고가 출현하였다.","d":"조선 후기에는 상품 화폐 경제의 발달로 특정 물품을 독점 매입하고 판매하는 도고 상인이 등장하여 유통 경제를 주도하였다.","u":"조선시대","c":25},{"k":"경국대전","y":"1485","s":"조선의 기본 법전인 경국대전을 완성하였다.","d":"성종은 세조 때부터 편찬하기 시작한 경국대전을 1485년 완성하여 반포함으로써 조선의 통치 체제와 유교적 법질서를 확립하였다.","u":"조선시대","c":22},{"k":"의병","y":"임진왜란","s":"곽재우, 고경명 등이 의병장으로 활약하였다.","d":"임진왜란 때 전국 각지에서 자발적으로 의병이 봉기하였으며, 곽재우(의령)·고경명(전라도)·조헌(충청도)·정문부(함경도) 등이 각지에서 활약하였다.","u":"조선시대","c":22},{"k":"탕평비","y":"영조","s":"붕당 정치의 폐해를 경계하기 위해 탕평비를 건립하였다.","d":"영조는 성균관 앞에 탕평비를 세워 편당 없이 공평하게 인재를 등용하겠다는 탕평 의지를 천명하고, 노론·소론의 균형 등용을 실시하였다.","u":"조선시대","c":20},{"k":"직전법","y":"1466","s":"현직 관리에게만 수조권을 지급하는 직전법을 시행하였다.","d":"세조는 1466년 현직 관리에게만 수조지를 지급하는 직전법을 시행하여 세습되던 수신전·휼양전을 폐지하고 국가 재정을 강화하였다.","u":"조선시대","c":17},{"k":"승정원","y":"조선 초","s":"왕의 비서 기관으로 왕명의 출납을 관장하였다.","d":"승정원은 왕명의 출납을 담당한 왕의 비서 기관으로 은대(銀臺)라고도 불렸으며, 도승지를 수장으로 좌·우승지 등 6명의 승지가 6조를 각각 분담하였다.","u":"조선시대","c":16},{"k":"균역법","y":"1750","s":"재정을 보충하기 위해 지주에게 결작을 부과하였다.","d":"영조는 1750년 군포 부담을 2필에서 1필로 줄이는 균역법을 시행하였으며, 부족한 재원을 충당하기 위해 결작·선무군관포·어염세·선박세를 추가로 거두었다.","u":"조선시대","c":16},{"k":"나선 정벌","y":"효종","s":"나선 정벌에 조총 부대를 파견하였다.","d":"효종 때 청의 요청으로 변급(1차)·신류(2차)가 이끄는 조총 부대를 흑룡강 유역에 파견하여 러시아군과 전투를 벌인 나선 정벌에 참전하였다.","u":"조선시대","c":14},{"k":"홍문관","y":"성종","s":"사헌부, 사간원과 함께 3사로 불렸다.","d":"성종 때 설치된 홍문관은 왕의 학문 자문·경연 담당 기관으로 옥당(玉堂)이라고도 불렸으며, 사헌부(감찰)·사간원(간쟁)과 함께 3사를 이루었다.","u":"조선시대","c":13},{"k":"사르후 전투","y":"광해군","s":"강홍립 부대가 사르후 전투에 참전하였다.","d":"광해군은 명의 원군 요청에 따라 강홍립을 도원수로 1만 3천 명의 군대를 파견하였으나, 강홍립은 후금에 투항하는 중립 외교를 실행하였다.","u":"조선시대","c":13},{"k":"대동법","y":"광해군","s":"관청에 물품을 조달하는 공인이 등장하였다.","d":"광해군 때 경기도에 처음 시행된 대동법은 집집마다 부과하던 공물을 토지 결수에 따라 쌀·포·동전으로 납부하게 하였으며, 이로써 공인이 등장하였다.","u":"조선시대","c":13},{"k":"의산문답","y":"18세기","s":"의산문답에서 무한 우주론을 주장하였다.","d":"홍대용은 의산문답에서 지전설을 주장하고 무한 우주론을 전개하며 중국 중심의 세계관을 비판하였으며, 기술 혁신을 통한 부국강병을 역설하였다.","u":"조선시대","c":13},{"k":"금위영","y":"숙종","s":"국왕의 호위와 수도 방어를 위해 금위영을 창설하였다.","d":"숙종은 훈련도감·어영청과 함께 수도 방어를 위해 금위영을 설치하여 5군영 체제를 완성하였으며, 금위영은 왕의 호위와 도성 방어를 담당하였다.","u":"조선시대","c":12},{"k":"북학의","y":"정조","s":"북학의에서 절약보다 적절한 소비를 권장하였다.","d":"박지원의 제자인 박제가는 북학의에서 청의 선진 문물을 적극 수용할 것을 주장하며 수레·선박 이용과 소비 촉진을 강조하였으며, 규장각 검서관을 지냈다.","u":"조선시대","c":12},{"k":"강화학파","y":"18세기 초","s":"양명학을 연구하여 강화학파를 형성하였다.","d":"정제두는 주자학 중심의 학문 풍토에서 양명학을 체계적으로 연구하여 강화학파를 형성하였으며, 지행합일(知行合一)을 강조하는 양명학의 실천성을 부각시켰다.","u":"조선시대","c":11},{"k":"신해통공","y":"1791","s":"육의전을 제외한 시전 상인의 금난전권이 폐지되었다.","d":"정조는 1791년 신해통공을 실시하여 육의전을 제외한 시전 상인의 금난전권을 폐지함으로써 사상(私商)의 자유로운 상업 활동을 허용하였다.","u":"조선시대","c":11},{"k":"계미자","y":"1403","s":"주자소를 설치하여 계미자를 주조하였다.","d":"태종은 주자소를 설치하고 동활자인 계미자를 주조하여 활판 인쇄의 기반을 마련하였으며, 이는 서적 보급 확대와 문화 발전에 기여하였다.","u":"조선시대","c":10},{"k":"혼일강리역대국도지도","y":"1402","s":"세계 지도인 혼일강리역대국도지도가 제작되었다.","d":"태종 때 권근·이회 등이 제작한 혼일강리역대국도지도는 아프리카와 유럽까지 포함한 동양 최고의 세계 지도로, 한국 지도학 발전의 선구적 업적이다.","u":"조선시대","c":10},{"k":"악학궤범","y":"성종","s":"음악 이론 등을 집대성한 악학궤범을 완성하였다.","d":"성종 때 성현 등이 편찬한 악학궤범은 음악 이론·악기·무용·의상 등 음악 전반에 관한 내용을 집대성한 책으로, 예악 질서 확립의 기초가 되었다.","u":"조선시대","c":10},{"k":"현량과","y":"중종","s":"소학의 보급과 현량과 실시를 주장하였다.","d":"조광조는 중종의 신임을 받아 소격서 폐지·소학 보급·현량과 실시 등 도학 정치를 추진하였으나, 기묘사화(1519)로 훈구 세력에 의해 제거되었다.","u":"조선시대","c":10},{"k":"농사직설","y":"1429","s":"각지의 농법을 작물별로 정리한 농사직설을 편찬하였다.","d":"세종은 각 지방의 농업 경험을 수집하여 우리 풍토에 맞는 농법을 작물별로 정리한 농사직설을 편찬하여 농업 생산력 향상을 도모하였다.","u":"조선시대","c":10},{"k":"성균관","y":"조선 초","s":"대사성을 수장으로 좨주, 직강 등의 관직을 두었다.","d":"조선 최고의 국립 교육 기관인 성균관은 소과(생진과) 합격자에게 입학 자격을 부여하였으며, 대성전(제향)·명륜당(강학)을 중심으로 운영되었다.","u":"조선시대","c":10},{"k":"비변사","y":"중종","s":"을묘왜변을 계기로 상설 기구화되었다.","d":"중종 때 삼포왜란을 계기로 설치된 비변사는 을묘왜변(명종)으로 상설 기구가 되었고, 임진왜란 이후 국정 전반을 총괄하는 최고 기구로 확대되었다.","u":"조선시대","c":10},{"k":"이괄의 난","y":"1624","s":"이괄이 이끈 반란군이 도성을 장악하였다.","d":"1624년 인조반정의 논공행상에 불만을 품은 이괄이 반란을 일으켜 한때 한성을 점령하였으며, 인조가 공주로 피란하는 사태를 초래하였다.","u":"조선시대","c":10},{"k":"담배","y":"조선 후기","s":"담배, 면화, 생강 등 상품 작물을 재배하였다.","d":"조선 후기에는 모내기법의 보급으로 이모작이 가능해지면서 쌀 외에 담배·면화·생강·인삼 등 상품 작물을 재배하는 농민이 늘어났다.","u":"조선시대","c":9},{"k":"의금부","y":"조선 초","s":"국왕 직속 사법 기구로 반역죄, 강상죄 등을 처결하였다.","d":"의금부는 왕명으로 반역·강상의 죄를 범한 중죄인을 다스리는 국왕 직속 특별 사법 기구로, 삼성추국(의금부·사헌부·형조)의 구성원이기도 하였다.","u":"조선시대","c":9},{"k":"한전론","y":"18세기","s":"성호사설에서 토지 매매를 제한하는 한전론을 주장하였다.","d":"이익은 성호사설과 곽우록에서 한 가정의 생계에 필요한 최소 토지를 영업전으로 설정하고 매매를 제한하는 한전론을 주장하여 토지 겸병의 폐단을 시정하려 하였다.","u":"조선시대","c":9},{"k":"속대전","y":"영조","s":"통치 규범을 재정비한 속대전을 편찬하였다.","d":"영조는 경국대전 반포 이후 추가된 법령을 정리하여 속대전을 편찬하였으며, 이후 정조 때 대전통편이, 고종 때 대전회통이 편찬되어 법전 체계가 완성되었다.","u":"조선시대","c":9},{"k":"거중기","y":"정조","s":"기기도설을 참고하여 거중기를 설계하였다.","d":"정약용은 청의 기기도설을 참고하여 거중기를 설계하였으며, 이 기계는 수원 화성 축조 시 활용되어 공사 기간 단축과 비용 절감에 크게 기여하였다.","u":"조선시대","c":8},{"k":"규장각","y":"정조","s":"서얼 출신 학자들이 검서관에 등용되었다.","d":"정조는 규장각을 설치하여 학문 연구와 정책 자문 기능을 담당하게 하였으며, 박제가·이덕무 등 서얼 출신 학자들을 검서관으로 등용하여 탕평을 실천하였다.","u":"조선시대","c":8},{"k":"송상·만상","y":"조선 후기","s":"송상, 만상이 대청 무역으로 부를 축적하였다.","d":"조선 후기에 개성 상인(송상)은 인삼 무역으로, 의주 상인(만상)은 대청 무역으로 거대한 부를 축적하였으며, 이들은 전국적인 유통망을 장악하였다.","u":"조선시대","c":8},{"k":"장용영","y":"1793","s":"국왕의 친위 부대인 장용영이 창설되었다.","d":"정조는 왕권 강화를 위해 1793년 장용영을 설치하여 한성의 내영과 수원 화성의 외영으로 나누어 운영하였으나, 정조 사후 순조 때 혁파되었다.","u":"조선시대","c":8},{"k":"동국문헌비고","y":"영조","s":"역대 문물 제도를 정리한 동국문헌비고가 편찬되었다.","d":"영조 때 홍봉한 등이 편찬한 동국문헌비고는 역대 문물 제도를 분류·정리한 유서(類書)로, 정조 때 증보되어 이후 만기요람 편찬의 토대가 되었다.","u":"조선시대","c":7},{"k":"계해약조","y":"1443","s":"제한된 범위의 무역을 허용한 계해약조가 체결되었다.","d":"세종 때 이종무의 쓰시마 정벌 이후 1443년 체결된 계해약조는 세견선 50척·세사미두 200석으로 일본과의 교역을 제한적으로 허용한 조약이다.","u":"조선시대","c":7},{"k":"동의보감","y":"광해군","s":"전란의 피해를 복구하고 동의보감을 간행하였다.","d":"허준이 선조 때부터 편찬을 시작한 동의보감은 광해군 때 완성·간행되었으며, 우리 전통 한의학을 집대성한 의학 백과사전으로 유네스코 세계기록유산에 등재되어 있다.","u":"조선시대","c":7},{"k":"양반전","y":"18세기","s":"양반의 허례와 무능을 풍자한 양반전을 지었다.","d":"박지원은 열하일기·양반전·허생전 등을 저술하여 청의 선진 문물 수용을 주장하고 양반 계층의 허위와 무능을 풍자하였으며, 북학파의 대표적 인물이다.","u":"조선시대","c":7},{"k":"진주성 전투","y":"1592","s":"김시민이 진주성 전투에서 크게 승리하였다.","d":"1592년 10월 진주 목사 김시민은 불과 3,800명의 병력으로 2만여 명의 왜군을 진주성에서 격퇴하였으며, 이는 임진왜란 3대 대첩의 하나이다.","u":"조선시대","c":6},{"k":"쓰시마 정벌","y":"1419","s":"이종무가 왜구의 근거지인 쓰시마섬을 정벌하였다.","d":"세종은 1419년 삼군도체찰사 이종무에게 227척의 군선과 1만 7천 명의 병력으로 왜구의 본거지인 쓰시마섬(대마도)을 정벌하게 하였다.","u":"조선시대","c":6},{"k":"열하일기","y":"1780","s":"열하일기에서 수레와 선박의 필요성을 서술하였다.","d":"박지원은 1780년 청 건륭제의 칠순 연회에 동행하여 견문한 내용을 열하일기에 담았으며, 수레·선박 이용과 상공업 진흥을 통한 부국강병을 역설하였다.","u":"조선시대","c":6},{"k":"불씨잡변","y":"조선 초","s":"불씨잡변을 지어 불교를 비판하였다.","d":"정도전은 불씨잡변에서 불교의 교리를 조목조목 비판하고 유학의 우월성을 논증하였으며, 조선경국전 편찬을 통해 조선의 통치 체계 수립에도 크게 기여하였다.","u":"조선시대","c":6},{"k":"국조오례의","y":"성종","s":"국조오례의가 완성되어 국가 의례가 정비되었다.","d":"성종 때 완성된 국조오례의는 길례·가례·빈례·군례·흉례의 오례를 체계화한 의례서로, 조선의 유교적 국가 의례 체계를 완성하는 데 기여하였다.","u":"조선시대","c":6},{"k":"남한산성","y":"병자호란","s":"왕이 도성을 떠나 남한산성으로 피란하였다.","d":"1636년 병자호란 당시 인조는 후금(청)의 군대를 피해 남한산성으로 피신하여 47일간 항전하였으나, 결국 삼전도에서 청 태종에게 항복하였다.","u":"조선시대","c":6},{"k":"환국","y":"숙종","s":"경신환국 등 여러 차례 환국이 발생하였다.","d":"숙종 때 경신환국(남인 축출)·기사환국(서인 몰락)·갑술환국(남인 재축출)이 잇따라 일어났으며, 이는 왕이 붕당 간 세력 균형을 조절하는 방식이었다.","u":"조선시대","c":5},{"k":"공인","y":"조선 후기","s":"관청에 물품을 조달하는 공인이 활동하였다.","d":"대동법 시행으로 등장한 공인은 관청으로부터 공가(公價)를 미리 받아 필요한 물품을 조달하는 어용 상인으로, 상품 화폐 경제 발달에 크게 기여하였다.","u":"조선시대","c":5},{"k":"백두산정계비","y":"1712","s":"청과 국경을 정한 백두산정계비를 건립하였다.","d":"1712년 숙종 때 청의 오라총관 목극등과 조선 관리들이 백두산 일대를 조사하여 압록강·토문강을 국경으로 확정하는 백두산정계비를 세웠다.","u":"조선시대","c":5},{"k":"진흥왕 순수비","y":"19세기","s":"금석과안록에서 북한산비가 진흥왕 순수비임을 고증하였다.","d":"추사 김정희는 금석학을 연구하여 북한산비가 신라 진흥왕의 순수비임을 고증하였으며, 독창적인 서체인 추사체를 창안하고 세한도 등의 작품을 남겼다.","u":"조선시대","c":5},{"k":"훈련도감","y":"1593","s":"포수, 사수, 살수의 삼수병으로 편제되었다.","d":"임진왜란 중 류성룡의 건의로 설치된 훈련도감은 포수·사수·살수의 삼수병으로 편제된 조선 최초의 상비군으로, 이후 5군영 체제의 핵심 군영이 되었다.","u":"조선시대","c":5},{"k":"구식 군인","y":"1882","s":"구식 군인에 대한 차별 대우가 발단이 되어 일어났다.","d":"1882년 구식 군인들이 신식 군대 별기군과의 차별적 대우에 반발하여 봉기하였고, 청군의 개입으로 진압된 뒤 제물포 조약과 조청 상민 수륙 무역 장정이 체결되었다.","u":"개화기","c":17},{"k":"지계","y":"1901","s":"지계아문을 설치하여 토지 소유자에게 지계를 발급하였다.","d":"광무개혁에서 지계아문을 통해 양전 사업을 실시하고 근대적 토지 소유 증명서인 지계를 발급하여 토지 소유권을 확립하고자 하였다.","u":"개화기","c":17},{"k":"경복궁 중건","y":"1865","s":"경복궁 중건 비용을 마련하기 위해 원납전을 발행하였다.","d":"흥선대원군은 왕실 권위 회복을 위해 경복궁을 중건하면서 원납전 강제 징수와 당백전 남발로 재원을 마련하였으나, 이로 인해 물가 폭등과 민심 이반이 심화되었다.","u":"개화기","c":15},{"k":"우정총국","y":"1884","s":"우정총국 개국 축하연을 이용하여 일어났다.","d":"1884년 김옥균·홍영식 등 급진 개화파가 우정총국 개국 축하연을 기회로 정변을 일으켜 개화당 정부를 수립하였으나, 청군의 개입으로 3일 만에 실패하였다.","u":"개화기","c":13},{"k":"홍범 14조","y":"1895","s":"개혁의 방향을 제시한 홍범 14조를 반포하였다.","d":"2차 갑오개혁의 기본 강령인 홍범 14조는 청과의 사대 관계 청산, 입헌 군주제 지향, 재정 일원화 등을 담고 있으며, 고종이 종묘에서 독립 서고문을 낭독하며 반포하였다.","u":"개화기","c":12},{"k":"황무지 개간권","y":"1904","s":"일제의 황무지 개간권 요구를 저지하였다.","d":"1904년 일제의 황무지 개간권 요구에 맞서 보안회가 조직되어 전국적 반대 운동을 펼쳤으며, 이를 통해 일제의 요구를 철회시키는 성과를 거두었다.","u":"개화기","c":11},{"k":"집강소","y":"1894","s":"집강소를 중심으로 폐정 개혁안을 실천하였다.","d":"전주 화약 이후 동학 농민군은 전라도 각 고을에 집강소를 설치하고 탐관오리 처벌·노비 문서 소각·토지 평균 분작 등 폐정 개혁을 자치적으로 실행하였다.","u":"개화기","c":11},{"k":"어재연","y":"1871","s":"광성보에서 어재연 부대가 미국 군대에 맞서 항전하였다.","d":"1871년 신미양요 때 어재연 장군이 이끄는 수비대가 강화도 광성보에서 미군에 맞서 끝까지 항전하다 전사하였으며, 이 사건 이후 흥선대원군은 전국에 척화비를 건립하였다.","u":"개화기","c":10},{"k":"태극 서관","y":"1907","s":"계몽 서적의 보급을 위해 태극 서관을 운영하였다.","d":"1907년 안창호·양기탁 등이 조직한 비밀 결사 신민회는 태극 서관(출판)·대성 학교(교육)를 운영하며 실력 양성을 통한 국권 회복을 도모하다가 105인 사건으로 와해되었다.","u":"개화기","c":9},{"k":"군국기무처","y":"1894","s":"개혁을 추진하기 위해 군국기무처를 두었다.","d":"1894년 군국기무처를 설치하고 1차 갑오개혁을 추진하여 공·사 노비제 폐지·과거제 폐지·6조를 8아문으로 개편·조혼 금지·과부 재가 허용 등 근대적 개혁을 단행하였다.","u":"개화기","c":9},{"k":"만민공동회","y":"1898","s":"만민 공동회를 개최하여 자주 국권 운동을 펼쳤다.","d":"독립협회는 1898년 종로에서 만민공동회를 개최하여 러시아의 절영도 조차 요구 철회 등 자주 국권 운동을 전개하였고, 관민공동회에서 헌의 6조를 결의하였다.","u":"개화기","c":8},{"k":"수신사","y":"1876","s":"김기수가 수신사로 파견되는 결과를 가져왔다.","d":"1876년 강화도 조약 체결 이후 일본의 근대 문물을 시찰하기 위해 김기수를 정사로 한 수신사를 파견하였으며, 이는 조선 최초의 근대적 외교 사절단이었다.","u":"개화기","c":8},{"k":"공사 노비법 혁파","y":"1894","s":"공사 노비법을 혁파하고 과부의 재가를 허용하였다.","d":"1차 갑오개혁에서 공·사 노비제를 폐지하고 인신 매매를 금지하였으며, 조혼 금지·과부 재가 허용·연좌제 폐지 등 신분 제도 개혁과 사회 제도 개혁을 단행하였다.","u":"개화기","c":7},{"k":"외규장각 도서","y":"1866","s":"외규장각 도서가 약탈되는 결과를 가져왔다.","d":"1866년 병인박해를 빌미로 프랑스군이 강화도를 침략한 병인양요 때 양헌수 부대가 정족산성에서 이를 격퇴하였으나, 외규장각 의궤 등 귀중한 문화재가 약탈되었다.","u":"개화기","c":7},{"k":"대성 학교","y":"1907","s":"대성 학교를 설립하여 민족 교육을 실시하였다.","d":"신민회는 안창호가 평양에 대성 학교를, 이승훈이 정주에 오산 학교를 설립하여 근대적 민족 교육을 실시하였으며, 이는 교육을 통한 실력 양성 운동의 핵심 사업이었다.","u":"개화기","c":7},{"k":"고종 강제 퇴위 반대","y":"1907","s":"고종의 강제 퇴위에 반대하는 시위를 주도하였다.","d":"1907년 헤이그 특사 파견을 빌미로 일제가 고종을 강제 퇴위시키자 대한자강회가 반대 운동을 주도하였으나 일제의 탄압으로 해산되었다.","u":"개화기","c":7},{"k":"육영 공원","y":"1886","s":"근대 교육 기관인 육영 공원을 설립하였다.","d":"1886년 조선 정부가 설립한 육영 공원은 상류층 자제를 대상으로 미국인 교사 헐버트·길모어 등을 초빙하여 영어·수학 등 근대 학문을 가르친 최초의 근대적 관립 학교이다.","u":"개화기","c":7},{"k":"한성순보","y":"1883","s":"박문국을 두어 한성순보를 발행하였다.","d":"1883년 정부 기관인 박문국에서 발행한 한성순보는 순 한문으로 열흘마다 발행된 우리나라 최초의 근대 신문으로, 개화 정보와 국내외 소식을 전달하였다.","u":"개화기","c":6},{"k":"중추원 개편","y":"1898","s":"중추원 개편을 통해 의회 설립을 추진하였다.","d":"독립협회는 관민공동회 헌의 6조를 바탕으로 중추원을 의회로 개편하여 입헌 군주제를 수립하려 하였으나, 보수 세력의 반발과 고종의 해산 명령으로 무산되었다.","u":"개화기","c":6},{"k":"국채 보상","y":"1907","s":"김광제 등의 발의로 국채 보상 운동이 전개되었다.","d":"1907년 대구에서 서상돈·김광제 등이 발의한 국채 보상 운동은 일본 차관 1,300만 원을 국민 모금으로 갚자는 운동으로, 대한매일신보의 후원으로 전국에 확산되었다.","u":"개화기","c":6},{"k":"원각사","y":"1908","s":"원각사에서 신연극 은세계를 공연하였다.","d":"1908년 서울 원각사에서 이인직의 신소설을 원작으로 한 연극 '은세계'가 공연되었으며, 원각사는 우리나라 최초의 근대식 서양 극장으로 신문화 공연의 중심지가 되었다.","u":"개화기","c":6},{"k":"원수부","y":"1899","s":"구본신참을 바탕으로 원수부를 설립하였다.","d":"광무개혁에서 고종은 황제로서 군 통수권을 직접 장악하기 위해 원수부를 설치하였으며, '옛것을 근본으로 새것을 참고한다'는 구본신참 원칙에 따라 점진적 개혁을 추진하였다.","u":"개화기","c":6},{"k":"건양","y":"1895","s":"건양이라는 독자적인 연호를 채택하였다.","d":"을미개혁에서 건양이라는 독자 연호를 채택하고 태양력을 도입하였으며, 단발령을 시행하였으나 을미사변 이후 반발이 거세져 의병이 일어나는 원인이 되었다.","u":"개화기","c":6},{"k":"박문국","y":"1883","s":"박문국에서 순 한문으로 발행된 근대 신문이었다.","d":"1883년 설치된 박문국은 우리나라 최초의 근대 신문인 한성순보를 발행한 정부 출판 기관으로, 갑신정변 때 파괴되었다가 이후 국한문 혼용의 한성주보를 발행하며 재개되었다.","u":"개화기","c":6},{"k":"거문도","y":"1885","s":"영국이 거문도를 불법적으로 점령하였다.","d":"1885년 러시아의 남하를 견제하기 위해 영국 해군이 전라남도 거문도를 불법 점령하였으며(거문도 사건), 청의 중재로 1887년 철수하였다.","u":"개화기","c":6},{"k":"영선사","y":"1881","s":"김윤식이 영선사로 청에 파견되었다.","d":"1881년 김윤식을 단장으로 한 영선사가 청에 파견되어 근대 무기 제조 기술을 배웠으며, 귀국 후 기기창 설립의 토대를 마련하였고 임오군란으로 조기 귀국하였다.","u":"개화기","c":5},{"k":"제너럴 셔먼호","y":"1866","s":"평양 관민이 통상을 요구하는 제너럴 셔먼호를 불태웠다.","d":"1866년 미국 상선 제너럴 셔먼호가 대동강에서 통상을 강요하며 행패를 부리자 평양 관민이 배를 불태웠으며, 이 사건은 1871년 신미양요의 빌미가 되었다.","u":"개화기","c":5},{"k":"황국 중앙 총상회","y":"1898","s":"황국 중앙 총상회가 상권 수호 운동을 주도하였다.","d":"1898년 외국 상인의 침투로 위기에 처한 시전 상인들이 황국 중앙 총상회를 결성하여 외국 상인의 내지 영업 금지를 요구하는 상권 수호 운동을 전개하였다.","u":"개화기","c":5},{"k":"13도 창의군","y":"1907","s":"13도 창의군이 결성되어 서울 진공 작전을 펼쳤다.","d":"1907년 군대 해산으로 해산 군인들이 합류하면서 정미의병은 조직화되었고, 이인영을 총대장으로 13도 창의군을 편성하여 서울 진공 작전을 전개하였다.","u":"개화기","c":5},{"k":"통리기무아문","y":"1880","s":"개화 정책을 총괄하는 통리기무아문이 설치되었다.","d":"1880년 개화 정책 추진을 위해 통리기무아문이 설치되었으며, 이어 신식 군대 별기군 창설·5군영을 2영으로 통합·영선사 파견·신사유람단 파견 등의 개화 정책이 시행되었다.","u":"개화기","c":5},{"k":"태양력","y":"1895","s":"태양력을 공식 채택하고 단발령을 시행하였다.","d":"을미개혁에서 서양의 태양력을 도입하여 1895년 11월 17일을 1896년 1월 1일로 선포하였으며, 같은 시기의 단발령 시행은 전국적인 반발과 의병 봉기를 불러일으켰다.","u":"개화기","c":5},{"k":"독립문","y":"1897","s":"독립문을 세워 자주독립 의지를 표명하였다.","d":"독립협회는 청의 사신을 맞이하던 영은문을 허물고 그 자리에 독립문을 건립하였으며, 독립관을 토론·집회 장소로 활용하여 자주 국권 의식을 고취하였다.","u":"개화기","c":5},{"k":"양헌수","y":"1866","s":"양헌수가 정족산성에서 프랑스군을 격퇴하였다.","d":"1866년 병인양요 때 양헌수가 이끄는 조선군이 정족산성에서 프랑스군을 물리쳤으나, 강화도에서 철수하는 프랑스군이 외규장각 의궤 등 문화재를 약탈하였다.","u":"개화기","c":4},{"k":"김옥균","y":"1884","s":"김옥균 등 급진 개화파가 입헌 군주제 수립을 목표로 주도하였다.","d":"김옥균·홍영식·박영효 등 급진 개화파는 일본 메이지 유신을 모델로 갑신정변을 일으켜 14개조 개혁 정강을 발표하였으나, 청군 개입으로 3일 만에 실패하고 망명하였다.","u":"개화기","c":4},{"k":"만세보","y":"1906","s":"만세보를 발행하여 민중 계몽에 힘썼다.","d":"천도교는 동학에서 발전한 민족 종교로 기관지 만세보를 발행하여 민중 계몽에 앞장섰으며, 3·1 운동에서 민족 대표 33인 가운데 15인을 배출하는 등 독립운동의 중심이 되었다.","u":"개화기","c":4},{"k":"경인선","y":"1899","s":"우리나라 최초의 철도인 경인선이 개통되었다.","d":"1899년 우리나라 최초의 철도인 경인선(노량진~제물포)이 개통되었으며, 같은 해 서울에 전차도 개통되었다. 경인선 개통으로 서울과 인천의 이동이 크게 편리해졌다.","u":"개화기","c":4},{"k":"헌의 6조","y":"1898","s":"관민 공동회를 개최하여 헌의 6조를 결의하였다.","d":"독립협회가 주도한 관민공동회에서 외국과의 이권 계약 체결 시 의회 의결 필요, 재정의 탁지부 관할 일원화 등을 담은 헌의 6조를 결의하여 고종의 재가를 얻었다.","u":"개화기","c":4},{"k":"서유견문","y":"1895","s":"미국·유럽을 여행한 뒤 서유견문을 집필하였다.","d":"유길준은 1883년 보빙사의 일원으로 도미하여 최초의 미국 유학생이 되었으며, 귀국 후 서유견문을 저술하여 서양의 근대 문물을 소개하고 조선 중립화론을 주장하였다.","u":"개화기","c":4},{"k":"한성 조약","y":"1885","s":"갑신정변 이후 조선과 일본 사이에 한성 조약이 체결되었다.","d":"갑신정변 실패 후 조선과 일본은 한성 조약을 체결하여 일본 공사관 신축 비용과 피해 배상을 조선이 부담하게 되었으며, 청일 간에는 톈진 조약이 체결되었다.","u":"개화기","c":4},{"k":"경부선","y":"1905","s":"서울과 부산을 연결하는 경부선이 개통되었다.","d":"1905년 경부선 철도가 개통되어 서울과 부산이 연결되었으며, 이는 러일 전쟁 중 일본의 군사·물자 수송을 목적으로 부설되어 일본의 대륙 침략을 용이하게 하였다.","u":"개화기","c":4},{"k":"23부 개편","y":"1895","s":"지방 행정 구역을 8도에서 23부 337군으로 개편하였다.","d":"2차 갑오개혁에서 지방 행정을 8도에서 23부 337군으로 개편하였으며, 교육 입국 조서 반포·재판소 설치 등 사법과 교육 제도의 근대화도 함께 추진하였다.","u":"개화기","c":4},{"k":"국채 보상 운동 지원","y":"1907","s":"국채 보상 운동의 확산에 기여하였다.","d":"영국인 베델과 양기탁이 창간한 대한매일신보는 통감부의 검열을 피해 항일 논조를 유지하며 국채 보상 운동의 확산과 의병 투쟁 보도에 적극 기여하였다.","u":"개화기","c":4},{"k":"청군 개입","y":"1882","s":"청군의 개입으로 진압되었다.","d":"임오군란은 청군의 개입으로 진압되었으며, 청은 흥선대원군을 납치하고 군사 고문을 파견하는 등 조선에 대한 내정 간섭을 강화하여 조청 상민 수륙 무역 장정을 체결하였다.","u":"개화기","c":4},{"k":"전주 화약","y":"1894","s":"전주 화약이 체결되어 농민군이 자진 해산하였다.","d":"동학 농민군이 전주성을 점령하자 조선 정부가 청에 원군을 요청하였고, 농민군은 폐정 개혁 약속을 받은 뒤 전주 화약을 체결하고 자진 해산하였다.","u":"개화기","c":3},{"k":"호포제","y":"1871","s":"호포제를 시행하여 양반에게도 군포를 징수하였다.","d":"흥선대원군은 종래 상민에게만 부과하던 군포를 양반에게도 징수하는 호포제를 시행하여 재정을 확충하고 양반 특권을 축소하였으며, 서원 철폐와 비변사 혁파도 단행하였다.","u":"개화기","c":3},{"k":"보빙사","y":"1883","s":"민영익을 대표로 한 보빙사가 미국에 파견되었다.","d":"1883년 조미수호통상조약 체결 이후 민영익을 전권대신으로 한 보빙사가 미국에 파견되어 대통령을 예방하고 근대 문물을 시찰하였으며, 유길준은 이때 미국에 남아 유학하였다.","u":"개화기","c":3},{"k":"서재필","y":"1896","s":"서재필이 창간한 우리나라 최초의 민간 신문이었다.","d":"서재필은 1896년 우리나라 최초의 민간 신문인 독립신문을 창간하여 순한글과 영문판으로 발행하였으며, 같은 해 독립협회를 설립하여 자주 국권 운동을 이끌었다.","u":"개화기","c":3},{"k":"양기탁·베델","y":"1904","s":"양기탁과 영국인 베델이 창간한 신문이었다.","d":"대한매일신보는 1904년 양기탁과 영국인 베델(배설)이 창간하였으며, 베델의 외국인 신분 덕분에 일제의 검열을 피해 항일 논조의 기사를 게재하고 의병 활동을 호의적으로 보도하였다.","u":"개화기","c":3},{"k":"58성 700촌","y":"396","s":"광개토 대왕의 침입을 받아 58성 700촌을 상실하였어요.","d":"396년 광개토 대왕은 백제를 공격해 58성 700촌을 빼앗고 아신왕의 항복을 받았다. 이 사실은 광개토대왕릉비에 기록되어 있다.","u":"삼국시대","c":1},{"k":"화랑세기","y":"김대문","s":"화랑세기, 고승전 등을 저술하였다.","d":"통일신라의 진골 귀족 김대문은 화랑세기·고승전·한산기 등을 저술하여 신라의 역사와 문화를 주체적으로 정리하였다.","u":"삼국시대","c":1},{"k":"삼대목","y":"888","s":"향가 모음집인 삼대목을 편찬하였다.","d":"888년 진성 여왕 때 각간 위홍과 대구화상이 향가를 모아 삼대목을 편찬하였으나 오늘날 전하지 않는다.","u":"삼국시대","c":1},{"k":"정림사지 오층석탑","y":"백제","s":"백제 멸망의 슬픔이 담긴 석탑으로 평제탑이라 불리기도 하였다.","d":"부여 정림사지 오층석탑은 목탑 양식을 계승한 백제의 대표 석탑이다. 당의 장수 소정방이 1층 탑신에 백제 정벌을 기념하는 글을 새겨 한때 평제탑으로 불리는 수모를 겪었다.","u":"삼국시대","c":1},{"k":"인안·대흥","y":"발해","s":"인안, 대흥 등 독자적인 연호를 사용하였다.","d":"발해 무왕은 인안, 문왕은 대흥이라는 독자 연호를 사용하여 당과 대등하다는 자주 의식을 드러냈다.","u":"삼국시대","c":1},{"k":"국학","y":"682","s":"박사와 조교를 두어 유학을 교육하였다.","d":"신문왕 2년(682) 예부에 속한 국학을 설치하고 박사와 조교를 두어 논어·효경 등을 가르쳤으며, 성적에 따라 상·중·하품으로 나누어 관리로 등용하였다.","u":"삼국시대","c":1},{"k":"걸사표","y":"608","s":"원광이 왕명으로 걸사표를 작성하였다.","d":"608년 진평왕의 명으로 원광이 수에 고구려 정벌을 요청하는 걸사표를 지었다. 원광은 세속 5계를 지은 인물로도 유명하다.","u":"삼국시대","c":1},{"k":"김헌창의 난","y":"822","s":"김헌창이 웅천주에서 반란을 일으켰다.","d":"822년 웅천주 도독 김헌창은 아버지 김주원이 왕위에 오르지 못한 데 불만을 품고 국호를 장안이라 하며 반란을 일으켰다.","u":"삼국시대","c":1},{"k":"역분전","y":"940","s":"공신에게 역분전을 지급하였다.","d":"940년 태조는 후삼국 통일에 공을 세운 신하들에게 공로와 인품을 기준으로 역분전을 주었으며, 이는 뒤에 마련된 전시과의 토대가 되었다.","u":"고려시대","c":1},{"k":"만부교 사건","y":"942","s":"거란을 배척하여 만부교 사건이 일어났다.","d":"942년 태조는 발해를 멸망시킨 거란이 보낸 낙타 50마리를 만부교 아래에 묶어 굶겨 죽이고 사신을 유배 보내 거란 배척과 북진 정책의 뜻을 분명히 하였다.","u":"고려시대","c":1},{"k":"제위보","y":"963","s":"빈민을 구휼하는 제위보의 관리","d":"고려 광종 때 설치된 제위보는 기금을 마련해 그 이자로 빈민을 구제하던 기관으로, 의창·상평창과 함께 대표적인 사회 시설이었다.","u":"고려시대","c":1},{"k":"서희의 외교 담판","y":"993","s":"서희가 소손녕과 외교 담판을 벌였다.","d":"993년 거란의 1차 침입 때 서희는 소손녕과 담판하여 고려가 고구려를 계승하였음을 주장하고, 송과 관계를 끊는 조건으로 강동 6주를 확보하였다.","u":"고려시대","c":1},{"k":"개경 나성","y":"1029","s":"개경에 나성을 축조하고 정치 체제를 정비하다","d":"거란의 침입을 겪은 뒤 현종 때 강감찬의 건의로 개경에 나성을 쌓아 도성 방어를 강화하였고, 이어 국경에 천리장성을 축조하였다.","u":"고려시대","c":1},{"k":"공음전","y":"1049","s":"5품 이상 관리에게 공음전을 지급하였다.","d":"고려는 5품 이상 고위 관리에게 자손에게 세습할 수 있는 공음전을 지급하였으며, 이는 문벌 귀족의 경제적 기반이 되었다.","u":"고려시대","c":1},{"k":"2군 6위","y":"고려","s":"응양군과 용호군으로 구성된 친위 부대였다.","d":"고려의 중앙군은 국왕 친위 부대인 2군(응양군·용호군)과 수도·국경 방어를 맡은 6위로 편성되었고, 지방군은 주현군과 주진군으로 구성되었다.","u":"고려시대","c":1},{"k":"소(특수 행정 구역)","y":"고려","s":"특수 행정 구역인 소에서 여러 물품이 생산되었다.","d":"고려의 향·부곡·소 가운데 소는 금·은·철·자기·먹 등 국가가 필요로 하는 물품을 생산하던 특수 행정 구역으로, 주민은 일반 군현민보다 차별을 받았다.","u":"고려시대","c":1},{"k":"팔관회","y":"고려","s":"팔관회에 참석하는 외국 사신","d":"팔관회는 개경과 서경에서 열린 고려의 국가적 행사로, 토착 신앙과 불교가 어우러진 축제였으며 송·여진·아라비아 상인까지 참여하는 국제 교류의 장이었다.","u":"고려시대","c":1},{"k":"이자겸의 난","y":"1126","s":"이자겸과 척준경이 군사를 동원하여 궁궐을 침범하였다.","d":"1126년 왕실 외척으로 권력을 잡은 이자겸이 척준경과 함께 난을 일으켰으나, 인종이 척준경을 회유하면서 이자겸은 제거되었다.","u":"고려시대","c":1},{"k":"무신정변","y":"1170","s":"이고와 이의방이 왕의 명령을 위조하여 순검군을 모았다.","d":"1170년 정중부·이의방·이고 등 무신들은 문신 우대에 불만을 품고 보현원에서 정변을 일으켜 문신들을 제거하고 의종을 폐위하였다.","u":"고려시대","c":1},{"k":"망이·망소이의 난","y":"1176","s":"공주 명학소에서 망이·망소이 등이 봉기하였다.","d":"1176년 무신 집권기에 차별받던 공주 명학소의 망이·망소이가 봉기하자, 정부는 명학소를 충순현으로 승격시켜 회유하였다.","u":"고려시대","c":1},{"k":"동명왕편","y":"1193","s":"고구려 시조의 일대기를 서사시로 표현하였다.","d":"이규보가 지은 동명왕편은 고구려 시조 동명왕(주몽)의 일대기를 노래한 영웅 서사시로, 고려인의 고구려 계승 의식을 보여 준다.","u":"고려시대","c":1},{"k":"처인성 전투","y":"1232","s":"김윤후가 처인성 전투에서 활약하였다.","d":"1232년 몽골의 2차 침입 때 승려 김윤후가 처인성에서 적장 살리타를 사살하여 몽골군을 물리쳤다.","u":"고려시대","c":1},{"k":"녹과전","y":"1271","s":"경기 8현에 한정하여 녹과전을 지급하였다.","d":"1271년 원종 때 무신 정권과 몽골 침입으로 전시과가 무너지자, 경기 8현의 토지를 관리에게 녹과전으로 지급하여 녹봉을 보충하였다.","u":"고려시대","c":1},{"k":"삼국유사","y":"1281","s":"고조선의 건국 이야기가 기록되어 있다.","d":"고려 후기 승려 일연이 편찬한 삼국유사는 왕력·기이·흥법 등 9편으로 이루어졌으며, 단군의 고조선 건국 이야기와 향가 14수를 실어 고대 역사와 문화 연구에 큰 가치를 지닌다.","u":"고려시대","c":1},{"k":"이색","y":"고려 말","s":"성균관 대사성이 되어 정몽주 등을 학관으로 천거하였다.","d":"고려 말 성리학자 이색은 성균관 대사성이 되어 정몽주·정도전 등을 학관으로 천거하여 성리학 확산에 기여하였으며, 충남 서천 문헌서원에 배향되었다.","u":"고려시대","c":1},{"k":"과전법","y":"1391","s":"과전법 제정","d":"1391년 공양왕 때 조준 등 신진 사대부의 주도로 과전법을 실시하여 경기 지역 토지의 수조권을 관리에게 지급하고 권문세족의 대농장을 정리하였다. 조선 건국의 경제적 기반이 되었다.","u":"고려시대","c":1},{"k":"청석탑","y":"고려","s":"청석탑은 점판암으로 만든 탑으로 고려 시대에 많이 축조되었다.","d":"고려 시대에는 점판암을 다듬어 만든 청석탑이 유행하였다. 청주에서 발굴된 청석탑은 직지를 간행한 흥덕사지와 가까워 두 유적의 연관성이 주목되고 있다.","u":"고려시대","c":1},{"k":"제1차 왕자의 난","y":"1398","s":"제1차 왕자의 난","d":"1398년 이방원이 정도전 등을 제거하고 세자 방석을 죽인 제1차 왕자의 난을 일으켰으며, 제2차 왕자의 난을 거쳐 태종으로 즉위하였다.","u":"조선시대","c":1},{"k":"집현전과 사가독서","y":"1420","s":"집현전 관리에게 사가독서를 시행하였다.","d":"세종은 집현전을 두어 학문 연구를 장려하고, 젊은 관리에게 휴가를 주어 독서에만 전념하게 하는 사가독서제를 시행하였다. 혜택을 받은 권채 등은 국가 편찬 사업을 주도하였다.","u":"조선시대","c":1},{"k":"삼강행실도","y":"1434","s":"삼강행실도의 서문을 작성하는 등 국가 편찬 사업을 주도하였다.","d":"세종 때 충신·효자·열녀의 행적을 글과 그림으로 엮은 삼강행실도를 편찬하여 유교 윤리를 백성에게 널리 보급하였다.","u":"조선시대","c":1},{"k":"칠정산","y":"1444","s":"한양을 기준으로 한 역법서인 칠정산 내편을 간행하였다.","d":"1444년 세종 때 원의 수시력과 아라비아 회회력을 참고하여 한양을 기준으로 천체 운행을 계산한 역법서 칠정산 내편·외편을 편찬하였다.","u":"조선시대","c":1},{"k":"건주위 정벌","y":"1467","s":"남이 등이 건주위 여진족을 정벌하였다.","d":"1467년 세조 때 남이·강순 등이 명과 함께 압록강 북쪽 건주위의 여진을 정벌하였다.","u":"조선시대","c":1},{"k":"관수관급제","y":"1470","s":"관청에서 세금을 거두어 관리들에게 지급하였다.","d":"1470년 성종 때 직전법의 폐단으로 관리들이 지나치게 거두어 백성이 고통받자, 국가가 직접 세금을 거두어 관리에게 지급하는 관수관급제를 실시하였다.","u":"조선시대","c":1},{"k":"서경권","y":"조선","s":"5품 이하의 관리 임명에 대한 서경권을 행사하였다.","d":"사헌부와 사간원은 양사(대간)로서 5품 이하 관리의 임명에 동의하는 서경권을 행사하여 인사의 공정성을 견제하였다.","u":"조선시대","c":1},{"k":"관찰사","y":"조선","s":"감사 또는 방백이라 불렸다.","d":"각 도에 파견된 관찰사는 감사·방백이라고도 불리며, 수령을 감찰하고 도의 행정·사법·군사권을 행사하였다.","u":"조선시대","c":1},{"k":"사관과 사초","y":"조선","s":"춘추관에 소속되어 사초를 작성하였다.","d":"사관은 춘추관에 소속되어 국왕의 언행과 정사를 사초로 기록하였으며, 이는 실록 편찬의 기본 자료가 되었다.","u":"조선시대","c":1},{"k":"신량역천","y":"조선","s":"신량역천으로 분류되었다.","d":"신분은 양인이지만 천한 역을 담당한 계층을 신량역천이라 하며, 수군·역졸·조례 등이 여기에 속하였다.","u":"조선시대","c":1},{"k":"역관","y":"조선","s":"노걸대 등을 교재로 공부하였다.","d":"역관은 사역원에서 노걸대·박통사 등을 교재로 외국어를 익혀 사신단의 통역을 맡았으며, 중인 신분이지만 무역에 참여해 부를 쌓기도 하였다.","u":"조선시대","c":1},{"k":"예안 향약","y":"1556","s":"예안 향약을 만들어 향촌 교화를 위해 노력하였다.","d":"이황은 예안 향약을, 이이는 해주 향약을 만들어 향촌에 유교 윤리를 보급하고 사림의 향촌 지배를 강화하였다.","u":"조선시대","c":1},{"k":"행주 대첩","y":"1593","s":"권율이 행주산성에서 적군을 격퇴하였다.","d":"1593년 권율은 행주산성에서 관군과 백성이 힘을 합쳐 일본군을 크게 물리쳤으며, 한산도 대첩·진주 대첩과 함께 임진왜란 3대 대첩으로 꼽힌다.","u":"조선시대","c":1},{"k":"광교산 전투","y":"1637","s":"김준룡이 근왕병을 이끌고 광교산에서 항전하였다.","d":"1637년 병자호란 때 전라도 병마절도사 김준룡이 근왕병을 이끌고 광교산에서 청군을 물리쳤으나, 남한산성의 인조는 결국 삼전도에서 항복하였다.","u":"조선시대","c":1},{"k":"예송","y":"1659","s":"자의 대비의 복상 문제로 예송이 일어났다.","d":"현종 때 효종과 효종비가 죽은 뒤 자의 대비의 상복 기간을 두고 서인과 남인이 두 차례 예송을 벌였다. 1659년 기해예송에서는 경국대전에 따라 기년복으로, 1674년 갑인예송에서는 대공복이 아닌 기년복으로 정해져 남인이 우세해졌다.","u":"조선시대","c":2},{"k":"상평통보","y":"1678","s":"상평통보를 사용하는 백성","d":"1678년 숙종 때 상평통보가 법화로 주조·유통되면서 상품 화폐 경제가 발달하였으나, 지주와 부호의 화폐 축적으로 전황이 나타나기도 하였다.","u":"조선시대","c":1},{"k":"초량 왜관","y":"조선 후기","s":"초량 왜관에서 교역하는 상인","d":"조선 후기 부산 초량에 설치된 왜관에서 일본과의 공무역과 사무역이 이루어졌으며, 인삼·은·구리 등이 거래되었다.","u":"조선시대","c":1},{"k":"중강 개시·후시","y":"조선 후기","s":"중강 개시와 중강 후시를 통한 교역이 이루어졌다.","d":"조선 후기 청과의 국경 무역은 공식 시장인 개시와 사적 무역인 후시로 이루어졌으며, 중강·책문 등지에서 만상이 활발히 활동하였다.","u":"조선시대","c":1},{"k":"덕대","y":"조선 후기","s":"광산을 전문적으로 경영하는 덕대가 활동하였다.","d":"조선 후기에는 상인 물주에게 자본을 받아 광산을 전문적으로 경영하는 덕대가 등장하였으며, 몰래 채굴하는 잠채도 성행하였다.","u":"조선시대","c":1},{"k":"전기수","y":"조선 후기","s":"소설을 읽어 주는 전기수","d":"조선 후기에는 한글 소설이 유행하면서 돈을 받고 소설을 읽어 주는 전기수가 등장하였고, 판소리·탈춤과 함께 서민 문화가 발달하였다.","u":"조선시대","c":1},{"k":"정감록","y":"조선 후기","s":"왕조 교체를 예언하는 정감록이 유포되었다.","d":"조선 후기 사회 불안 속에서 이씨 왕조가 망하고 정씨가 새 왕조를 연다는 정감록 등 예언 사상과 미륵 신앙이 널리 퍼졌다.","u":"조선시대","c":1},{"k":"이인좌의 난","y":"1728","s":"이인좌를 중심으로 소론 세력 등이 난을 일으켰다.","d":"1728년 영조의 즉위에 반발한 이인좌 등 소론·남인 강경파가 청주에서 난을 일으켰으며, 진압 후 영조는 탕평책을 더욱 강화하였다.","u":"조선시대","c":1},{"k":"청계천 준설","y":"1760","s":"홍수 예방 등을 위해 준천 사업을 시행하였다.","d":"영조는 홍수 피해를 막기 위해 청계천을 준설하는 준천 사업을 벌였고, 균역법을 실시해 군포를 2필에서 1필로 줄여 백성의 부담을 덜었다.","u":"조선시대","c":1},{"k":"을병연행록","y":"1766","s":"연행사의 일원으로 청에 다녀온 뒤 한글로 기록한 견문록","d":"홍대용은 1765년 연행사의 일원으로 청에 다녀와 한글 견문록 을병연행록을 남겼으며, 서양 선교사·청 지식인과 교유한 내용을 담았다.","u":"조선시대","c":1},{"k":"서얼 통청 운동","y":"조선 후기","s":"서얼이 통청 운동을 전개하였다.","d":"조선 후기 서얼들은 청요직 진출을 허용해 달라는 통청 운동을 전개하였고, 정조 때 유득공·박제가 등이 규장각 검서관으로 등용되었다.","u":"조선시대","c":1},{"k":"내각일력","y":"정조","s":"업무 일지인 내각일력을 작성하였다.","d":"정조가 세운 규장각은 내각이라 불리며 업무 일지인 내각일력을 남겼고, 초계문신제를 운영하며 개혁 정치의 중심 기구가 되었다.","u":"조선시대","c":1},{"k":"무예도보통지","y":"1790","s":"무예도보통지를 훈련 교범으로 사용하였다.","d":"정조 때 이덕무·박제가·백동수가 편찬한 무예도보통지는 24가지 무예를 그림과 함께 설명한 종합 무예서로, 장용영의 훈련 교범이 되었다.","u":"조선시대","c":1},{"k":"황사영 백서","y":"1801","s":"황사영이 외국 군대의 출병을 요청하는 원인이 되었다.","d":"1801년 신유박해가 일어나자 황사영이 베이징 주교에게 군대 파병을 요청하는 백서를 보내려다 발각되어 천주교 탄압이 한층 강화되었다.","u":"조선시대","c":1},{"k":"홍경래의 난","y":"1811","s":"홍경래, 우군칙 등이 주도하였다.","d":"1811년 서북민에 대한 차별과 세도 정치의 수탈에 반발해 홍경래·우군칙 등이 봉기하여 청천강 이북을 장악하였으나 정주성에서 관군에게 진압되었다.","u":"조선시대","c":1},{"k":"지구전요","y":"1857","s":"자연 현상과 세계 지리를 상술한 지구전요를 집필하였다.","d":"19세기 실학자 최한기는 세계 지리와 서양 과학을 정리한 지구전요를 저술하여 서양 문물의 수용을 주장하였다.","u":"조선시대","c":1},{"k":"안핵사 박규수","y":"1862","s":"사건의 수습을 위해 박규수가 안핵사로 파견되었다.","d":"1862년 임술 농민 봉기가 일어나자 정부는 박규수를 안핵사로 파견하고 삼정이정청을 설치하였으나 근본적인 개혁에는 이르지 못하였다.","u":"조선시대","c":1},{"k":"원산 학사","y":"1883","s":"함경도 덕원 지방의 관민들이 원산 학사를 설립하였다.","d":"1883년 함경도 덕원부의 관민이 세운 원산 학사는 우리나라 최초의 근대적 사립 학교로 근대 학문과 무술을 함께 가르쳤다.","u":"개화기","c":1},{"k":"방곡령","y":"1889","s":"함경도와 황해도에서 방곡령이 선포되었다.","d":"1889년 일본으로 곡물이 대량 유출되어 곡가가 폭등하자 함경도·황해도 관찰사가 방곡령을 내렸으나, 일본의 항의로 철회하고 배상금까지 지불하였다.","u":"개화기","c":1},{"k":"단발령","y":"1895","s":"단발하는 문제는 편한 대로 하게 허락한 만큼","d":"1895년 을미개혁으로 단발령이 시행되고 을미사변이 겹치면서 유생과 백성이 을미의병을 일으켰으며, 아관 파천 이후 단발령은 철회되었다.","u":"개화기","c":1},{"k":"한성 사범 학교","y":"1895","s":"한성 사범 학교 관제가 반포되었다.","d":"1895년 교육입국조서에 따라 한성 사범 학교 관제가 반포되어 근대적인 교원 양성이 시작되었다.","u":"개화기","c":1},{"k":"여권통문","y":"1898","s":"여권통문이 황성신문에 게재되었다.","d":"1898년 서울 북촌의 부인들이 여성의 교육권·직업권·참정권을 주장한 여권통문을 발표하여 황성신문 등에 실렸고, 이는 순성 여학교 설립으로 이어졌다.","u":"개화기","c":1},{"k":"제국신문","y":"1898","s":"한글 신문인 제국신문을 간행하였다.","d":"1898년 창간된 제국신문은 순한글로 발행되어 서민층과 부녀자를 주 독자로 삼았으며, 같은 해 창간된 황성신문은 국한문 혼용으로 유생층을 대상으로 하였다.","u":"개화기","c":1},{"k":"대한국 국제","y":"1899","s":"전제 군주제를 명문화한 대한국 국제를 반포하였다.","d":"1899년 대한 제국은 황제에게 무한한 군권이 있음을 규정한 대한국 국제를 반포하여 전제 군주제를 명문화하였다.","u":"개화기","c":1},{"k":"대한 천일 은행","y":"1899","s":"대한 천일 은행이 설립되는 계기가 되었다.","d":"1899년 민족 자본으로 대한 천일 은행이 설립되어 상업 자금을 공급하였다.","u":"개화기","c":1},{"k":"운산 금광 채굴권","y":"1896","s":"운산 금광 채굴권을 차지하였다.","d":"아관 파천 이후 열강의 이권 침탈이 심해져 미국은 운산 금광 채굴권, 러시아는 삼림 채벌권, 일본은 철도 부설권 등을 차지하였다.","u":"개화기","c":1},{"k":"이범윤 간도 관리사","y":"1902","s":"이범윤을 간도 관리사로 파견하였다.","d":"1902년 대한 제국은 간도 지역 한인을 보호하기 위해 이범윤을 간도 관리사로 파견하였으나, 1909년 간도 협약으로 간도가 청의 영토로 넘어갔다.","u":"개화기","c":1},{"k":"용암포 사건","y":"1903","s":"용암포 조차를 요구하였다.","d":"1903년 러시아가 압록강 하구의 용암포를 점령하고 조차를 요구하면서 러시아와 일본의 대립이 격화되어 러일 전쟁의 배경이 되었다.","u":"개화기","c":1},{"k":"한일 의정서","y":"1904","s":"군사 전략상 필요한 지점을 정황에 따라 차지하여 이용할 수 있다","d":"1904년 러일 전쟁이 일어나자 일본은 한일 의정서를 강요하여 대한 제국의 중립 선언을 무시하고 군사 전략상 필요한 지역을 마음대로 쓸 수 있게 하였다.","u":"개화기","c":1},{"k":"농광 회사","y":"1904","s":"일본의 토지 침탈에 맞서 농광 회사가 설립되었다.","d":"1904년 일본이 황무지 개간권을 요구하자 이에 맞서 우리 손으로 개간하려는 농광 회사가 설립되었고, 보안회의 반대 운동으로 일본의 요구는 철회되었다.","u":"개화기","c":1},{"k":"을사늑약","y":"1905","s":"외교권을 박탈하고 통감부를 설치하였다.","d":"1905년 일본은 을사늑약을 강제하여 대한 제국의 외교권을 빼앗고 통감부를 설치하였으며, 이에 민영환의 자결과 을사의병, 헤이그 특사 파견 등 저항이 이어졌다.","u":"개화기","c":1},{"k":"화폐 정리 사업","y":"1905","s":"화폐 정리 사업이 실시되었다.","d":"1905년 재정 고문 메가타의 주도로 백동화를 일본 제일은행권으로 바꾸는 화폐 정리 사업이 시행되어 국내 상인과 은행이 큰 타격을 입었다.","u":"개화기","c":1},{"k":"군대 해산","y":"1907","s":"대한 제국 군대가 해산되었다.","d":"1907년 한일 신협약의 부속 각서에 따라 대한 제국 군대가 해산되자 해산 군인들이 의병에 합류하여 정미의병이 의병 전쟁으로 확대되었다.","u":"개화기","c":1},{"k":"국문 연구소","y":"1907","s":"국문 연구소를 두어 한글을 체계적으로 연구하였다.","d":"1907년 학부 안에 국문 연구소가 설치되어 주시경·지석영 등이 한글의 문자 체계와 표기법을 연구하였다.","u":"개화기","c":1},{"k":"신문지법","y":"1907","s":"신문지법이 제정되었다.","d":"1907년 통감부는 신문지법을 제정하여 신문의 사전 검열과 발행 정지를 가능하게 하고 언론을 탄압하였다.","u":"개화기","c":1},{"k":"일진회 합방 청원","y":"1909","s":"일진회가 합방 청원서를 제출하였다.","d":"친일 단체 일진회는 1909년 한일 합방을 요구하는 청원서를 제출하여 국권 피탈에 앞장섰다.","u":"개화기","c":1},{"k":"덕수궁 석조전","y":"1910","s":"덕수궁 석조전 신축 공사에 참여하는 일꾼","d":"덕수궁 석조전은 1900년 착공되어 1910년 완공된 서양식 석조 건물로, 광복 후 미소 공동 위원회가 열린 장소이기도 하다.","u":"개화기","c":1},{"k":"위화부","y":"581","s":"위화부, 영객부 등의 관청이 있었다.","d":"위화부는 신라 진평왕 3년(581)에 설치된 관리 인사 담당 관청으로, 고려의 이부·조선의 이조에 해당하는 기능을 하였다. 사신 접대와 외교를 맡은 영객부 등과 함께 신라의 14관부를 이루었다. 발해의 정당성 아래 둔 6부(충·인·의·지·예·신부)와 혼동하지 않도록 주의해야 한다.","u":"삼국시대","c":1},{"k":"웅진 천도","y":"475","s":"수도를 웅진으로 옮겼다.","d":"475년 고구려 장수왕의 남진으로 한성이 함락되고 개로왕이 전사하자, 뒤를 이은 문주왕이 수도를 웅진(지금의 공주)으로 옮겼다. 이후 538년 성왕이 다시 사비(부여)로 천도하였으므로, 웅진 천도(475, 문주왕)와 사비 천도(538, 성왕)를 반드시 구분해야 한다.","u":"삼국시대","c":1},{"k":"백가의 난","y":"501","s":"백가의 난을 평정하였다.","d":"501년 위사좌평 백가가 보낸 자객에게 동성왕이 시해당하고, 백가가 가림성에 웅거해 반란을 일으키자 뒤를 이어 즉위한 무령왕이 이를 평정하였다. 무령왕은 이후 22담로에 왕족을 파견해 지방 통제를 강화하고 중국 남조 양과 교류하였다. 무령왕릉이 남조의 영향을 받은 벽돌무덤(전축분)이라는 점도 함께 출제된다.","u":"삼국시대","c":1},{"k":"도살성 전투","y":"550","s":"달기를 보내 고구려의 도살성을 점령하였다.","d":"550년 백제 성왕이 장군 달기(달이)를 보내 고구려의 도살성을 함락시켰고, 고구려는 맞서 백제의 금현성을 빼앗았다. 그러나 두 나라가 지친 틈을 타 신라 진흥왕이 이사부를 보내 두 성을 모두 차지하였다. 이 사건은 551년 나제 연합의 한강 유역 공격, 553년 신라의 한강 하류 점령, 554년 관산성 전투로 이어지는 흐름의 출발점이다.","u":"삼국시대","c":1},{"k":"누각박사","y":"718","s":"물시계인 누각을 만들고 누각박사를 두어 시간을 측정하였다.","d":"신라 성덕왕 17년(718)에 물시계인 누각을 처음 만들고 이를 관리하는 누각전을 설치하였으며, 경덕왕 8년(749)에는 천문박사와 함께 누각박사 6인을 두어 시간을 측정하게 하였다. 천문 관측과 시간 측정을 국가가 직접 관장했음을 보여 주는 사례다. 조선 세종 대의 자격루·앙부일구와 시대를 혼동하지 않아야 한다.","u":"삼국시대","c":1},{"k":"쌍영총","y":"5세기","s":"쌍영총 벽화 속 공양 행렬이 그려져 있다.","d":"쌍영총은 평안남도 용강(현 남포)에 있는 5세기 후반 고구려의 굴식 돌방무덤으로, 널방 앞에 세운 두 개의 팔각 돌기둥에서 이름이 유래하였다. 벽화에 불교식 공양 행렬도와 기마 인물, 우교차도 등이 그려져 있어 불교 수용과 귀족 생활을 보여 준다. 벽화가 남는 것은 굴식 돌방무덤이며 돌무지무덤인 장군총에는 벽화가 없다는 점을 구분해야 한다.","u":"삼국시대","c":1},{"k":"좌관대식기","y":"618","s":"관청에서 곡식을 빌리고 갚은 사람들의 이름과 곡식의 양이 기록되어 있다.","d":"좌관대식기는 충남 부여 쌍북리에서 출토된 백제 목간으로, 무인년(618년, 무왕 대)에 관청이 백성에게 곡식을 빌려주고 이자를 붙여 돌려받은 내역을 이름과 수량까지 기록하였다. 백제에도 국가가 곡식을 대여하는 진대 제도가 운영되었음을 보여 주는 1차 사료다. 고구려 고국천왕의 진대법(194년)과 주체를 혼동하지 않도록 주의해야 한다.","u":"삼국시대","c":1},{"k":"대가야 병합","y":"562","s":"진흥왕이 대가야를 병합하였다.","d":"562년 신라 진흥왕이 이사부와 사다함을 보내 고령의 대가야를 정복하면서 가야 연맹이 완전히 소멸하였다. 앞서 법흥왕은 532년 김해의 금관가야를 병합하였으므로, 금관가야 멸망(532·법흥왕)과 대가야 멸망(562·진흥왕)을 반드시 구분해야 한다.","u":"삼국시대","c":1},{"k":"정효공주 묘","y":"793","s":"효의황후와 순목황후의 묘지에 독자적인 연호가 기록되어 있다.","d":"정효공주는 발해 문왕의 넷째 딸로 792년 사망해 이듬해 지린성 화룡 용두산에 묻혔으며, 묘지석에서 문왕을 '황상'이라 부르고 대흥 연호를 써서 발해의 황제국 의식을 보여 준다. 무덤은 당의 벽돌무덤 양식에 고구려식 평행고임 천장을 결합했고 인물 벽화가 남아 있다. 같은 고분군에서 나온 효의황후·순목황후 묘지에도 독자적 연호가 기록되어 있으며, 굴식 돌방무덤에 모줄임천장을 쓴 정혜공주 묘(돌사자상 출토)와 구분해야 한다.","u":"삼국시대","c":1},{"k":"대공의 난","y":"768","s":"각간 대공이 반란을 일으켰다.","d":"768년 신라 혜공왕 때 각간 대공이 동생 대렴과 함께 반란을 일으켰고, 이것이 전국 진골 귀족의 싸움으로 번져 '96각간의 난'이라 불렸다. 이후 780년 김지정의 난 와중에 혜공왕이 피살되면서 무열왕계 왕통이 끊기고 신라 하대가 시작되었다. 헌덕왕 때의 김헌창의 난(822)과 시기를 혼동하지 않아야 한다.","u":"삼국시대","c":1},{"k":"고창 전투","y":"930","s":"김선평, 권행 등이 고창 전투에서 활약하였다.","d":"930년 고려 태조 왕건이 고창(지금의 안동)에서 후백제 견훤군을 크게 물리쳤고, 이때 김선평·권행·장길(장정필)이 공을 세워 안동 삼태사로 불렸다. 927년 공산 전투 패배를 뒤집은 승리로 경상도 일대의 주도권이 고려로 넘어갔다. 이후 935년 신라 항복, 936년 일리천 전투로 후삼국이 통일되는 흐름으로 이어진다.","u":"삼국시대","c":1},{"k":"천문령 전투","y":"698","s":"대조영이 천문령에서 당의 군대를 격파하였다.","d":"698년 대조영이 고구려 유민과 말갈인을 이끌고 천문령에서 이해고가 지휘하는 당군을 격파하였다. 이 승리를 바탕으로 동모산에 도읍을 정하고 진(震)국, 곧 발해를 세웠다. 696년 거란인 이진충의 난을 틈타 영주를 탈출한 뒤 벌어진 일이라는 순서를 함께 기억해야 한다.","u":"삼국시대","c":1},{"k":"양규","y":"1010","s":"양규가 곽주성을 급습하여 탈환하였다.","d":"1010년 강조의 정변을 구실로 거란 성종이 40만 대군을 이끌고 침입하자(2차 침입), 흥화진을 지키던 양규가 분전하고 곽주성을 급습해 탈환하며 포로를 구출했다. 이때 현종은 나주까지 피란하였다. 3차 침입 때 강감찬의 귀주 대첩(1019)과는 시기와 인물이 다릅니다.","u":"고려시대","c":1},{"k":"속현","y":"고려","s":"지방관이 파견된 주현과 파견되지 않은 속현이 있었어요.","d":"고려는 전국을 5도 양계로 나누고 그 아래 주·군·현을 두었는데, 지방관이 파견된 주현보다 파견되지 않은 속현의 수가 더 많았다. 속현과 향·부곡·소의 실제 행정 실무는 그 지역 향리가 담당했다. 모든 군현에 수령을 파견한 조선과 대비되는 고려 지방 제도의 특징이다.","u":"고려시대","c":1},{"k":"사원 수공업","y":"고려","s":"사원 수공업이 발달하였다.","d":"고려 전기의 수공업은 관청 수공업과 소(所) 수공업이 중심이었고, 사원에서 승려와 노비가 베·모시·기와·술·소금 등을 생산하는 사원 수공업도 이루어졌다. 넓은 토지와 노동력을 지닌 사원이 생산과 판매를 겸하면서, 특히 고려 후기에 사원 수공업과 민간 수공업의 비중이 커졌다. 민영 수공업이 주류가 되는 조선 후기와는 구분해야 한다.","u":"고려시대","c":1},{"k":"다점·주점","y":"고려","s":"다점, 주점 등 관영 상점이 운영되었다.","d":"고려는 개경·서경·동경 등 대도시에 서적점, 약점, 주점, 다점 같은 관영 상점을 두어 물품을 팔고 화폐 사용을 유도하였다. 특히 숙종 때에는 의천의 건의로 주전도감을 설치해 해동통보 등을 발행하면서 관영 상점을 늘렸다. 조선 후기의 사상(私商)·객주와는 성격이 다른 관 주도 상업 시설이다.","u":"고려시대","c":1},{"k":"칭제 건원","y":"1135","s":"칭제 건원과 금국 정벌을 주장하였다.","d":"1135년 묘청·정지상 등 서경 세력은 풍수지리설을 내세워 서경 천도와 함께 칭제 건원(황제 칭호와 독자 연호 사용), 금국 정벌을 주장하였다. 인종이 천도를 미루자 국호를 대위, 연호를 천개라 하며 반란을 일으켰으나 김부식의 관군에게 진압되었다. 신채호가 '조선 역사상 일천년래 제일대사건'이라 평한 사건이다.","u":"고려시대","c":1},{"k":"교정별감","y":"1209","s":"교정별감이 되어 국정을 장악하였다.","d":"1209년 최충헌은 자신을 제거하려는 모의를 계기로 교정도감을 설치하고, 그 최고 책임자인 교정별감이 되어 국정을 장악하였다. 교정도감은 감찰·인사·조세 징수까지 관장한 최씨 정권의 최고 권력 기구로, 이후 집권자에게 세습되었다. 최우가 설치한 정방(인사)·서방(문신 자문)과 구별해야 한다.","u":"고려시대","c":1},{"k":"송문주","y":"1236","s":"송문주가 죽주성에서 적군을 격퇴하였다.","d":"1236년 몽골의 3차 침입 때 죽주방호별감 송문주가 죽주성에서 몽골군의 공격을 십여 일간 막아내고 격퇴하였다. 그는 앞서 귀주성 전투를 경험하여 적의 공성 전술을 미리 간파했다고 전한다. 처인성에서 살리타를 사살한 김윤후(1232), 충주성 전투(1253)와 혼동하지 않아야 한다.","u":"고려시대","c":1},{"k":"향약구급방","y":"1236","s":"질병에 대한 처방 등을 소개한 향약구급방이 편찬되었다.","d":"향약구급방은 1236년경 강화도 대장도감에서 간행된 것으로 알려진, 현존하는 우리나라 최고(最古)의 의학 서적이다. 우리 땅에서 나는 약재(향약)로 각종 질병을 치료하는 처방을 정리하였다. 조선 세종 때의 향약집성방·의방유취와 이름이 비슷하므로 시대를 구분해 기억해야 한다.","u":"고려시대","c":1},{"k":"배중손","y":"1270","s":"배중손이 진도 용장성에서 항전하였다.","d":"1270년 개경 환도가 결정되자 배중손은 삼별초를 이끌고 왕족 승화후 온을 왕으로 추대하며 강화도에서 봉기한 뒤 진도 용장성으로 근거지를 옮겨 항전하였다. 1271년 여몽 연합군에게 진도가 함락되자 김통정이 남은 세력을 이끌고 제주 항파두리로 옮겨 1273년까지 저항했다. 삼별초는 최우가 설치한 야별초에서 비롯된 부대이다.","u":"고려시대","c":1},{"k":"김방경","y":"1274","s":"김방경이 이끄는 군대가 일본 원정에 참여하였다.","d":"원의 강요로 고려는 일본 원정에 동원되어, 1274년(충렬왕 즉위년) 김방경이 고려군을 이끌고 여몽 연합군의 1차 일본 원정에 참여하였고 1281년 2차 원정에도 나섰다. 원은 2차 원정을 준비하며 1280년 정동행성을 설치하였는데, 원정이 실패한 뒤에도 이 기구는 남아 내정 간섭에 이용되었다. 김방경은 앞서 삼별초 진압에도 참여한 인물이다.","u":"고려시대","c":1},{"k":"홍산 대첩","y":"1376","s":"최영이 홍산 전투에서 큰 승리를 거두었다.","d":"1376년(우왕 2) 최영이 충청도 홍산(지금의 부여)에서 왜구를 크게 무찌른 전투가 홍산 대첩이다. 고려 말 왜구 격퇴전 가운데 대표적 승리로 꼽힙니다. 최무선의 진포 대첩(1380), 이성계의 황산 대첩(1380), 정지의 관음포 대첩(1383)과 장수·지역을 구분해 외워야 한다.","u":"고려시대","c":1},{"k":"화통도감","y":"1377","s":"화통도감의 설치를 건의하였다.","d":"1377년 최무선의 건의로 화약과 화포를 제조하는 관청인 화통도감이 설치되었다. 최무선은 원의 이원에게서 화약 제조법을 배워 염초 제조에 성공했고, 여기서 만든 화포로 1380년 진포에서 왜구 선단을 격파하였다. 조선 세종 때의 신기전·총통등록과는 시대가 다릅니다.","u":"고려시대","c":1},{"k":"박위의 대마도 정벌","y":"1389","s":"박위가 적의 근거지를 토벌하였다.","d":"1389년(창왕 1) 박위가 병선 100척을 이끌고 왜구의 소굴인 쓰시마섬(대마도)을 정벌하여 적선을 불태우고 포로를 구출하였다. 고려 말 왜구 근거지를 직접 공격한 사례이다. 1419년 세종 때 이종무의 기해동정(대마도 정벌)과 시기·인물을 반드시 구분해야 한다.","u":"고려시대","c":1},{"k":"구황촬요","y":"1554","s":"구황촬요를 읽고 있는 지방관","d":"1554년(명종 9) 왕명으로 편찬되어 진휼청에서 간행한 구황서로, 굶주린 백성을 살리는 구급법과 대용 식물 조제법 등을 한글로 언해해 각 지방에 배포하여 수령이 진휼 행정에 활용하게 하였다. 세종 대 『구황벽곡방』에서 요긴한 내용을 뽑아 실용화한 것이 특징이다. 조선 후기 고구마·감자 같은 구황작물 보급과는 시기와 성격이 다르므로 구분해야 한다.","u":"조선시대","c":1},{"k":"세책가","y":"조선 후기","s":"세책가에서 춘향전을 빌리는 부녀자","d":"조선 후기(18~19세기) 돈을 받고 소설책을 빌려주던 책 대여점으로, 『춘향전』·『홍길동전』 같은 한글 소설이 널리 읽히는 기반이 되었다. 소설을 전문적으로 읽어 주던 전기수, 방각본 출판과 함께 서민 문화 발달을 보여 주는 지표이다. 조선 전기가 아니라 후기의 문화 현상이라는 점이 시험의 핵심 포인트다.","u":"조선시대","c":1},{"k":"이징옥의 난","y":"1453","s":"이징옥이 함길도에서 반란을 일으켰다.","d":"1453년(단종 1) 계유정난으로 권력을 잡은 수양대군이 김종서의 일파로 지목된 함길도 도절제사 이징옥을 파직하고 박호문을 후임으로 보내자, 이징옥이 박호문을 죽이고 일으킨 반란이다. 종성에서 스스로 대금 황제를 칭하며 여진과 연결하려 했으나 부하들에게 살해되어 곧 진압되었다. 세조 즉위 후 일어난 이시애의 난(1467)과 시기·주체가 다르므로 혼동하지 말아야 한다.","u":"조선시대","c":1},{"k":"금성대군","y":"1457","s":"금성대군이 사육신과 함께 단종의 복위를 추진하다 순흥에 유배되었다.","d":"세종과 소헌왕후의 여섯째 아들 금성대군은 조카 단종을 지키려다 세조에 의해 유배되었고, 경상도 순흥에서 부사 이보흠과 함께 단종 복위를 도모하다 발각되어 1457년 사사되었다. 이 사건을 계기로 노산군으로 강등되어 영월에 있던 단종도 죽임을 당하였다. 성삼문 등 사육신의 복위 시도는 1456년 한양에서 별도로 일어난 사건이므로, 금성대군이 사육신과 함께 거사했다는 서술은 사실과 다르다.","u":"조선시대","c":1},{"k":"위훈 삭제","y":"1519","s":"위훈 삭제를 주장한 조광조 일파가 제거되었다.","d":"중종반정 공신 가운데 공이 없는 자의 훈작을 삭탈하자는 조광조 일파의 주장으로, 1519년(중종 14) 훈구 세력의 반발을 불러 기묘사화의 직접적 계기가 되었다. 조광조는 이 밖에 현량과 실시, 소격서 폐지, 향약 보급 등 급진적 개혁을 추진하였다. 무오·갑자사화(연산군), 을사사화(명종)와 원인이 다르니 사화별 배경을 구분해 두어야 한다.","u":"조선시대","c":1},{"k":"정여립 모반 사건","y":"1589","s":"정여립 모반 사건을 계기로 기축옥사가 발생하였다.","d":"1589년(선조 22) 전주 출신 정여립이 대동계를 조직해 모반을 꾀했다는 고변으로 시작된 사건으로, 이를 처리하는 과정에서 동인이 대거 숙청된 기축옥사가 일어났다. 서인 정철이 위관을 맡아 국문을 주도하였고, 이후 정철의 건저의 사건 처리를 둘러싸고 동인이 남인과 북인으로 분화하였다. 송시열의 기축봉사(1649)와 이름만 비슷할 뿐 전혀 다른 사건이다.","u":"조선시대","c":1},{"k":"한성부","y":"1395","s":"수도의 행정과 치안을 담당하였다.","d":"조선의 수도 한성의 행정과 치안을 담당한 관청으로, 1394년 한양 천도 후 1395년 한양부를 한성부로 고쳐 정비하였으며 장관은 정2품 판윤이었다. 사헌부·형조와 함께 삼법사로 불리며 소송과 검시 등 사법 업무도 맡았다. 국왕 직속 특별 사법 기관인 의금부, 야간 순찰과 도적 체포를 맡은 포도청과 기능을 구분해야 한다.","u":"조선시대","c":1},{"k":"관상감","y":"1466","s":"천문, 지리, 기후 등에 관한 사무를 맡았다.","d":"천문·지리·역수·점산·측후·각루 등에 관한 일을 담당한 관청으로, 고려 이래의 서운관을 이어받아 1466년(세조 12) 관상감으로 개칭되었다. 여기 소속 관원들이 『칠정산』 계승과 천문 관측, 역서 편찬 등을 수행하였다. 외국어 통역의 사역원, 역사 편찬의 춘추관, 서적 간행의 교서관과 업무를 구별하는 문제가 자주 출제된다.","u":"조선시대","c":1},{"k":"해동제국기","y":"1471","s":"일본에 건너가 산천·관제·풍속 등을 두루 알아서 해동제국기를 지어 올렸다.","d":"신숙주가 1443년(세종 25) 통신사의 서장관으로 일본에 다녀온 경험을 바탕으로, 성종의 명을 받아 1471년(성종 2) 편찬한 일본·류큐 견문록이다. 일본의 지세와 국정, 교빙 왕래의 연혁, 사신 접대 절목 등을 지도와 함께 정리하여 대일 외교의 지침서가 되었다. 조선 전기 대일 관계 자료로, 조선 후기 통신사 기록인 『해유록』(신유한)과 구분해야 한다.","u":"조선시대","c":1},{"k":"백운동 서원","y":"1543","s":"최초의 서원인 백운동 서원을 건립하였다.","d":"1543년(중종 38) 풍기 군수 주세붕이 고려의 성리학자 안향을 제사하고 유생을 가르치기 위해 세운 우리나라 최초의 서원이다. 이후 풍기 군수로 부임한 이황의 건의로 1550년(명종 5) 소수서원이라는 편액과 토지·노비를 받아 최초의 사액 서원이 되었다. '최초 건립=주세붕, 최초 사액=이황의 건의'로 주체를 나누어 기억해야 한다.","u":"조선시대","c":1},{"k":"기축봉사","y":"1649","s":"기축봉사를 올려 명에 대한 의리를 내세웠다.","d":"1649년(효종 즉위년) 송시열이 효종에게 올린 13개 조목의 상소로, 명에 대한 의리를 지키고 청에 복수해야 한다는 존주대의와 북벌론을 내세웠다. 이는 효종 대 북벌 추진의 사상적 뒷받침이 되었으며, 송시열은 서인 노론의 영수로 예송 논쟁에서도 중심에 섰다. 선조 대 정여립 사건에서 비롯된 기축옥사(1589)와 이름이 비슷해 혼동하기 쉽다.","u":"조선시대","c":1},{"k":"가례집람","y":"1599","s":"가례집람을 지어 예학을 조선의 현실에 맞게 정리하였다.","d":"예학의 대가 김장생이 주자의 『가례』를 여러 학설로 고증·보완하여 조선의 현실에 맞게 정리한 책으로, 1599년(선조 32)에 완성되어 조선 예학을 체계화한 대표 저술로 꼽힌다. 김장생의 학문은 아들 김집과 문인 송시열·송준길에게 이어져 서인 노론 학맥의 기반이 되었고, 현종 대 예송 논쟁의 이론적 배경이 되었다. 남인 계열 정구의 예학 저술과 학맥이 다르다는 점에 유의해야 한다.","u":"조선시대","c":1},{"k":"정봉수","y":"1627","s":"정봉수가 용골산성에서 항쟁하였다.","d":"1627년 정묘호란 때 정봉수가 평안도 철산의 용골산성에서 의병을 이끌고 후금군에 맞서 싸워 큰 전과를 올렸다. 같은 전쟁에서 이립은 의주에서 항전하였고, 전쟁은 후금과 형제 관계를 맺는 정묘약조로 마무리되었다. 병자호란(1636) 때의 임경업(백마산성)·김준룡(광교산)과 전쟁을 구분해야 한다.","u":"조선시대","c":1},{"k":"연잉군 왕세제 책봉","y":"1721","s":"연잉군을 왕세제로 책봉하였다.","d":"1721년(경종 1) 후사가 없던 경종의 뒤를 잇도록 노론이 주도해 이복동생 연잉군(뒷날 영조)을 왕세제로 책봉하고 대리청정까지 요구하였다. 이에 소론이 반발하면서 노론 4대신이 축출·처형된 신축·임인옥사, 곧 신임사화가 일어났다. 왕세'자'가 아니라 왕세'제'라는 점과, 영조 즉위 후 이 사건이 탕평책과 이인좌의 난(1728)의 배경이 되었다는 흐름이 중요하다.","u":"조선시대","c":1},{"k":"탕평 교서","y":"1725","s":"탕평 교서를 반포하고 탕평비를 건립하였다.","d":"영조는 즉위 직후인 1725년(영조 1) 붕당의 폐단을 지적하는 탕평 교서를 반포하고, 1742년에는 성균관 입구에 탕평비를 세워 탕평의 뜻을 널리 알렸다. 이와 함께 이조 전랑의 후임 천거권·통청권 혁파, 서원 정리, 균역법 시행 등을 추진하였다. 온건파를 고루 등용한 영조의 완론 탕평과, 의리와 시비를 가려 인재를 쓴 정조의 준론 탕평을 구분해야 한다.","u":"조선시대","c":1},{"k":"배다리","y":"1789","s":"왕이 아버지 사도세자의 묘소를 수원으로 옮겨 현륭원을 조성할 때 배다리가 만들어졌다.","d":"정조는 1789년 아버지 사도세자의 묘를 양주 배봉산에서 수원 화산으로 옮겨 현륭원을 조성하였고, 이때 한강을 건너기 위해 배를 잇대어 만든 배다리(주교)를 놓았다. 이듬해 이를 관리할 주교사를 설치하였으며 정약용이 설계에 참여한 것으로 전해진다. 1794~1796년의 화성 축조·을묘년 원행과 이어지는 정조 대 사업이라는 점을 함께 기억하면 좋다.","u":"조선시대","c":1},{"k":"십전통보","y":"조선 후기","s":"십전통보를 만들어 상평통보와 함께 유통시키면 편리할 것입니다.","d":"십전통보는 1651년(효종 2) 김육의 건의로 주조된 고액전으로, 상평통보 1문전 열 개에 해당하는 가치를 매겨 동전 휴대의 불편을 덜고자 하였으나 재료 부족과 화폐 인식 미비로 1656년 유통이 중단되었다. 이후 1678년(숙종 4) 상평통보가 법화로 전국에 유통되면서 상품 화폐 경제가 발달하는 한편, 지주·대상인의 화폐 축적으로 시중에 돈이 부족해지는 전황이 나타났다. 흥선대원군이 경복궁 중건 비용 마련을 위해 발행한 고액전 당백전(1866)과는 시기와 목적이 다르다.","u":"조선시대","c":1},{"k":"보부상","y":"조선 후기","s":"보부상이 장시를 돌아다니며 상품을 판매하였다.","d":"보부상은 봇짐장수(보상)와 등짐장수(부상)를 아울러 이르는 행상으로, 전국의 장시를 돌며 물품을 유통시키고 장시를 하나의 시장권으로 연결하였다. 조선 후기 대동법 시행과 상품 화폐 경제 발달로 장시가 전국적으로 확대되면서 이들의 활동도 활발해졌고, 접장·임소 등 자체 조직을 갖추고 있었다. 개항 이후에는 혜상공국(1883)에 편제되고 황국협회와 연결되는데, 이는 근대 시기의 사실이므로 구분해야 한다.","u":"조선시대","c":1},{"k":"설점수세제","y":"1651","s":"설점수세제의 시행으로 민간의 광산 개발이 허용되었다.","d":"1651년(효종 2) 호조가 채택한 광업 정책으로, 정부가 민간의 광산 개발을 허용하고 그 대가로 세금을 거두었으며 별장을 파견해 수세를 관장하게 하였다. 이로써 민간의 광산 개발이 활발해져 물주가 자본을 대고 덕대가 채굴을 맡는 경영 형태가 나타났고, 몰래 캐는 잠채도 성행하였다. 1775년(영조 51) 별장제가 폐지되고 수령이 세금을 거두는 수령수세제로 바뀌었다는 점까지 함께 알아 두어야 한다.","u":"조선시대","c":1},{"k":"불이선란도","y":"19세기","s":"제주 유배 시절을 견뎌내며 추사체라는 독창적 서체를 남겼다.","d":"불이선란도(부작란도)는 추사 김정희가 만년에 그린 대표적 문인화로, 간결한 난초와 화면을 채운 제발 글씨가 어우러진 작품이며 북청 유배에서 풀려난 뒤 과천에 머물던 1850년대 중반의 작품으로 추정된다. 김정희는 1840~1848년 제주도 유배 생활을 견디며 추사체라는 독창적 서체를 완성하였고, 이 시기 제자 이상적에게 세한도를 그려 주었다. 북한산비가 진흥왕 순수비임을 고증한 『금석과안록』도 그의 업적이므로 함께 정리해 두면 좋다.","u":"조선시대","c":1},{"k":"향전","y":"조선 후기","s":"향전은 통렬히 금해야 할 일이다. 구향과 신향을 막론하고…","d":"조선 후기 향촌 사회에서 기존 양반 사족인 구향과, 부를 축적해 새로 신분을 상승시킨 신향이 향촌의 주도권을 놓고 벌인 다툼을 말한다. 신향은 수령·향리와 결탁해 향안에 이름을 올리고 향회를 장악하려 하였고, 그 결과 사족의 향촌 지배력은 약해지고 수령권이 강화되었다. 사족이 향약과 서원을 통해 향촌을 지배하던 조선 전기의 모습과 대비해 이해해야 한다.","u":"조선시대","c":1},{"k":"신립","y":"1592","s":"신립이 배수의 진을 치고 왜군과 싸웠다.","d":"1592년 임진왜란 초기 삼도 순변사 신립은 조령의 험한 지형 대신 충주 탄금대에서 배수의 진을 치고 기병으로 왜군에 맞섰으나 대패하고 전사하였다. 이 패배로 한성 방어가 무너져 선조는 의주로 피란하게 되었다. 곧이어 이순신의 옥포·한산도 대첩과 김시민의 진주 대첩 등 반격이 이어지는 흐름 속에서 위치를 잡아야 한다.","u":"조선시대","c":1},{"k":"동래성 전투","y":"1592","s":"동래성 전투와 임진왜란","d":"1592년 4월 왜군이 부산진(정발 순절)을 함락한 직후 동래성을 공격하자, 동래 부사 송상현이 '싸워서 죽기는 쉬워도 길을 빌려주기는 어렵다'며 항전하다 순절하였다. 임진왜란 개전 초기의 대표적 관군 항전으로, 이후 왜군은 세 갈래로 북상하였다. 개전 순서(부산진→동래성→충주 탄금대→한성 함락)를 시간 순으로 묻는 문제가 자주 나온다.","u":"조선시대","c":1},{"k":"조일 수호 조규","y":"1876","s":"운요호 사건을 빌미로 조일 수호 조규가 체결되었다.","d":"1875년 일본 군함 운요호가 강화도 초지진과 영종도를 공격한 사건을 구실로, 1876년 조선이 일본과 맺은 최초의 근대적 조약이자 불평등 조약이다. 제1관에서 조선을 '자주국'으로 규정해 청의 종주권을 부정하려 하였고, 부산을 시작으로 원산·인천 등 3개 항구를 차례로 개항하였다. 조미 수호 통상 조약과 달리 최혜국 대우 조항이 없다는 점을 구분해야 한다.","u":"개화기","c":1},{"k":"해안 측량권","y":"1876","s":"일본 측의 해안 측량권을 인정하였다.","d":"1876년 조일 수호 조규 제7관에서 일본에 조선 연안을 자유롭게 측량할 권리를 허용하였고, 제10관에서는 영사 재판권(치외법권)을 인정하였다. 두 조항은 조약의 불평등성을 보여 주는 대표 사례로 함께 출제된다. 부속 조약인 조일 무역 규칙에 관세 규정이 없어 무관세 무역이 이루어졌고, 관세는 1883년 조일 통상 장정 개정에서야 설정되었다.","u":"개화기","c":1},{"k":"최혜국 대우","y":"1882","s":"최혜국 대우를 규정한 조항을 담고 있다.","d":"1882년 청(이홍장)의 알선으로 체결된 조미 수호 통상 조약은 조선이 서양 국가와 맺은 최초의 조약으로, 최혜국 대우를 처음 규정하였다. 거중조정 조항과 관세(협정 관세) 조항도 들어 있으나 영사 재판권을 인정한 불평등 조약이었다. 1876년 강화도 조약에는 최혜국 대우가 없었고, 일본은 1883년 조일 통상 장정 개정으로 뒤늦게 이를 확보하였다.","u":"개화기","c":1},{"k":"공사관 경비병 주둔","y":"1882","s":"일본 공사관의 경비병 주둔을 명시하였다.","d":"1882년 임오군란으로 일본 공사관이 습격당하자 일본은 제물포 조약을 강요하여 배상금 지불과 일본 공사관 경비병 주둔을 명시하였다. 이 조항은 이후 일본군이 서울에 합법적으로 주둔하는 근거가 되었다. 같은 해 청과 맺은 조청 상민 수륙 무역 장정과 혼동하지 않도록 주의해야 한다.","u":"개화기","c":1},{"k":"내지 통상권","y":"1882","s":"외국 상인의 내지 통상권을 최초로 규정하였다.","d":"1882년 임오군란 진압 후 청의 간섭이 강화된 상황에서 체결된 조청 상민 수륙 무역 장정은 조선을 청의 속방으로 명시하고 한성 개잔과 내지 통상을 허용하였다. 외국 상인의 내지 통상권을 최초로 규정한 조약으로, 청 상인이 서울과 내륙까지 진출하는 계기가 되었다. 이후 최혜국 대우를 앞세운 일본 등 다른 나라 상인에게도 내지 진출이 확대되어 객주·여각 등 조선 중개 상인이 큰 타격을 입었다.","u":"개화기","c":1},{"k":"감리서","y":"1883","s":"개항장의 행정과 대외 관계 사무를 관장하는 감리서가 설치되었다.","d":"1883년 부산·원산·인천 등 개항장에 설치되어 통상 사무와 외국인 관련 대외 업무, 개항장 행정을 관장한 기구로 책임자는 감리였다. 초기에는 지방관이 겸임하다가 점차 전담 관청으로 정비되었으며, 개항장 재판소 업무와도 연결되었다. 중앙의 근대적 외교·통상 기구인 통리기무아문(1880)·통리교섭통상사무아문(1882)과 층위가 다르다는 점을 구분해야 한다.","u":"개화기","c":1},{"k":"동문학","y":"1883","s":"통역관 양성을 위해 설치되다","d":"1883년 정부가 묄렌도르프의 건의로 세운 외국어(주로 영어) 통역관 양성 기관으로, 통변학교라고도 불렸다. 1886년 육영공원이 설립되면서 그 기능이 흡수되어 폐지되었다. 육영공원은 헐버트 등 미국인 교사를 초빙해 양반 자제에게 근대 학문을 가르친 관립 학교이므로 동문학과 구분해야 한다.","u":"개화기","c":1},{"k":"이화 학당","y":"1886","s":"최초의 여성 교육 기관으로 건립되다","d":"1886년 미국 감리교 선교사 스크랜튼 부인이 서울에 세운 우리나라 최초의 여성 교육 기관이다. 여성에게 근대 교육의 기회를 제공하여 이후 여성 계몽 운동의 기반이 되었다. 1885년 아펜젤러가 세운 배재 학당, 1883년 덕원·원산 지방관과 지역민이 함께 세운 최초의 근대적 사립 학교 원산 학사와 혼동하지 않아야 한다.","u":"개화기","c":1},{"k":"삼국 간섭","y":"1895","s":"삼국 간섭이 발생한 원인을 분석한다.","d":"1895년 청일 전쟁에서 승리한 일본이 시모노세키 조약으로 랴오둥(요동)반도를 차지하자, 러시아·프랑스·독일이 반환을 요구하여 일본이 이를 돌려준 사건이다. 이를 계기로 조선에서 러시아의 영향력이 커지고 친러 성향 인사들이 정권에 참여하였다. 세력 만회를 노린 일본이 같은 해 을미사변을 일으켜 명성 황후를 시해하는 배경이 되었다.","u":"개화기","c":1},{"k":"황토현 전투","y":"1894","s":"농민군이 황토현에서 관군에 승리하였다.","d":"1894년 제1차 봉기 때 동학 농민군이 전라도 정읍 황토현에서 전라 감영군을 격파한 전투로, 농민군의 첫 대규모 승리였다. 이어 장성 황룡촌 전투에서 중앙에서 파견된 경군까지 물리치고 전주성을 점령하여 전주 화약을 이끌어 냈다. 제2차 봉기에서 관군·일본군에 패한 공주 우금치 전투와 반드시 구분해야 한다.","u":"개화기","c":1},{"k":"교정청","y":"1894","s":"개혁을 추진하기 위해 교정청이 설치되었다.","d":"1894년 전주 화약 이후 조선 정부가 외세 개입 없이 자주적으로 개혁을 추진하기 위해 설치한 기구이다. 그러나 일본군이 경복궁을 점령한 뒤 군국기무처를 설치하면서 곧 폐지되었고, 이로써 제1차 갑오개혁이 시작되었다. 삼정 문란을 바로잡으려 1862년 설치된 삼정이정청과 이름이 비슷하므로 주의해야 한다.","u":"개화기","c":1},{"k":"논산 집결","y":"1894","s":"남접과 북접의 농민군이 논산에 집결하였다.","d":"1894년 일본군의 경복궁 점령과 내정 간섭에 맞서 제2차 봉기가 일어나자, 전봉준의 남접과 손병희가 이끄는 북접 농민군이 논산에 집결하여 연합 부대를 이루었다. 이들은 서울로 북상하다가 공주 우금치에서 관군과 일본군에 크게 패하였다. 이후 전봉준 등 지도부가 체포되면서 동학 농민 운동은 막을 내렸다.","u":"개화기","c":1},{"k":"삼례 집회","y":"1892","s":"교조 신원을 요구하는 삼례 집회가 개최되었다.","d":"1892년 동학교도들이 전라도 삼례에 모여 처형된 교조 최제우의 억울함을 풀어 줄 것(교조 신원)과 포교의 자유, 동학 탄압 중지를 요구한 집회이다. 이듬해 서울 복합 상소와 보은 집회로 이어지며 종교 운동이 사회·정치 운동으로 발전하였다. 특히 보은 집회에서 '척왜양창의' 구호가 등장한 점과 구분해 기억해야 한다.","u":"개화기","c":1},{"k":"고부 봉기","y":"1894","s":"조병갑의 폭정에 항거하여 군민들이 관아를 습격하였다.","d":"1894년 고부 군수 조병갑이 만석보를 쌓아 물세를 강제 징수하는 등 수탈을 일삼자, 전봉준을 중심으로 사발통문을 돌린 농민들이 고부 관아를 습격한 사건이다. 동학 농민 운동의 발단이 되었으며, 사태 수습을 위해 파견된 안핵사 이용태가 참가자를 동학교도로 몰아 탄압하면서 무장·백산에서 제1차 봉기가 일어났다.","u":"개화기","c":1},{"k":"기유각서","y":"1909","s":"기유각서가 체결되어 사법권을 박탈당하였다.","d":"1909년 일제가 대한 제국의 사법권과 감옥 사무를 빼앗아 통감부에 넘기도록 강요한 문서이다. 1904년 제1차 한일 협약(고문 정치), 1905년 을사늑약(외교권 박탈), 1907년 한일 신협약(차관 정치, 부속 각서에 따른 군대 해산)에 이은 국권 침탈 과정의 한 단계이다. 경찰권 박탈은 1910년에 이루어졌으므로 순서를 혼동하지 않아야 한다.","u":"개화기","c":1},{"k":"진위대","y":"1895","s":"친위대와 진위대가 설치되었다.","d":"1895년 을미개혁 때 중앙에는 친위대, 지방에는 진위대를 두어 군제를 개편하였다. 대한 제국 시기 광무개혁으로 병력이 증강되고 원수부(1899)가 설치되면서 군사력 강화가 추진되었다. 1907년 한일 신협약의 부속 각서에 따라 군대가 해산되자 해산 군인들이 의병에 합류하여 정미의병이 강화되었다.","u":"개화기","c":1},{"k":"보국안민·제폭구민","y":"1894","s":"보국안민, 제폭구민을 기치로 내걸었다.","d":"1894년 동학 농민군이 백산에서 봉기하며 '보국안민'과 '제폭구민'을 기치로 내걸고 격문과 4대 강령을 발표하였다. 나라를 돕고 백성을 편안히 하며, 폭정을 없애고 백성을 구한다는 뜻으로 반봉건 성격을 잘 보여 준다. 1893년 보은 집회의 '척왜양창의' 구호나 제2차 봉기의 반외세(항일) 지향과는 성격이 다르다는 점을 구분해야 한다.","u":"개화기","c":1},{"k":"서안평 공격","y":"311","s":"서안평을 공격하여 영토를 확대하였다.","d":"고구려 미천왕은 311년 압록강 하구의 서안평을 점령해 중국과 낙랑을 잇는 통로를 끊었고, 313년 낙랑군을 몰아내 대동강 유역을 확보하였다. 이후 427년 장수왕이 평양으로 천도하는 남진 정책의 기반이 되었다.","u":"삼국시대","c":1},{"k":"천마도","y":"신라","s":"경주 천마총 장니 천마도","d":"천마총에서 나온 말다래(장니)에 자작나무 껍질을 여러 겹 붙이고 하늘을 나는 말을 그린 신라의 그림이다. 말안장 양쪽에 늘어뜨려 흙이 튀는 것을 막는 마구로, 신라의 회화 수준을 보여 주는 드문 자료다.","u":"삼국시대","c":1},{"k":"소지 마립간","y":"493","s":"소지 마립간과 혼인 동맹을 맺었다.","d":"493년 백제 동성왕이 신라 소지 마립간에게 혼인을 청해 이벌찬 비지의 딸을 맞이하면서 나제 동맹이 혼인 동맹으로 강화되었다. 이는 433년 눌지 마립간과 비유왕의 나제 동맹을 잇는 것으로, 고구려 장수왕의 남진에 맞선 공동 대응이었다.","u":"삼국시대","c":1},{"k":"무령왕릉 석수","y":"525","s":"왕과 왕비의 지석, 그리고 석수 등이 출토되었어.","d":"1971년 공주에서 발견된 무령왕릉에서 무덤을 지키는 짐승 모양의 석수와 왕·왕비의 지석이 함께 출토되어 주인이 확인된 유일한 삼국 시대 왕릉이 되었다. 중국 남조 양의 영향을 받은 벽돌무덤(전축분) 양식이라는 점도 함께 출제된다.","u":"삼국시대","c":1},{"k":"남조 양과의 교류","y":"521","s":"중국 남조의 양에 고구려를 여러 차례 격파하고 다시 강국이 되었다는 내용의 국서를 보냈어.","d":"무령왕은 양에 사신과 국서를 보내 백제가 다시 강국이 되었음을 알리고 활발히 교류하였다. 무령왕릉이 남조식 벽돌무덤이고 양직공도에 백제 사신이 그려진 것도 이 교류를 보여 준다.","u":"삼국시대","c":1},{"k":"덕물도","y":"660","s":"왕이 태자 김법민을 보내 병선 100척을 거느리고 덕물도에서 소정방을 맞이하게 하였다.","d":"660년 태자 김법민(뒷날 문무왕)이 덕물도에서 당의 소정방을 맞이하여 나당 연합군의 백제 공격을 조율하였다. 곧이어 계백의 황산벌 항전이 있었고 사비성이 함락되면서 백제가 멸망하였다.","u":"삼국시대","c":1},{"k":"천추총","y":"고구려","s":"국내성 지역에 위치하며, 대형 계단식 돌무지무덤이다.","d":"중국 지린성 지안의 고구려 대형 계단식 돌무지무덤으로, 주변에서 영락(광개토 대왕의 연호)으로 읽히는 명문 기와가 나와 왕릉으로 추정된다. 장군총과 함께 국내성 시기 고구려의 돌무지무덤을 대표한다.","u":"삼국시대","c":1},{"k":"진전사","y":"821","s":"진전사에서 참선하는 선종 승려","d":"신라 하대에 도의선사가 당에서 선종을 들여와 양양 진전사에 머물며 가르침을 폈다. 참선을 통한 깨달음을 강조한 선종은 지방 호족의 후원을 받아 9산 선문으로 발전하였다.","u":"삼국시대","c":1},{"k":"경애왕","y":"927","s":"신라를 공격하여 경애왕을 죽게 하였다.","d":"927년 견훤이 신라의 수도 금성을 습격해 포석정에 있던 경애왕을 자결하게 하고 경순왕을 세웠다. 이를 구원하러 온 왕건은 공산 전투에서 크게 패해 신숭겸·김락을 잃었다.","u":"삼국시대","c":1},{"k":"백좌법회","y":"768","s":"혜공왕 대 재이 발생과 백좌법회 개최","d":"신라에서는 나라에 재해나 변고가 있을 때 인왕경을 읽으며 나라의 평안을 비는 백좌법회(인왕백고좌회)를 열었다. 혜공왕 대에 잦은 천재지변과 진골 귀족의 반란이 이어지면서 이러한 법회가 자주 개최되었다.","u":"삼국시대","c":1},{"k":"충주 고구려비","y":"5세기","s":"고구려비를 품은 충주의 역사를 걷다","d":"충주 고구려비는 국내에 남아 있는 유일한 고구려비로, 5세기 장수왕의 남진 정책으로 고구려가 남한강 유역까지 진출했음을 보여 준다. 비문에 신라를 동이라 부르고 신라 왕에게 의복을 내린 내용이 있어 당시 두 나라의 관계를 알려 준다.","u":"삼국시대","c":1},{"k":"우경의 일반화","y":"고려","s":"소를 이용한 깊이갈이가 일반화되었다.","d":"소를 이용해 땅을 깊이 가는 우경은 신라 지증왕 때 보급되기 시작해 고려 시대에 일반화되었다. 깊이갈이와 시비법 발달로 휴경지가 줄었고, 고려 말에는 2년 3작의 윤작법이 보급되었다.","u":"고려시대","c":1},{"k":"조위총의 난","y":"1174","s":"조위총의 난을 진압하는 군인","d":"1174년 서경 유수 조위총이 무신 정권의 이의방을 몰아낸다는 명분으로 군사를 일으켜 서북면 일대를 장악하였으나 2년 만에 진압되었다. 무신 집권기 지배층 내부의 반발을 보여 주는 사건이다.","u":"고려시대","c":1},{"k":"현화사비","y":"1021","s":"앞면에는 송의 연호인 천희가, 뒷면에는 거란의 연호인 태평이 새겨져 있다.","d":"현종이 부모의 명복을 빌기 위해 세운 현화사의 비석으로, 앞뒤에 송과 거란의 연호가 함께 새겨져 있다. 고려가 거란의 책봉을 받으면서도 송과 교류를 이어 간 실리적 다원 외교를 보여 준다.","u":"고려시대","c":1},{"k":"동녕부","y":"1290","s":"동녕부의 반환을 요청하였다.","d":"원은 1270년 서경에 동녕부를 두어 자비령 이북을 직접 지배하였고, 고려의 거듭된 요청으로 1290년 충렬왕 때 반환되었다. 제주의 탐라총관부, 화주의 쌍성총관부와 함께 원의 영토 지배 기구였다.","u":"고려시대","c":1},{"k":"단산오옥","y":"고려","s":"청주 명암동에서 출토된 단산오옥명 먹","d":"고려의 먹으로, 청주 명암동에서 단산오옥이라는 글씨가 새겨진 먹이 출토되었다. 먹은 주로 소(所)에서 생산되었고 품질이 뛰어나 중국 사신도 언급할 정도로 잘 알려져 있었다.","u":"고려시대","c":1},{"k":"나전 칠기","y":"고려","s":"나전 국화 넝쿨무늬 합","d":"옻칠한 바탕에 조개껍데기를 얇게 오려 붙여 무늬를 낸 공예로, 고려의 나전 칠기는 정교한 국화·넝쿨무늬로 이름이 높았다. 고려청자·은입사와 함께 고려 귀족 문화를 대표하는 공예품이다.","u":"고려시대","c":1},{"k":"은입사","y":"고려","s":"청동 은입사 향완","d":"청동 표면에 홈을 파고 은실을 박아 무늬를 새기는 기법으로, 고려에서 향완과 정병 등에 널리 쓰였다. 청동 은입사 포류수금문 정병이 대표작이다.","u":"고려시대","c":1},{"k":"통천관","y":"고려 초","s":"태조 왕건 청동상이 통천관을 쓰고 있다.","d":"개성 현릉 부근에서 나온 태조 왕건 청동상은 황제가 쓰는 관인 통천관을 쓰고 있어, 고려가 대내적으로 황제국을 표방했음을 보여 준다. 개경을 황도라 부르고 광종이 칭제 건원한 것과 같은 맥락이다.","u":"고려시대","c":1},{"k":"용두사지 철당간","y":"962","s":"준풍이라는 연호가 새겨져 있다.","d":"청주 용두사지 철당간에는 광종의 독자 연호인 준풍 3년(962)이 새겨져 있어 고려 초 황제국 표방의 증거가 된다. 철통을 쌓아 올린 형태로 당간이 온전히 남은 드문 사례다.","u":"고려시대","c":1},{"k":"외왕내제","y":"고려","s":"황제국 표방 사례를 통해 본 외왕내제 의식","d":"고려는 중국에 대해서는 왕을 칭하면서도 안으로는 황제국 체제를 갖추었는데, 이를 외왕내제라 한다. 광종의 칭제 건원, 개경을 황도라 부른 것, 태자·짐 등의 용어 사용이 그 예다.","u":"고려시대","c":1},{"k":"제왕운기","y":"1287","s":"제왕운기를 읽고 있는 왕","d":"1287년 이승휴가 지은 서사시로, 중국과 우리나라의 역사를 시로 읊으면서 단군을 우리 역사의 시작으로 삼았다. 발해를 우리 역사로 서술하여 자주 의식을 드러냈으며, 삼국유사와 함께 원 간섭기 자주 의식을 보여 준다.","u":"고려시대","c":1},{"k":"희종","y":"1211","s":"희종이 그를 암살하려 하였으나 도방의 방해로 실패하였다.","d":"1211년 희종이 최충헌을 제거하려 했으나 도방의 호위로 실패하였고, 오히려 폐위되어 강화로 유배되었다가 강화 석릉에 묻혔다. 무신 집권기 왕권이 얼마나 약했는지 보여 주는 사건이다.","u":"고려시대","c":1},{"k":"위화도 회군","y":"1388","s":"위화도에서 좌·우군도통사가 글을 올려 회군을 요청하니","d":"1388년 명의 철령위 설치에 반발해 최영이 요동 정벌을 추진하자, 사불가론을 내세운 이성계가 위화도에서 군사를 돌려 최영을 제거하고 실권을 잡았다. 이후 과전법 시행을 거쳐 1392년 조선 건국으로 이어졌다.","u":"고려시대","c":1},{"k":"한양 천도","y":"1394","s":"1394년 한양으로 천도를 단행하였다.","d":"1394년 태조 이성계가 개경에서 한양으로 도읍을 옮기고 경복궁·종묘·사직을 세워 유교 국가의 틀을 갖추었다. 왕자의 난 이후 잠시 개성으로 돌아간 몇 년을 빼면 한양은 500여 년간 조선의 수도였다.","u":"조선시대","c":1},{"k":"승문원","y":"조선","s":"사대교린에 관한 문서를 관장하기 위해 설치되었다.","d":"승문원은 명·청에 보내는 사대 문서와 일본·여진에 보내는 교린 문서를 담당한 관청이다. 홍문관·성균원·교서관과 함께 문관의 요직으로 꼽혔다.","u":"조선시대","c":1},{"k":"시정기","y":"조선","s":"사초와 시정기를 바탕으로 실록을 편찬하였다.","d":"춘추관은 사관이 쓴 사초와 각 관청의 문서를 정리한 시정기, 승정원일기 등을 모아 실록을 편찬하였다. 실록은 왕이 죽은 뒤 실록청에서 만들어 사고에 보관하였고 왕도 함부로 볼 수 없었다.","u":"조선시대","c":1},{"k":"의정부","y":"조선","s":"문하부를 고쳐 의정부로 하였다.","d":"조선은 고려의 문하부를 고쳐 의정부를 두고 영의정·좌의정·우의정이 국정을 합의하게 하였다. 태종과 세조는 6조 직계제로 왕권을 강화했고, 세종과 성종은 의정부 서사제로 재상의 역할을 넓혔다.","u":"조선시대","c":1},{"k":"사간원 독립","y":"1401","s":"낭사를 고쳐 사간원으로 하였다.","d":"태종은 문하부를 없애면서 그 낭사를 떼어 사간원으로 독립시켜 왕에 대한 간쟁을 맡겼다. 사간원은 사헌부·홍문관과 함께 3사를 이루어 권력의 독점을 견제하였다.","u":"조선시대","c":1},{"k":"연분 9등법","y":"1444","s":"풍흉에 따라 9등급으로 전세를 거두었다.","d":"세종은 토지의 비옥도를 6등급으로 나눈 전분 6등법과 그해 풍흉을 9등급으로 나눈 연분 9등법을 실시해 1결당 최고 20두에서 최하 4두를 걷게 하였다. 조세를 합리적으로 매기려 했으나 절차가 복잡해 뒤에는 대개 4두로 굳어졌다.","u":"조선시대","c":1},{"k":"간경도감","y":"1461","s":"간경도감에서 간행한 최초의 불경 언해서이다.","d":"세조는 1461년 간경도감을 설치해 불경을 한글로 번역·간행하였으며, 대불정수능엄경 언해가 그 첫 성과다. 불교를 후원한 세조는 원각사지 십층석탑도 세웠다.","u":"조선시대","c":1},{"k":"진관 체제","y":"1457","s":"진관 체제를 실시하였다.","d":"세조 때 정비된 지방 방어 체제로, 각 도의 요충지에 거진을 두고 주변 고을을 묶어 스스로 방어하게 하였다. 대규모 침입에 약하다는 한계가 드러나 명종 때 제승방략 체제로 바뀌었다가, 임진왜란 뒤 유성룡의 건의로 다시 진관 체제가 복구되었다.","u":"조선시대","c":1},{"k":"조의제문","y":"1498","s":"조의제문을 빌미로 무오사화가 일어났다.","d":"1498년 김종직이 항우에게 죽은 초의 의제를 애도한 조의제문이 사초에 실린 것을 빌미로, 훈구파가 사림을 공격한 무오사화가 일어났다. 세조의 왕위 찬탈을 비판한 글로 해석되어 김종직은 부관참시되었다.","u":"조선시대","c":1},{"k":"사단칠정 논쟁","y":"1559","s":"기대승과 사단칠정 논쟁을 전개하였다.","d":"이황과 기대승이 8년에 걸쳐 편지를 주고받으며 사단과 칠정이 이(理)와 기(氣) 가운데 무엇에서 비롯되는지 논한 조선 성리학의 대표적 논쟁이다. 이 논쟁으로 조선 성리학의 이론 수준이 크게 높아졌다.","u":"조선시대","c":1},{"k":"대공수미법","y":"1594","s":"훈련도감 설치를 건의하고 공납의 폐단을 시정하고자 대공수미법을 제안하였다.","d":"임진왜란 중 유성룡은 공물을 현물 대신 쌀로 내게 하는 대공수미법을 제안해 방납의 폐단을 바로잡고자 하였으나 널리 시행되지는 못하였다. 이 구상은 뒷날 광해군 때의 대동법으로 이어졌다.","u":"조선시대","c":1},{"k":"징비록","y":"1604","s":"임진왜란의 상황 등을 담은 징비록을 저술하였다.","d":"유성룡이 임진왜란이 끝난 뒤 전쟁의 경과와 교훈을 기록한 책으로, 다시는 같은 잘못을 되풀이하지 말자는 뜻을 담았다. 그는 안동 병산 서원에 배향되었다.","u":"조선시대","c":1},{"k":"병산 서원","y":"1613","s":"안동의 병산 서원으로, 유성룡의 위패가 봉안되어 있습니다.","d":"유성룡을 기리는 안동의 서원으로, 낙동강을 마주한 만대루의 경관이 뛰어나 한국 서원 건축을 대표한다. 2019년 다른 8개 서원과 함께 한국의 서원으로 유네스코 세계유산에 등재되었다.","u":"조선시대","c":1},{"k":"어영대장 북벌","y":"1652","s":"이완이 어영대장으로 임명되어 북벌을 준비하였다.","d":"효종은 청에 당한 치욕을 씻고자 송시열·이완 등과 함께 북벌을 추진하며 어영청을 강화하고 성곽을 정비하였다. 그러나 청의 국력이 커지고 효종이 갑자기 죽으면서 실행되지 못하였고, 오히려 청의 요청으로 나선 정벌에 조총 부대를 보냈다.","u":"조선시대","c":1},{"k":"경신대기근","y":"1670","s":"승정원일기를 통해 본 소빙기 농업 생산과 경신대기근 발생","d":"1670~1671년 현종 때 냉해와 가뭄, 전염병이 겹쳐 수십만 명이 굶어 죽은 대기근으로, 소빙기의 이상 기후와 관련된 것으로 본다. 승정원일기 등 기록을 통해 당시 농업 생산과 재해 대응을 살필 수 있다.","u":"조선시대","c":1},{"k":"이십공신회맹축","y":"1680","s":"개국 공신부터 보사 공신까지의 공신과 그 자손들을 모아 결속을 다지는 회맹 행사를 거행한 후 그 명단 등을 담은 문서","d":"1680년 경신환국의 공신인 보사공신을 책봉한 뒤 역대 공신과 자손을 모아 회맹제를 열고 만든 문서다. 기사환국 때 공신 자격이 박탈되었다가 갑술환국으로 회복되는 등 숙종 대 잦은 환국의 정치 상황을 보여 준다.","u":"조선시대","c":1},{"k":"만동묘","y":"1704","s":"만동묘 복구를 건의하는 유생","d":"임진왜란 때 원군을 보낸 명 신종을 제사하기 위해 1704년 충북 괴산 화양동에 세운 사당으로, 송시열의 뜻을 받든 것이다. 명이 망한 뒤 조선이 중화를 잇는다는 소중화 의식을 보여 주며, 흥선 대원군이 철폐하자 유생들이 크게 반발하였다.","u":"조선시대","c":1},{"k":"소중화","y":"조선 후기","s":"명의 멸망과 소중화주의의 대두","d":"명이 망하고 청이 들어서자 조선의 지배층은 조선이 중화 문명을 잇는다는 소중화 의식을 내세웠다. 만동묘·대보단 설치와 북벌론이 그 산물이며, 이러한 명분론은 뒤에 북학론의 비판을 받았다.","u":"조선시대","c":1},{"k":"동몽선습","y":"조선","s":"동몽선습을 공부하는 서당 학동","d":"박세무가 지은 어린이용 교재로, 오륜의 내용과 중국·우리나라 역사를 간추려 실었다. 천자문 다음 단계의 서당 교재로 널리 쓰였다.","u":"조선시대","c":1},{"k":"백리척","y":"1757","s":"최초로 100리 척을 사용하여 동국지도를 제작하였다.","d":"영조 때 정상기는 100리를 1척으로 잡는 축척인 백리척을 처음 사용해 동국지도를 만들었다. 이로써 지도에 일정한 축척 개념이 도입되었으며, 뒤에 김정호의 대동여지도로 이어졌다.","u":"조선시대","c":1},{"k":"왜관도","y":"1783","s":"변박이 그린 초량 왜관의 전경입니다.","d":"1783년 화원 변박이 부산 초량 왜관의 모습을 그린 그림으로, 관수가를 중심으로 서관과 동관이 나뉘고 50여 개의 건물 이름이 적혀 있다. 조선 후기 대일 무역이 이루어지던 왜관의 구성과 규모를 알려 준다.","u":"조선시대","c":1},{"k":"산대놀이","y":"조선 후기","s":"송파장에서 산대놀이를 공연하는 광대","d":"조선 후기 장시가 발달하면서 송파장 등에서 탈을 쓰고 하는 산대놀이가 공연되었다. 양반과 승려를 풍자하는 내용이 많아 서민 의식의 성장을 보여 주며, 판소리·한글 소설과 함께 서민 문화를 이룬다.","u":"조선시대","c":1},{"k":"공노비 해방","y":"1801","s":"각 궁방과 중앙 관서의 공노비 6만여 명을 해방하였다.","d":"1801년 순조는 중앙 관서의 공노비 약 6만 6천 명의 노비 문서를 불태워 해방하였다. 신분제가 흔들리던 흐름을 보여 주며, 노비제 자체는 1894년 1차 갑오개혁에서 폐지되었다.","u":"조선시대","c":1},{"k":"자산어보","y":"1814","s":"정약전이 자산어보를 저술한 곳을 조사한다.","d":"신유박해로 흑산도에 유배된 정약전이 1814년 그 바다의 물고기와 해양 생물 155종을 관찰해 기록한 어류학서다. 동생 정약용은 강진에서 목민심서를 저술하였다.","u":"조선시대","c":1},{"k":"오페르트 도굴 사건","y":"1868","s":"오페르트가 남연군 묘 도굴을 시도하였다.","d":"1868년 독일 상인 오페르트가 통상을 요구하며 흥선 대원군의 아버지 남연군의 묘를 도굴하려다 실패하였다. 이 사건으로 서양에 대한 반감이 커져 통상 수교 거부 정책이 더욱 굳어졌다.","u":"개화기","c":1},{"k":"정족산성 전투","y":"1866","s":"양헌수가 순무영에 승전보를 띄워 보냈다.","d":"1866년 병인양요 때 양헌수가 강화도 정족산성에서 프랑스군을 격퇴하였고, 문수산성에서는 한성근이 맞섰다. 병인박해로 프랑스 신부와 신자들이 처형된 것이 이 사건의 배경이다.","u":"개화기","c":1},{"k":"조선책략","y":"1880","s":"김홍집이 가지고 온 조선책략이 조선에 유포되었다.","d":"1880년 수신사 김홍집이 청의 외교관 황준헌이 쓴 조선책략을 들여왔는데, 러시아를 막기 위해 친중국·결일본·연미국하라는 내용이었다. 미국과 수교하는 계기가 되었으나 이만손 등 영남 유생의 만인소를 부르기도 하였다.","u":"개화기","c":1},{"k":"왜양일체론","y":"1876","s":"지부복궐척화의소를 올려 왜양일체론을 주장하였다.","d":"1876년 강화도 조약 체결에 반대해 최익현은 도끼를 들고 궁궐 앞에 엎드려 상소하는 지부복궐척화의소를 올리며, 일본과 서양이 다르지 않다는 왜양일체론을 폈다. 그는 뒤에 을사늑약에 맞서 태인에서 의병을 일으켰다.","u":"개화기","c":1},{"k":"기기창","y":"1883","s":"근대식 무기 제조 시설인 기기창을 설립하였다.","d":"청에 파견된 영선사가 배운 기술을 바탕으로 1883년 서울에 근대식 무기 제조 공장인 기기창을 세웠다. 같은 해 인쇄를 맡은 박문국과 화폐를 만든 전환국도 설치되었다.","u":"개화기","c":1},{"k":"삼군부 부활","y":"1865","s":"비변사를 혁파하여 의정부와 삼군부의 기능을 회복하였다.","d":"흥선 대원군은 세도 정치의 기반이던 비변사를 없애고 정치는 의정부, 군사는 삼군부가 맡도록 하여 왕권을 강화하였다. 경복궁 중건, 서원 철폐, 호포제·사창제 실시도 같은 개혁의 일환이다.","u":"개화기","c":1},{"k":"묄렌도르프","y":"1882","s":"임오군란을 진압한 청의 추천을 받아 조선의 외교 고문으로 부임하였다.","d":"임오군란 이후 청의 내정 간섭이 심해지면서 청의 추천으로 독일인 묄렌도르프가 외교 고문으로 부임하였다. 그는 통리교섭통상사무아문에서 일하며 조선의 외교와 해관 업무를 맡았다.","u":"개화기","c":1},{"k":"중명전","y":"1905","s":"대한 제국 시기 황실 도서관 등으로 이용되었던 곳으로 조약이 강제 체결된 장소임","d":"덕수궁 중명전은 1905년 일본이 을사늑약을 강제로 체결한 장소다. 조약에 항거해 민영환이 유서를 남기고 자결하였고, 고종은 헤이그에 특사를 보내 무효를 알리려 하였다.","u":"개화기","c":1},{"k":"자신회","y":"1907","s":"나철, 오기호 등이 조약에 찬성한 다섯 명의 대신들을 처단하기 위해 조직함","d":"나철·오기호 등이 을사오적을 처단하기 위해 조직한 단체로, 1907년 암살을 시도했으나 실패하였다. 나철은 뒤에 단군 신앙을 내세운 대종교를 창시하였다.","u":"개화기","c":1},{"k":"스티븐스","y":"1904","s":"스티븐스가 외교 고문으로 부임하는 계기가 되었다.","d":"1904년 제1차 한일 협약으로 일본이 추천한 메가타가 재정 고문, 미국인 스티븐스가 외교 고문으로 부임하여 고문 정치가 시작되었다. 스티븐스는 1908년 샌프란시스코에서 장인환·전명운에게 저격당하였다.","u":"개화기","c":1},{"k":"사민필지","y":"1889","s":"미국인 헐버트가 이 학교의 교사 시절 한글로 지은 세계 지리서이다.","d":"헐버트가 육영 공원 교사로 있으면서 한글로 지은 세계 지리 교과서로, 각국의 지리와 문화를 소개하였다. 그는 뒤에 헤이그 특사를 도우며 한국 독립을 위해 활동하였다.","u":"개화기","c":1},{"k":"좌원과 우원","y":"1886","s":"좌원과 우원을 구분하여 학생을 선발하였다.","d":"1886년 세워진 관립 근대 학교 육영 공원은 현직 관리를 뽑는 좌원과 양반 자제를 뽑는 우원으로 나누어 운영하였다. 헐버트·길모어 등 미국인 교사를 초빙해 영어·산학·지리를 가르쳤다.","u":"개화기","c":1},{"k":"유기와 신집","y":"600","s":"역사서인 유기와 신집을 편찬하였다.","d":"고구려는 일찍이 유기 100권을 편찬하였고, 600년 영양왕 때 이문진이 이를 간추려 신집 5권을 지었다. 백제의 서기(근초고왕), 신라의 국사(진흥왕)와 함께 삼국의 역사 편찬 사례로 함께 출제된다.","u":"삼국시대","c":1},{"k":"병부 설치","y":"517","s":"병부를 설치하고 율령을 반포하였다.","d":"법흥왕은 517년 군사 업무를 맡는 병부를 두고 520년 율령을 반포하였으며, 공복을 제정하고 상대등을 설치해 통치 체제를 정비하였다. 527년 이차돈의 순교로 불교를 공인하고 532년 금관가야를 병합하였다.","u":"삼국시대","c":1},{"k":"장수왕의 한성 함락","y":"475","s":"고구려왕 거련이 직접 군사를 거느리고 백제를 공격하였다.","d":"475년 장수왕(이름 거련)이 백제 한성을 함락하고 개로왕을 죽이자, 백제는 웅진으로 도읍을 옮겼다. 앞서 427년 평양 천도로 남진 정책을 본격화하였고, 이때 백제 문주가 신라에 구원을 요청한 것은 나제 동맹에 따른 것이다.","u":"삼국시대","c":1},{"k":"백제 금동 대향로","y":"백제","s":"부여 능산리에서 발견된 금동 대향로","d":"1993년 부여 능산리 절터에서 나온 백제의 걸작으로, 용이 받치고 있는 연꽃 모양 몸체 위에 산봉우리로 둘러싸인 반원형 뚜껑이 있고 꼭대기에 봉황이 앉아 있다. 불교와 도교 요소가 함께 표현되어 백제 금속 공예의 정수로 꼽힌다.","u":"삼국시대","c":1},{"k":"신라 촌락 문서","y":"통일신라","s":"일본 도다이사 쇼소인에서 발견된 촌락 문서","d":"서원경 부근 4개 촌락의 인구와 토지, 소·말·뽕나무·잣나무의 수까지 3년마다 조사해 기록한 문서로, 조세 수취와 노동력 동원에 활용하기 위해 촌주가 작성하였다. 통일신라의 촌락 지배와 경제 상황을 보여 주는 1차 사료다.","u":"삼국시대","c":1},{"k":"9주 5소경","y":"685","s":"전국을 9주로 나누고 행정 구역을 정비하였어.","d":"신문왕은 전국을 9주로 나누고 수도가 동남쪽에 치우친 것을 보완하기 위해 5소경을 두었으며, 중앙군은 고구려·백제·말갈인까지 포함한 9서당, 지방군은 10정으로 편성하였다. 국학을 세워 유학을 보급한 것도 이때다.","u":"삼국시대","c":1},{"k":"대승기신론소","y":"원효","s":"대승기신론소를 저술하였다.","d":"원효는 대승기신론소와 금강삼매경론을 지어 여러 종파의 대립을 아우르는 화쟁 사상을 폈고, 무애가를 부르며 불교를 대중에게 널리 알렸다. 화엄일승법계도를 지은 의상과 함께 신라 불교를 대표한다.","u":"삼국시대","c":1},{"k":"쟁장 사건","y":"897","s":"왕자 대봉예가 자신들의 자리를 신라 위에 있게 해 달라고 청하였습니다.","d":"897년 발해 왕자 대봉예가 당의 조공 서열에서 발해를 신라보다 앞세워 달라고 요청했으나 거절당한 사건으로, 최치원이 이를 사은표에 남겼다. 발해와 신라가 국제 무대에서 경쟁했음을 보여 준다.","u":"삼국시대","c":1},{"k":"천통","y":"698","s":"발해 고왕은 연호를 천통으로 했으며","d":"발해를 세운 고왕 대조영은 천통이라는 독자 연호를 사용하였다. 이후 무왕은 인안, 문왕은 대흥, 선왕은 건흥을 써서 중국과 대등하다는 자주 의식을 드러냈다.","u":"삼국시대","c":1},{"k":"선덕왕 즉위","y":"780","s":"김지정 등이 일으킨 반란으로 시해된 선왕의 시호를 혜공이라 하였노라.","d":"780년 김지정의 난 와중에 혜공왕이 죽고 상대등 김양상이 선덕왕으로 즉위하면서 무열왕계 왕통이 끊기고 신라 하대가 시작되었다. 이후 진골 귀족의 왕위 다툼과 지방 반란이 이어졌다.","u":"삼국시대","c":1},{"k":"견훤의 금산사 유폐","y":"935","s":"견훤이 금산사에 있은 지 3개월 만에 막내아들 능예 등과 더불어 금성으로 달아나","d":"935년 견훤이 넷째 아들 금강에게 왕위를 물려주려 하자 맏아들 신검이 아버지를 금산사에 가두고 왕위를 빼앗았다. 석 달 뒤 탈출한 견훤은 왕건에게 귀순하였고, 같은 해 신라 경순왕도 항복하면서 936년 일리천 전투로 후삼국이 통일되었다.","u":"삼국시대","c":1},{"k":"천수","y":"918","s":"고려 태조는 천수를 사용하고","d":"고려 태조 왕건은 즉위와 함께 천수라는 독자 연호를 사용하였고, 뒤에 광종이 광덕·준풍을 썼다. 고려가 대내적으로 황제국을 표방했음을 보여 주는 사례다.","u":"고려시대","c":1},{"k":"왕규의 난","y":"945","s":"왕규가 광주원군을 왕으로 세우고자 하였는데","d":"945년 외척 왕규가 자기 외손인 광주원군을 왕으로 세우려 혜종을 해치려 했으나 실패하였고, 혜종이 죽은 뒤 정종이 왕식렴의 군사를 빌려 왕규를 제거하였다. 태조의 호족 통합을 위한 혼인 정책이 남긴 왕위 다툼을 보여 준다.","u":"고려시대","c":1},{"k":"경학 박사","y":"987","s":"지방 12목에 경학 박사를 처음 파견하였다.","d":"성종은 최승로의 시무 28조를 받아들여 12목에 지방관을 보내
